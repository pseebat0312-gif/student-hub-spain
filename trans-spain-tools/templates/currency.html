<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>汇率计算器 + 记账本 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 100;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  /* 顶部汇率条 */
  .rate-bar {
    display: flex; justify-content: space-around;
    background: rgba(160, 216, 179, 0.08);
    border: 1px solid rgba(160, 216, 179, 0.2);
    border-radius: 14px;
    padding: 14px 10px;
    margin-bottom: 20px;
    text-align: center;
  }
  .rate-bar .rate-item { flex: 1; }
  .rate-bar .rate-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .rate-bar .rate-value { font-size: 14px; font-weight: bold; color: #a0d8b3; }
  .rate-bar .rate-time { font-size: 10px; color: #666; margin-top: 4px; }

  /* Tab 切换 */
  .tab-bar {
    display: flex; gap: 6px; margin-bottom: 16px;
  }
  .tab-btn {
    flex: 1; padding: 12px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 14px;
    cursor: pointer; transition: 0.15s;
  }
  .tab-btn.active { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .tab-btn:active { transform: scale(0.96); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  /* 计算器卡片 */
  .calc-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }

  /* 输入行 */
  .input-row {
    display: flex; gap: 10px; align-items: center;
    margin-bottom: 12px;
  }
  .input-row input {
    flex: 1; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 18px; outline: none;
    font-family: inherit;
  }
  .input-row input:focus { border-color: #a0d8b3; }
  .input-row select {
    padding: 14px 12px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    font-family: inherit; cursor: pointer;
  }
  .input-row select option { background: #1a1a2e; }

  /* 结果显示 */
  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .label { font-size: 13px; color: #888; }
  .result-row .value { font-size: 18px; font-weight: bold; color: #a0d8b3; }

  /* 主按钮 */
  .primary-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
    margin-top: 12px;
  }
  .primary-btn:active { transform: scale(0.97); }

  /* 快捷金额按钮 */
  .quick-amounts {
    display: flex; gap: 8px; flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .quick-amounts button {
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px; cursor: pointer;
    transition: 0.15s;
  }
  .quick-amounts button:active { transform: scale(0.95); background: rgba(160,216,179,0.15); }

  /* 记账列表 */
  .record-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.04);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    font-size: 13px;
  }
  .record-item .rec-left { flex: 1; }
  .record-item .rec-title { color: #fff; font-weight: bold; margin-bottom: 4px; }
  .record-item .rec-meta { color: #888; font-size: 12px; }
  .record-item .rec-amount { color: #a0d8b3; font-weight: bold; margin-right: 12px; }
  .record-item .rec-del {
    background: none; border: none; color: #ff6b6b;
    font-size: 16px; cursor: pointer; padding: 4px;
  }

  .total-box {
    background: rgba(160, 216, 179, 0.1);
    border-radius: 14px;
    padding: 18px;
    text-align: center;
    margin-bottom: 16px;
  }
  .total-box .total-label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .total-box .total-value { font-size: 28px; font-weight: bold; color: #a0d8b3; }

  .empty-state {
    text-align: center; padding: 40px 20px;
    color: #666; font-size: 13px;
  }

  .section-label { font-size: 13px; color: #888; margin-bottom: 8px; }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">💱 汇率计算器 + 记账本</div>
</div>

<div id="content">

  <!-- 顶部汇率条 -->
  <div class="rate-bar" id="rateBar">
    <div class="rate-item">
      <div class="rate-label">💶 欧元 → 💰 人民币</div>
      <div class="rate-value" id="eurToCny">--</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">💶 欧元 → 💵 美元</div>
      <div class="rate-value" id="eurToUsd">--</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">汇率更新</div>
      <div class="rate-value" id="rateTime">加载中</div>
    </div>
  </div>

  <!-- Tab 切换 -->
  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('calc', this)">💱 汇率计算</button>
    <button class="tab-btn" onclick="switchTab('book', this)">📒 记账本</button>
  </div>

  <!-- Tab 1：汇率计算 -->
  <div class="tab-panel active" id="panel-calc">
    <div class="calc-card">
      <div class="section-label">输入金额</div>
      <div class="input-row">
        <input type="number" id="amountInput" placeholder="0.00" oninput="convert()">
        <select id="fromCurrency" onchange="convert()">
          <option value="EUR">💶 欧元</option>
          <option value="CNY">💰 人民币</option>
          <option value="USD">💵 美元</option>
        </select>
      </div>

      <div class="section-label" style="margin-top: 16px;">快捷金额</div>
      <div class="quick-amounts">
        <button onclick="setAmount(10)">10</button>
        <button onclick="setAmount(50)">50</button>
        <button onclick="setAmount(100)">100</button>
        <button onclick="setAmount(500)">500</button>
        <button onclick="setAmount(1000)">1000</button>
      </div>

      <div style="margin-top: 20px;">
        <div class="result-row">
          <span class="label">💶 欧元</span>
          <span class="value" id="resEur">€0.00</span>
        </div>
        <div class="result-row">
          <span class="label">💰 人民币</span>
          <span class="value" id="resCny">¥0.00</span>
        </div>
        <div class="result-row">
          <span class="label">💵 美元</span>
          <span class="value" id="resUsd">$0.00</span>
        </div>
      </div>
    </div>
  </div>

  <!-- Tab 2：记账本 -->
  <div class="tab-panel" id="panel-book">
    <div class="total-box">
      <div class="total-label">本页累计（欧元）</div>
      <div class="total-value" id="totalEur">€0.00</div>
      <div style="font-size: 12px; color: #888; margin-top: 6px;" id="totalAll">≈ ¥0 · $0</div>
    </div>

    <div class="calc-card">
      <div class="section-label">添加一笔支出</div>
      <input type="text" id="recTitle" placeholder="花在什么地方？（例：午饭）" style="width:100%; padding:14px 16px; border-radius:12px; border:1px solid rgba(255,255,255,0.1); background:rgba(255,255,255,0.06); color:#fff; font-size:15px; outline:none; font-family:inherit; margin-bottom:10px;">
      <div class="input-row">
        <input type="number" id="recAmount" placeholder="金额">
        <select id="recCurrency">
          <option value="EUR">💶 欧元</option>
          <option value="CNY">💰 人民币</option>
          <option value="USD">💵 美元</option>
        </select>
      </div>
      <button class="primary-btn" onclick="addRecord()">➕ 添加</button>
    </div>

    <div class="section-label">记账明细</div>
    <div id="recordList"></div>

    <button class="primary-btn" style="background: rgba(255,107,157,0.15); color: #ff6b9d; border: 1px solid rgba(255,107,157,0.3); margin-top: 16px;" onclick="clearAll()">🗑️ 清空全部记录</button>
  </div>

</div>

<script>
  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) window.history.back();
    else location.href = '/?tab=tools';
  }

  // ===== 汇率（默认值，等 API 回来后覆盖） =====
  let rates = {
    EUR_TO_CNY: 7.85,
    EUR_TO_USD: 1.08,
    updatedAt: '默认汇率'
  };

  // ===== 更新汇率 =====
  async function fetchRates() {
    try {
      // 使用免费 API：exchangerate.host
      const resp = await fetch('https://api.exchangerate.host/latest?base=EUR');
      const data = await resp.json();
      if (data && data.rates) {
        rates.EUR_TO_CNY = data.rates.CNY;
        rates.EUR_TO_USD = data.rates.USD;
        rates.updatedAt = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) {
      rates.updatedAt = '默认汇率';
    }
    renderRateBar();
    convert();
  }

  function renderRateBar() {
    document.getElementById('eurToCny').textContent = '¥' + rates.EUR_TO_CNY.toFixed(2);
    document.getElementById('eurToUsd').textContent = '$' + rates.EUR_TO_USD.toFixed(2);
    document.getElementById('rateTime').textContent = rates.updatedAt;
  }

  // ===== Tab 切换 =====
  function switchTab(tab, el) {
    if (navigator.vibrate) navigator.vibrate(8);
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  // ===== 设置金额 =====
  function setAmount(v) {
    if (navigator.vibrate) navigator.vibrate(8);
    document.getElementById('amountInput').value = v;
    convert();
  }

  // ===== 换算（核心） =====
  function convert() {
    const amount = parseFloat(document.getElementById('amountInput').value) || 0;
    const from = document.getElementById('fromCurrency').value;

    let eur = 0;
    if (from === 'EUR') eur = amount;
    else if (from === 'CNY') eur = amount / rates.EUR_TO_CNY;
    else if (from === 'USD') eur = amount / rates.EUR_TO_USD;

    const cny = eur * rates.EUR_TO_CNY;
    const usd = eur * rates.EUR_TO_USD;

    document.getElementById('resEur').textContent = '€' + eur.toFixed(2);
    document.getElementById('resCny').textContent = '¥' + cny.toFixed(2);
    document.getElementById('resUsd').textContent = '$' + usd.toFixed(2);
  }

  // ===== 记账功能 =====
  let records = JSON.parse(localStorage.getItem('spain_records') || '[]');

  function saveRecords() {
    localStorage.setItem('spain_records', JSON.stringify(records));
  }

  function renderRecords() {
    const list = document.getElementById('recordList');
    if (records.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有记账记录</div>';
    } else {
      list.innerHTML = '';
      records.forEach((r, i) => {
        const div = document.createElement('div');
        div.className = 'record-item';
        div.innerHTML = `
          <div class="rec-left">
            <div class="rec-title">${r.title}</div>
            <div class="rec-meta">${r.time}</div>
          </div>
          <div class="rec-amount">€${r.eur.toFixed(2)}</div>
          <button class="rec-del" onclick="delRecord(${i})">✕</button>
        `;
        list.appendChild(div);
      });
    }

    // 更新合计
    const totalEur = records.reduce((sum, r) => sum + r.eur, 0);
    document.getElementById('totalEur').textContent = '€' + totalEur.toFixed(2);
    document.getElementById('totalAll').textContent =
      `≈ ¥${(totalEur * rates.EUR_TO_CNY).toFixed(2)} · $${(totalEur * rates.EUR_TO_USD).toFixed(2)}`;
  }

  function addRecord() {
    const title = document.getElementById('recTitle').value.trim();
    const amount = parseFloat(document.getElementById('recAmount').value);
    const currency = document.getElementById('recCurrency').value;

    if (!title || !amount) {
      alert('请填写地点和金额');
      return;
    }

    if (navigator.vibrate) navigator.vibrate(15);

    let eur = 0;
    if (currency === 'EUR') eur = amount;
    else if (currency === 'CNY') eur = amount / rates.EUR_TO_CNY;
    else if (currency === 'USD') eur = amount / rates.EUR_TO_USD;

    records.unshift({
      title: title,
      eur: eur,
      original: amount,
      originalCurrency: currency,
      time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' })
    });
    saveRecords();
    renderRecords();

    document.getElementById('recTitle').value = '';
    document.getElementById('recAmount').value = '';
  }

  function delRecord(i) {
    if (navigator.vibrate) navigator.vibrate(8);
    if (!confirm('删除这条记录吗？')) return;
    records.splice(i, 1);
    saveRecords();
    renderRecords();
  }

  function clearAll() {
    if (navigator.vibrate) navigator.vibrate(15);
    if (!confirm('确定清空所有记账记录吗？')) return;
    records = [];
    saveRecords();
    renderRecords();
  }

  // ===== 初始化 =====
  fetchRates();
  renderRecords();
</script>
</body>
</html>
