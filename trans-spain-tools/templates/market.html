<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>留学生二手市场 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  /* 顶部提示 */
  .notice {
    font-size: 12px; color: #888;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* 发布按钮 */
  .publish-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
    margin-bottom: 16px;
  }
  .publish-btn:active { transform: scale(0.97); }

  /* 发布表单 */
  .form-card {
    display: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .form-card.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .form-card input, .form-card textarea {
    width: 100%; padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 10px; font-family: inherit;
  }
  .form-card textarea { height: 70px; resize: none; }
  .form-card input:focus, .form-card textarea:focus { border-color: #a0d8b3; }

  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions button {
    flex: 1; padding: 12px;
    border-radius: 12px; border: none;
    font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .form-actions .cancel { background: rgba(255,255,255,0.1); color: #ccc; }
  .form-actions .submit { background: linear-gradient(135deg, #4a7c59, #2d5a3d); color: #fff; }

  /* 排序栏 */
  .sort-bar {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .sort-bar::-webkit-scrollbar { display: none; }
  .sort-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px;
    white-space: nowrap; cursor: pointer;
    transition: 0.2s;
  }
  .sort-btn.active { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .sort-btn:active { transform: scale(0.95); }

  /* 商品卡片 */
  .item-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    transition: 0.15s;
  }
  .item-card:active { transform: scale(0.98); }
  .item-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px;
  }
  .item-title { font-size: 16px; font-weight: bold; color: #fff; flex: 1; }
  .item-price { font-size: 15px; color: #a0d8b3; font-weight: bold; margin-left: 8px; }
  .item-desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 10px; }
  .item-image {
    width: 100%; border-radius: 10px; margin-bottom: 10px;
    max-height: 180px; object-fit: cover;
  }
  .item-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #888;
  }
  .item-actions { display: flex; gap: 8px; margin-top: 12px; }
  .item-actions button {
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px; cursor: pointer;
    transition: 0.15s;
  }
  .item-actions button:active { transform: scale(0.95); background: rgba(160, 216, 179, 0.15); }
  .item-actions .primary { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .item-actions .danger { color: #ff6b6b; }

  /* 空状态 */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: #666; font-size: 14px;
  }

  /* 详情弹窗 */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none; justify-content: center; align-items: flex-end;
    z-index: 100;
  }
  .detail-modal.show { display: flex; }
  .detail-content {
    background: #1a1a2e;
    width: 100%; max-width: 500px;
    border-radius: 25px 25px 0 0;
    padding: 24px 20px 35px;
    max-height: 80vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-content h3 { font-size: 18px; margin-bottom: 12px; color: #a0d8b3; }
  .detail-content p { font-size: 14px; color: #ccc; line-height: 1.7; margin-bottom: 12px; }
  .detail-content .close-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: rgba(255,255,255,0.08);
    color: #fff; font-size: 15px; cursor: pointer; margin-top: 16px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🛒 留学生二手市场</div>
</div>

<div id="content">

  <div class="notice">
    💡 此平台仅作为沟通媒介，不涉及交易。请通过买家提供的联系方式进行后续交易。
  </div>

  <!-- 发布按钮 -->
  <button class="publish-btn" onclick="togglePublish()">➕ 发布我要卖的东西</button>

  <!-- 发布表单 -->
  <div class="form-card" id="publishForm">
    <input type="text" id="itemTitle" placeholder="物品名称 *">
    <textarea id="itemDesc" placeholder="物品描述"></textarea>
    <input type="text" id="itemPrice" placeholder="价格（欧元）">
    <input type="text" id="itemContact" placeholder="联系方式（微信 / WhatsApp）*">
    <input type="text" id="itemImage" placeholder="图片链接（可选，建议用图床链接）">
    <select id="itemCategory">
      <option value="">📂 选择分类</option>
      <option value="家具">🛋️ 家具</option>
      <option value="教材">📚 教材</option>
      <option value="电子产品">💻 电子产品</option>
      <option value="生活用品">🧴 生活用品</option>
      <option value="出行工具">🚲 出行工具</option>
      <option value="其他">📦 其他</option>
    </select>
    <div class="form-actions">
      <button class="cancel" onclick="togglePublish()">取消</button>
      <button class="submit" onclick="submitItem()">发布</button>
    </div>
  </div>
<!-- 搜索框 -->
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 搜索物品名称、描述..." oninput="onSearch()">
  </div>

  <!-- 排序栏 -->
  <div class="sort-bar">
    <button class="sort-btn active" data-sort="new" onclick="sortBy('new', this)">最新发布</button>
    <button class="sort-btn" data-sort="price" onclick="sortBy('price', this)">价格最低</button>
    <button class="sort-btn" data-sort="views" onclick="sortBy('views', this)">最多浏览</button>
    <button class="sort-btn" data-sort="fav" onclick="sortBy('fav', this)">只看收藏</button>
  </div>

  <!-- 商品列表（目前是演示数据，等接数据库后直接替换） -->
  <div id="itemList">
    <div class="item-card">
      <div class="item-head">
        <div class="item-title">宜家书桌（九成新）</div>
        <div class="item-price">€45</div>
      </div>
      <div class="item-desc">去年买的，用了半年，因为要搬家出掉。自提。</div>
      <div class="item-meta">
        <span>👀 12 次浏览</span>
        <span>⭐ 收藏</span>
      </div>
      <div class="item-actions">
        <button class="primary" onclick="showDetail('宜家书桌（九成新）', '去年买的，用了半年，因为要搬家出掉。自提。', '€45', '微信：molly2026')">查看详情</button>
        <button>⭐ 收藏</button>
      </div>
    </div>

    <div class="item-card">
      <div class="item-head">
        <div class="item-title">西语 A1 教材</div>
        <div class="item-price">€15</div>
      </div>
      <div class="item-desc">附带笔记，适合初学者。</div>
      <div class="item-meta">
        <span>👀 5 次浏览</span>
        <span>⭐ 收藏</span>
      </div>
      <div class="item-actions">
        <button class="primary" onclick="showDetail('西语 A1 教材', '附带笔记，适合初学者。', '€15', 'WhatsApp：+34 600 000 000')">查看详情</button>
        <button>⭐ 收藏</button>
      </div>
    </div>
  </div>

</div>

<!-- 详情弹窗 -->
<div class="detail-modal" id="detailModal">
  <div class="detail-content">
    <h3 id="detailTitle">商品标题</h3>
    <p id="detailDesc">商品描述</p >
    <p id="detailPrice" style="color:#a0d8b3; font-weight:bold;"></p >
    <p id="detailContact" style="color:#fff;"></p >
    <button class="close-btn" onclick="closeDetail()">关闭</button>
  </div>
</div>

<script>
    // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    // 如果是从别的页面跳进来的（有历史记录），就返回上一页
    if (window.history.length > 1) {
      window.history.back();
    } else {
      // 如果用户是直接打开这个链接的，就回主页
      location.href = '/';
    }
  }
  // ===== 展开/折叠发布表单 =====
  function togglePublish() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('publishForm').classList.toggle('show');
  }

  // ===== 提交发布（目前只做前端验证，等接数据库后写入） =====
  function submitItem() {
    const title = document.getElementById('itemTitle').value.trim();
    const contact = document.getElementById('itemContact').value.trim();
    if (!title || !contact) {
      alert('名称和联系方式不能为空');
      return;
    }
    if (navigator.vibrate) navigator.vibrate(20);
    alert('✅ 已填写完毕。\n\n等我们接上 Supabase 后，点这里就会直接发布到数据库。');
    togglePublish();
  }

  // ===== 排序（目前只是切换按钮样式，接数据后按字段排序） =====
  function sortBy(type, el) {
    if (navigator.vibrate) navigator.vibrate(10);
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    // 接数据后，这里会根据 type 重新渲染 itemList
  }

  // ===== 显示详情 =====
  function showDetail(title, desc, price, contact) {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('detailTitle').textContent = title;
    document.getElementById('detailDesc').textContent = desc;
    document.getElementById('detailPrice').textContent = '💶 ' + price;
    document.getElementById('detailContact').textContent = '📞 ' + contact;
    document.getElementById('detailModal').classList.add('show');
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('show');
  }
</script>
</body>
</html>
