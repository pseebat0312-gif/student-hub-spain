<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>探店地图 · 西班牙留学生工具站</title>

<!-- Leaflet 地图库 -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 9999;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
    position: relative; z-index: 10000;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 0 20px 40px; }

  /* 地图容器 */
  #map {
    width: 100%; height: 380px;
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 16px;
    border: 1px solid rgba(255,255,255,0.1);
    z-index: 1;
  }

  /* 按钮 */
  .publish-btn {
    width: 100%; padding: 16px; border-radius: 16px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; margin-bottom: 16px;
  }
  .publish-btn:active { transform: scale(0.97); }

  /* 发布表单 */
  .form-card {
    display: none; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 18px; margin-bottom: 20px;
  }
  .form-card.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .form-card input, .form-card textarea, .form-card select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 10px; font-family: inherit;
  }
  .form-card textarea { height: 70px; resize: none; }
  .form-card select option { background: #1a1a2e; }

  .radio-row { display: flex; gap: 10px; margin-bottom: 10px; }
  .radio-row label {
    flex: 1; padding: 10px; text-align: center;
    background: rgba(255,255,255,0.06); border-radius: 12px;
    font-size: 14px; cursor: pointer;
    border: 2px solid transparent;
  }
  .radio-row input { display: none; }
  .radio-row input:checked + span { color: #a0d8b3; font-weight: bold; }
  .radio-row label:has(input:checked) { border-color: #a0d8b3; background: rgba(160,216,179,0.15); }

  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions button {
    flex: 1; padding: 12px; border-radius: 12px;
    border: none; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .form-actions .cancel { background: rgba(255,255,255,0.1); color: #ccc; }
  .form-actions .submit { background: linear-gradient(135deg, #4a7c59, #2d5a3d); color: #fff; }

  /* 店铺列表 */
  .shop-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 16px; margin-bottom: 12px;
    cursor: pointer; transition: 0.15s;
  }
  .shop-card:active { transform: scale(0.98); }
  .shop-card .shop-name { font-size: 15px; font-weight: bold; color: #fff; margin-bottom: 4px; }
  .shop-card .shop-meta { font-size: 12px; color: #888; margin-bottom: 6px; }
  .shop-card .shop-desc { font-size: 13px; color: #bbb; line-height: 1.5; }
  .shop-card .shop-reactions { font-size: 12px; color: #888; margin-top: 8px; }

  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px; border-radius: 10px;
    font-size: 13px; color: #ccc; line-height: 1.6; margin-top: 20px;
  }

  /* Leaflet 弹窗深色模式微调 */
  .leaflet-popup-content-wrapper {
    background: #1a1a2e; color: #fff;
    border-radius: 12px;
  }
  .leaflet-popup-content { margin: 12px; }
  .leaflet-popup-tip { background: #1a1a2e; }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🗺️ 留学生探店地图</div>
</div>

<div id="content">

  <!-- 地图 -->
  <div id="map"></div>

  <!-- 发布按钮 -->
  <button class="publish-btn" onclick="togglePublish()">➕ 推荐一家店</button>

  <!-- 发布表单 -->
  <div class="form-card" id="publishForm">
    <input type="text" id="shopName" placeholder="店名 *">
    <input type="text" id="shopAddress" placeholder="地址（例如：Madrid, Calle Gran Vía 1）*">
    <select id="shopCity">
      <option value="">选择城市</option>
      <option>马德里</option>
      <option>巴塞罗那</option>
      <option>瓦伦西亚</option>
      <option>塞维利亚</option>
      <option>其他</option>
    </select>
    <select id="shopCategory">
      <option value="">选择类别</option>
      <option>中餐</option>
      <option>奶茶</option>
      <option>咖啡</option>
      <option>西餐</option>
      <option>甜品</option>
      <option>其他</option>
    </select>
    <textarea id="shopDesc" placeholder="推荐理由"></textarea>

    <div class="radio-row">
      <label><input type="radio" name="rec" value="recommend" checked><span>👍 推荐</span></label>
      <label><input type="radio" name="rec" value="avoid"><span>👎 避雷</span></label>
    </div>

    <div class="form-actions">
      <button class="cancel" onclick="togglePublish()">取消</button>
      <button class="submit" onclick="submitShop()">发布</button>
    </div>
  </div>

  <!-- 店铺列表 -->
  <div id="shopList"></div>

  <div class="tip-box">
    💡 提示：地址栏尽量写得详细（街道 + 城市），系统会自动帮你在地图上定位。地址越准，定位越准。
  </div>

</div>

<script>
  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/?tab=tools';
    }
  }

  // ===== 初始化地图 =====
  const map = L.map('map').setView([40.4168, -3.7038], 12);

  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    attribution: '© OpenStreetMap',
    maxZoom: 19
  }).addTo(map);

  // 存储所有店铺（现在是本地数组，等接数据库时替换）
  let shops = [
    {
      id: 1,
      name: '小四川中餐馆',
      address: 'Calle Gran Vía 1, Madrid',
      city: '马德里',
      category: '中餐',
      description: '味道很正，老板娘热情。',
      latitude: 40.4200,
      longitude: -3.7050,
      isRecommend: true,
      reviews: []
    },
    {
      id: 2,
      name: '某奶茶店',
      address: 'Calle Fuencarral 50, Madrid',
      city: '马德里',
      category: '奶茶',
      description: '太贵了，味道一般。',
      latitude: 40.4220,
      longitude: -3.7020,
      isRecommend: false,
      reviews: []
    }
  ];

  let markers = [];

  // ===== 渲染店铺 =====
  function renderShops() {
    markers.forEach(m => map.removeLayer(m));
    markers = [];

    shops.forEach(s => {
      const color = s.isRecommend ? 'green' : 'red';

      const marker = L.circleMarker([s.latitude, s.longitude], {
        radius: 9,
        color: color,
        fillColor: color,
        fillOpacity: 0.9,
        weight: 2
      }).addTo(map);

      const popupHtml = `
        <div style="font-family: sans-serif; min-width: 180px;">
          <div style="font-weight: bold; font-size: 14px; margin-bottom: 4px;">${s.name}</div>
          <div style="font-size: 12px; color: #888; margin-bottom: 6px;">${s.city} · ${s.category}</div>
          <div style="font-size: 13px; margin-bottom: 6px;">${s.description}</div>
          <div style="font-size: 12px; color: ${s.isRecommend ? '#2ecc71' : '#e74c3c'};">
            ${s.isRecommend ? '👍 推荐' : '👎 避雷'}
          </div>
        </div>
      `;
      marker.bindPopup(popupHtml);
      markers.push(marker);
    });

    const list = document.getElementById('shopList');
    list.innerHTML = '';
    shops.forEach(s => {
      const card = document.createElement('div');
      card.className = 'shop-card';
      card.innerHTML = `
        <div class="shop-name">${s.name}</div>
        <div class="shop-meta">${s.city} · ${s.category}</div>
        <div class="shop-desc">${s.description}</div>
        <div class="shop-reactions">${s.isRecommend ? '👍 推荐' : '👎 避雷'}</div>
      `;
      card.onclick = () => {
        if (navigator.vibrate) navigator.vibrate(10);
        map.flyTo([s.latitude, s.longitude], 16, { duration: 0.8 });
      };
      list.appendChild(card);
    });
  }

  renderShops();

  // ===== 发布表单 =====
  function togglePublish() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('publishForm').classList.toggle('show');
  }

  // ===== 提交店铺（调 Nominatim 拿经纬度） =====
  async function submitShop() {
    const name = document.getElementById('shopName').value.trim();
    const address = document.getElementById('shopAddress').value.trim();
    const city = document.getElementById('shopCity').value;
    const category = document.getElementById('shopCategory').value;
    const desc = document.getElementById('shopDesc').value.trim();
    const rec = document.querySelector('input[name="rec"]:checked').value === 'recommend';

    if (!name || !address) {
      alert('店名和地址不能为空');
      return;
    }

    if (navigator.vibrate) navigator.vibrate(15);

    const url = `https://nominatim.openstreetmap.org/search?q=${encodeURIComponent(address)}&format=json&limit=1`;
    try {
      const resp = await fetch(url, {
        headers: { 'User-Agent': 'spain-student-hub' }
      });
      const data = await resp.json();

      if (!data || data.length === 0) {
        alert('找不到这个地址，请写得更详细');
        return;
      }

      const lat = parseFloat(data[0].lat);
      const lng = parseFloat(data[0].lon);

      shops.push({
        id: Date.now(),
        name: name,
        address: address,
        city: city,
        category: category,
        description: desc,
        latitude: lat,
        longitude: lng,
        isRecommend: rec,
        reviews: []
      });

      renderShops();
      togglePublish();
      map.flyTo([lat, lng], 16, { duration: 0.8 });
      alert('✅ 已添加。\n\n等接上 Supabase 后，这里会真的写入 shops 表。');
    } catch (e) {
      alert('查询地址失败，请检查网络或稍后重试');
    }
  }
</script>
<script src="/static/js/auth-gate.js"></script>
</body>
</html>
