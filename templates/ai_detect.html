<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>AI 文本检测器 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  /* 顶部返回 */
  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  /* 内容区 */
  #content { padding: 10px 20px 40px; }

  /* 输入框 */
  .input-box {
    width: 100%;
    min-height: 160px;
    padding: 16px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 15px;
    outline: none; resize: vertical;
    font-family: inherit; line-height: 1.6;
    margin-bottom: 16px;
  }
  .input-box:focus { border-color: #a0d8b3; }

  /* 主按钮 */
  .big-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
    box-shadow: 0 6px 20px rgba(74,124,89,0.3);
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* 结果卡片 */
  .result-card {
    margin-top: 24px;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    display: none;
  }
  .result-card.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .result-card .big-icon { font-size: 48px; margin-bottom: 12px; }
  .result-card .result-text { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  .result-card .result-sub { font-size: 14px; opacity: 0.8; }

  /* 不同结果的颜色 */
  .result-ai { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; }
  .result-ai .result-text { color: #e74c3c; }
  .result-maybe { background: rgba(241, 196, 15, 0.15); border: 1px solid #f1c40f; }
  .result-maybe .result-text { color: #f1c40f; }
  .result-human { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; }
  .result-human .result-text { color: #2ecc71; }

  /* 分析数据 */
  .stats-row {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat-box .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat-box .value { font-size: 18px; font-weight: bold; color: #a0d8b3; }

  /* 提示框 */
  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-top: 20px;
  }
</style>
</head>
<body>

<!-- 顶部导航 -->
<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🔍 AI 文本检测器</div>
</div>

<!-- 内容 -->
<div id="content">

  <p style="color: #888; font-size: 14px; margin-bottom: 20px; line-height: 1.6;">
    粘贴一段文本，判断它是人类写的还是 AI 生成的。基于数学统计法，秒级出结果。
  </p >

  <!-- 输入框 -->
  <textarea class="input-box" id="textInput" placeholder="在这里粘贴要检测的文本..."></textarea>

  <!-- 检测按钮 -->
  <button class="big-btn" id="detectBtn" onclick="detect()">开始检测</button>

  <!-- 结果展示 -->
  <div class="result-card" id="resultCard">
    <div class="big-icon" id="resultIcon">🤖</div>
    <div class="result-text" id="resultText">AI 生成</div>
    <div class="result-sub" id="resultSub">可能性：85.2%</div>

    <!-- 分析数据 -->
    <div class="stats-row">
      <div class="stat-box">
        <div class="label">句子波动性</div>
        <div class="value" id="burstVal">0.00</div>
      </div>
      <div class="stat-box">
        <div class="label">词汇多样性</div>
        <div class="value" id="diverVal">0.00</div>
      </div>
    </div>
  </div>

  <!-- 提示 -->
  <div class="tip-box">
    💡 提示：突发性越低、词汇越单调，越可能是 AI。人类写作通常有长短句交错和更丰富的用词。
  </div>

</div>

<script>
    // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    // 如果是从别的页面跳进来的（有历史记录），就返回上一页
    if (window.history.length > 1) {
      window.history.back();
    } else {
      // 如果用户是直接打开这个链接的，就回主页
      location.href = '/';
    }
  }
  // ===== 核心算法（从 Python 翻译成 JS） =====

  // 1. 计算句子波动性 (Burstiness)
  function calculateBurstiness(text) {
    // 按 . ! ? 。！？ 和换行拆成句子
    const sentences = text.split(/[.!?。！？\n]+/)
      .map(s => s.trim())
      .filter(s => s.length > 3);

    if (sentences.length < 2) return 0.5;

    const lengths = sentences.map(s => s.length);
    const avg = lengths.reduce((a, b) => a + b, 0) / lengths.length;
    const variance = lengths.reduce((sum, l) => sum + Math.pow(l - avg, 2), 0) / lengths.length;
    const stdDev = Math.sqrt(variance);

    return Math.min(stdDev / (avg + 1), 1.0);
  }

  // 2. 计算词汇多样性 (Lexical Diversity)
  function calculateLexicalDiversity(text) {
    // 匹配字母和数字组成的单词
    const words = text.toLowerCase().match(/\w+/g) || [];
    if (words.length === 0) return 0.0;
    const uniqueWords = new Set(words);
    return uniqueWords.size / words.length;
  }

  // 3. 综合 AI 概率
  function simpleAIScore(text) {
    const burstiness = calculateBurstiness(text);
    const diversity = calculateLexicalDiversity(text);

    let aiScore = 0.0;
    if (burstiness < 0.55) aiScore += (0.55 - burstiness) * 2.5;
    if (diversity < 0.65) aiScore += (0.65 - diversity) * 2.5;

    aiScore = Math.min(Math.max(aiScore, 0.0), 1.0);
    return { aiScore, burstiness, diversity };
  }

  // ===== 检测动作 =====
  function detect() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) {
      alert('请先输入一些文本');
      return;
    }

    // 震动反馈
    if (navigator.vibrate) navigator.vibrate(15);

    const { aiScore, burstiness, diversity } = simpleAIScore(text);

    // 更新结果卡片
    const card = document.getElementById('resultCard');
    const icon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const resultSub = document.getElementById('resultSub');

    card.className = 'result-card show';

    if (aiScore > 0.6) {
      card.classList.add('result-ai');
      icon.textContent = '🤖';
      resultText.textContent = 'AI 生成';
      resultSub.textContent = `可能性：${(aiScore * 100).toFixed(1)}%`;
    } else if (aiScore > 0.35) {
      card.classList.add('result-maybe');
      icon.textContent = '⚠️';
      resultText.textContent = '可能是 AI 生成';
      resultSub.textContent = `可能性：${(aiScore * 100).toFixed(1)}%`;
    } else {
      card.classList.add('result-human');
      icon.textContent = '✍️';
      resultText.textContent = '人类书写';
      resultSub.textContent = `可能性：${((1 - aiScore) * 100).toFixed(1)}%`;
    }

    // 更新分析数据
    document.getElementById('burstVal').textContent = burstiness.toFixed(3);
    document.getElementById('diverVal').textContent = diversity.toFixed(3);
  }
</script>
</body>
</html>
