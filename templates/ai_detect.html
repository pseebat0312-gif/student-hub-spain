<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>AI 文本检测器 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  .input-box {
    width: 100%;
    min-height: 160px;
    padding: 16px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 15px;
    outline: none; resize: vertical;
    font-family: inherit; line-height: 1.6;
    margin-bottom: 16px;
  }
  .input-box:focus { border-color: #a0d8b3; }

  .big-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
    box-shadow: 0 6px 20px rgba(74,124,89,0.3);
  }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .result-card {
    margin-top: 24px;
    padding: 24px;
    border-radius: 16px;
    text-align: center;
    display: none;
  }
  .result-card.show { display: block; animation: fadeIn 0.4s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

  .result-card .big-icon { font-size: 48px; margin-bottom: 12px; }
  .result-card .result-text { font-size: 20px; font-weight: bold; margin-bottom: 8px; }
  .result-card .result-sub { font-size: 14px; opacity: 0.8; }

  .result-ai { background: rgba(231, 76, 60, 0.15); border: 1px solid #e74c3c; }
  .result-ai .result-text { color: #e74c3c; }
  .result-maybe { background: rgba(241, 196, 15, 0.15); border: 1px solid #f1c40f; }
  .result-maybe .result-text { color: #f1c40f; }
  .result-human { background: rgba(46, 204, 113, 0.15); border: 1px solid #2ecc71; }
  .result-human .result-text { color: #2ecc71; }

  .stats-row {
    display: flex; gap: 12px; margin-top: 20px;
  }
  .stat-box {
    flex: 1;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .stat-box .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .stat-box .value { font-size: 18px; font-weight: bold; color: #a0d8b3; }

  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🔍 AI 文本检测器</div>
</div>

<div id="content">

  <p style="color: #888; font-size: 14px; margin-bottom: 20px; line-height: 1.6;">
    粘贴一段文本，判断它是人类写的还是 AI 生成的。基于数学统计法，秒级出结果。
  </p>

  <textarea class="input-box" id="textInput" placeholder="在这里粘贴要检测的文本..."></textarea>

  <button class="big-btn" id="detectBtn" onclick="detect()">开始检测</button>

  <div class="result-card" id="resultCard">
    <div class="big-icon" id="resultIcon">🤖</div>
    <div class="result-text" id="resultText">AI 生成</div>
    <div class="result-sub" id="resultSub">可能性：85.2%</div>

    <div class="stats-row">
      <div class="stat-box">
        <div class="label">句子波动性</div>
        <div class="value" id="burstVal">0.00</div>
      </div>
      <div class="stat-box">
        <div class="label">词汇多样性</div>
        <div class="value" id="diverVal">0.00</div>
      </div>
    </div>
  </div>

  <div class="tip-box">
    💡 提示：突发性越低、词汇越单调，越可能是 AI。人类写作通常有长短句交错和更丰富的用词。
  </div>

</div>

<script>
  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/';
    }
  }

  // ===== VIP / 试用检查 =====
  async function checkVipOrTrial(featureKey) {
    const email = (localStorage.getItem('user_email') || '').toLowerCase();
    if (!email) {
      alert('请先登录');
      location.href = '/login';
      return false;
    }
    try {
      const resp = await fetch('/api/vip/check_usage?email=' + encodeURIComponent(email) + '&feature=' + featureKey);
      const data = await resp.json();
      if (data.error) { alert(data.error); return false; }
      if (data.is_vip) return true;
      if (data.remaining > 0) {
        const consumeResp = await fetch('/api/vip/consume', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, feature: featureKey })
        });
        const consumeData = await consumeResp.json();
        if (consumeData.success) {
          if (consumeData.remaining !== undefined && consumeData.remaining >= 0) {
            showTrialToast(consumeData.remaining);
          }
          return true;
        }
        if (consumeData.need_vip) {
          showVipUpsell();
          return false;
        }
        alert(consumeData.error || '操作失败');
        return false;
      }
      showVipUpsell();
      return false;
    } catch (e) {
      alert('网络错误');
      return false;
    }
  }

  function showTrialToast(remaining) {
    const old = document.getElementById('__trialToast');
    if (old) old.remove();
    const tip = document.createElement('div');
    tip.id = '__trialToast';
    tip.style.cssText = `
      position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
      background: rgba(244,184,208,0.18); border: 1px solid rgba(244,184,208,0.4);
      color: #f4b8d0; padding: 10px 18px; border-radius: 999px;
      font-size: 13px; font-weight: 600; z-index: 99999;
      backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
      white-space: nowrap;
    `;
    tip.textContent = '✨ 免费试用，还剩 ' + remaining + ' 次';
    document.body.appendChild(tip);
    setTimeout(() => tip.remove(), 2500);
  }

  function showVipUpsell() {
    if (document.getElementById('__vipUpsell')) return;
    const overlay = document.createElement('div');
    overlay.id = '__vipUpsell';
    overlay.style.cssText = `
      position: fixed; inset: 0; background: rgba(0,0,0,0.85);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      z-index: 99999; display: flex; justify-content: center; align-items: center;
      padding: 20px;
    `;
    overlay.innerHTML = `
      <div style="width:100%;max-width:340px;background:#1c1c1e;border-radius:24px;padding:28px 24px;border:1px solid rgba(244,184,208,0.25);text-align:center;">
        <div style="font-size:48px;margin-bottom:12px;">👑</div>
        <div style="font-size:18px;font-weight:800;color:#f4b8d0;margin-bottom:8px;">免费次数用完了</div>
        <div style="font-size:13px;color:#888;line-height:1.7;margin-bottom:20px;">
          升级 VIP 后，所有功能无限使用。<br>首月只要 €1
        </div>
        <button onclick="location.href='/vip'" style="width:100%;padding:14px;border-radius:999px;border:none;background:linear-gradient(135deg,#f4b8d0,#e08aa8);color:#1a0f14;font-size:15px;font-weight:700;cursor:pointer;font-family:inherit;margin-bottom:10px;">查看 VIP →</button>
        <button onclick="document.getElementById('__vipUpsell').remove()" style="width:100%;padding:12px;border-radius:999px;border:none;background:transparent;color:#666;font-size:13px;cursor:pointer;font-family:inherit;">再想想</button>
      </div>
    `;
    document.body.appendChild(overlay);
  }

  // ===== 核心算法 =====
  function calculateBurstiness(text) {
    const sentences = text.split(/[.!?。！？\n]+/)
      .map(s => s.trim())
      .filter(s => s.length > 3);

    if (sentences.length < 2) return 0.5;

    const lengths = sentences.map(s => s.length);
    const avg = lengths.reduce((a, b) => a + b, 0) / lengths.length;
    const variance = lengths.reduce((sum, l) => sum + Math.pow(l - avg, 2), 0) / lengths.length;
    const stdDev = Math.sqrt(variance);

    return Math.min(stdDev / (avg + 1), 1.0);
  }

  function calculateLexicalDiversity(text) {
    const words = text.toLowerCase().match(/\w+/g) || [];
    if (words.length === 0) return 0.0;
    const uniqueWords = new Set(words);
    return uniqueWords.size / words.length;
  }

  function simpleAIScore(text) {
    const burstiness = calculateBurstiness(text);
    const diversity = calculateLexicalDiversity(text);

    let aiScore = 0.0;
    if (burstiness < 0.55) aiScore += (0.55 - burstiness) * 2.5;
    if (diversity < 0.65) aiScore += (0.65 - diversity) * 2.5;

    aiScore = Math.min(Math.max(aiScore, 0.0), 1.0);
    return { aiScore, burstiness, diversity };
  }

  // ===== 检测动作 =====
  async function detect() {
    const text = document.getElementById('textInput').value.trim();
    if (!text) {
      alert('请先输入一些文本');
      return;
    }

    // 先检查 VIP 或试用
    const ok = await checkVipOrTrial('ai_detect');
    if (!ok) return;

    if (navigator.vibrate) navigator.vibrate(15);

    const { aiScore, burstiness, diversity } = simpleAIScore(text);

    const card = document.getElementById('resultCard');
    const icon = document.getElementById('resultIcon');
    const resultText = document.getElementById('resultText');
    const resultSub = document.getElementById('resultSub');

    card.className = 'result-card show';

    if (aiScore > 0.6) {
      card.classList.add('result-ai');
      icon.textContent = '🤖';
      resultText.textContent = 'AI 生成';
      resultSub.textContent = `可能性：${(aiScore * 100).toFixed(1)}%`;
    } else if (aiScore > 0.35) {
      card.classList.add('result-maybe');
      icon.textContent = '⚠️';
      resultText.textContent = '可能是 AI 生成';
      resultSub.textContent = `可能性：${(aiScore * 100).toFixed(1)}%`;
    } else {
      card.classList.add('result-human');
      icon.textContent = '✍️';
      resultText.textContent = '人类书写';
      resultSub.textContent = `可能性：${((1 - aiScore) * 100).toFixed(1)}%`;
    }

    document.getElementById('burstVal').textContent = burstiness.toFixed(3);
    document.getElementById('diverVal').textContent = diversity.toFixed(3);
  }
</script>
</body>
</html>
