<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>学校导览 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden; min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; flex: 1; }
  #topBar .switch-btn {
    background: rgba(160,216,179,0.15);
    border: 1px solid rgba(160,216,179,0.3);
    color: #a0d8b3;
    font-size: 12px; font-weight: 700;
    padding: 8px 14px; border-radius: 999px;
    cursor: pointer; transition: 0.15s;
  }
  #topBar .switch-btn:active { transform: scale(0.95); }

  #content { padding: 10px 20px 40px; }

  /* 学校头部卡片 */
  .school-header {
    background: linear-gradient(135deg, rgba(160,216,179,0.12), rgba(74,124,89,0.08));
    border: 1px solid rgba(160,216,179,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .school-header .logo {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: rgba(160,216,179,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .school-header .info { flex: 1; min-width: 0; }
  .school-header .info .name {
    font-size: 17px; font-weight: 800;
    color: #fff; line-height: 1.3;
    letter-spacing: -0.3px;
  }
  .school-header .info .sub {
    font-size: 12px; color: #888;
    margin-top: 4px;
  }

  /* 学校选择器（初始 / 切换时显示） */
  .school-select {
    width: 100%;
    padding: 16px 20px;
    border-radius: 16px;
    border: 2px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 16px;
    outline: none; appearance: none;
    background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23a0d8b3' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
    background-repeat: no-repeat;
    background-position: right 16px center;
    background-size: 18px;
    margin-bottom: 24px;
    cursor: pointer;
  }
  .school-select option { background: #1a1a2e; color: #fff; }

  /* 分类标题 */
  .section-title {
    font-size: 16px; color: #a0d8b3; font-weight: bold;
    margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
  }

  /* 链接按钮网格 */
  .link-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .link-btn {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 18px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff; text-decoration: none;
    font-size: 14px; text-align: center;
    transition: 0.15s;
    min-height: 80px;
  }
  .link-btn:active {
    transform: scale(0.96);
    background: rgba(160, 216, 179, 0.15);
    border-color: #a0d8b3;
  }
  .link-btn .emoji { font-size: 22px; margin-bottom: 6px; }

  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-top: 24px;
  }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: #666; font-size: 14px;
  }

  /* 切换学校的底部弹窗 */
  .picker-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    justify-content: flex-end;
    align-items: flex-end;
    animation: fadeIn 0.25s ease;
  }
  .picker-overlay.show { display: flex; }
  .picker-sheet {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #1c1c1e;
    border-radius: 28px 28px 0 0;
    padding: 24px 20px 34px;
    box-sizing: border-box;
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
  }
  .picker-sheet .picker-title {
    font-size: 18px; font-weight: 800;
    color: #fff; margin-bottom: 16px;
    text-align: center;
  }
  .picker-option {
    width: 100%;
    padding: 16px 18px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    color: #fff; font-size: 15px;
    text-align: left; cursor: pointer;
    margin-bottom: 10px;
    transition: 0.15s;
    font-family: inherit;
    display: flex; align-items: center; gap: 10px;
  }
  .picker-option:active {
    transform: scale(0.98);
    background: rgba(160,216,179,0.12);
    border-color: rgba(160,216,179,0.3);
  }
  .picker-option.active {
    background: rgba(160,216,179,0.15);
    border-color: #a0d8b3;
  }
  .picker-option .check {
    margin-left: auto; color: #a0d8b3; font-size: 18px;
  }
  .picker-cancel {
    width: 100%; padding: 14px;
    background: transparent; border: none;
    color: #888; font-size: 15px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    margin-top: 6px;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🏛️ 学校导览</div>
  <button class="switch-btn" id="switchBtn" onclick="openSchoolPicker()" style="display:none;">换学校</button>
</div>

<div id="content">

  <!-- 如果还没选学校，显示下拉 -->
  <select class="school-select" id="schoolSelect" onchange="onSchoolChange(this.value)">
    <option value="">📌 请选择你的学校</option>
    <option value="UCM">马德里康普顿斯大学 (UCM)</option>
    <option value="UAM">马德里自治大学 (UAM)</option>
    <option value="UB">巴塞罗那大学 (UB)</option>
    <option value="UPF">庞培法布拉大学 (UPF)</option>
    <option value="other">其他（即将添加）</option>
  </select>

  <!-- 学校内容 -->
  <div id="schoolContent">
    <div class="empty-state">👆 请从上方选择你的学校</div>
  </div>

</div>

<!-- 换学校弹窗 -->
<div class="picker-overlay" id="pickerOverlay" onclick="closeSchoolPicker(event)">
  <div class="picker-sheet" onclick="event.stopPropagation()">
    <div class="picker-title">选择学校</div>
    <button class="picker-option" data-key="UCM" onclick="pickSchool('UCM')">
      <span>🏛️</span><span>马德里康普顿斯大学 (UCM)</span>
      <span class="check" style="display:none;">✓</span>
    </button>
    <button class="picker-option" data-key="UAM" onclick="pickSchool('UAM')">
      <span>🏛️</span><span>马德里自治大学 (UAM)</span>
      <span class="check" style="display:none;">✓</span>
    </button>
    <button class="picker-option" data-key="UB" onclick="pickSchool('UB')">
      <span>🏛️</span><span>巴塞罗那大学 (UB)</span>
      <span class="check" style="display:none;">✓</span>
    </button>
    <button class="picker-option" data-key="UPF" onclick="pickSchool('UPF')">
      <span>🏛️</span><span>庞培法布拉大学 (UPF)</span>
      <span class="check" style="display:none;">✓</span>
    </button>
    <button class="picker-option" data-key="other" onclick="pickSchool('other')">
      <span>✨</span><span>其他学校</span>
      <span class="check" style="display:none;">✓</span>
    </button>
    <button class="picker-cancel" onclick="closeSchoolPicker()">取消</button>
  </div>
</div>

<script>
  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/';
    }
  }

  // ===== 学校数据 =====
  const schoolData = {
    UCM: {
      name: "马德里康普顿斯大学 (UCM)",
      emoji: "🏛️",
      sections: [
        {
          title: "📚 学术与教学",
          links: [
            { emoji: "🏛️", name: "UCM 官网", url: "https://www.ucm.es" },
            { emoji: "💻", name: "Campus Virtual", url: "https://www.ucm.es/campusvirtual" },
            { emoji: "📧", name: "学生邮箱", url: "https://mail.google.com/" },
            { emoji: "🛠️", name: "学校免费工具", url: "https://ssii.ucm.es/" }
          ]
        },
        {
          title: "🏃 体育与生活",
          links: [
            { emoji: "⚽", name: "体育主页", url: "https://www.ucm.es/deportesucm" },
            { emoji: "🏟️", name: "设施预约", url: "https://deportes.ucm.es/" },
            { emoji: "📖", name: "图书馆服务", url: "https://biblioteca.ucm.es/" }
          ]
        }
      ],
      tip: "💡 提示：在校外访问 Campus Virtual 时，需要先连接学校的 VPN。"
    },
    UAM: { name: "马德里自治大学 (UAM)", emoji: "🏛️", sections: [], tip: "UAM 的入口正在整理中，敬请期待！" },
    UB: { name: "巴塞罗那大学 (UB)", emoji: "🏛️", sections: [], tip: "UB 的入口正在整理中，敬请期待！" },
    UPF: { name: "庞培法布拉大学 (UPF)", emoji: "🏛️", sections: [], tip: "UPF 的入口正在整理中，敬请期待！" },
    other: { name: "其他学校", emoji: "✨", sections: [], tip: "如果你希望添加你的学校，欢迎在留言板留言联系作者！" }
  };

  const STORAGE_KEY = 'selected_school';

  // ===== 渲染 =====
  function renderSchool(key) {
    const container = document.getElementById('schoolContent');
    const selectEl = document.getElementById('schoolSelect');
    const switchBtn = document.getElementById('switchBtn');

    if (!key || !schoolData[key]) {
      container.innerHTML = '<div class="empty-state">👆 请从上方选择你的学校</div>';
      selectEl.style.display = 'block';
      switchBtn.style.display = 'none';
      return;
    }

    const data = schoolData[key];

    // 隐藏下拉，显示换学校按钮
    selectEl.style.display = 'none';
    switchBtn.style.display = 'block';

    // 更新弹窗里的勾
    document.querySelectorAll('.picker-option').forEach(btn => {
      const check = btn.querySelector('.check');
      if (btn.dataset.key === key) {
        btn.classList.add('active');
        if (check) check.style.display = 'inline';
      } else {
        btn.classList.remove('active');
        if (check) check.style.display = 'none';
      }
    });

    let html = `
      <div class="school-header">
        <div class="logo">${data.emoji}</div>
        <div class="info">
          <div class="name">${data.name}</div>
          <div class="sub">快速入口 · 一键直达</div>
        </div>
      </div>
    `;

    if (data.sections.length === 0) {
      html += `<div class="empty-state">${data.tip}</div>`;
    } else {
      data.sections.forEach(sec => {
        html += `<div class="section-title">${sec.title}</div>`;
        html += `<div class="link-grid">`;
        sec.links.forEach(link => {
          html += `
            <a class="link-btn" href="${link.url}" target="_blank">
              <span class="emoji">${link.emoji}</span>
              <span>${link.name}</span>
            </a>
          `;
        });
        html += `</div>`;
      });
      if (data.tip) html += `<div class="tip-box">${data.tip}</div>`;
    }

    container.innerHTML = html;
  }

  // ===== 下拉选择（首次） =====
  function onSchoolChange(key) {
    if (navigator.vibrate) navigator.vibrate(10);
    if (!key) {
      localStorage.removeItem(STORAGE_KEY);
      renderSchool('');
      return;
    }
    localStorage.setItem(STORAGE_KEY, key);
    renderSchool(key);
  }

  // ===== 弹窗选择（切换） =====
  function openSchoolPicker() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('pickerOverlay').classList.add('show');
  }
  function closeSchoolPicker(e) {
    if (e && e.target !== e.currentTarget && !e.target.classList.contains('picker-cancel')) return;
    document.getElementById('pickerOverlay').classList.remove('show');
  }
  function pickSchool(key) {
    if (navigator.vibrate) navigator.vibrate(12);
    localStorage.setItem(STORAGE_KEY, key);
    renderSchool(key);
    document.getElementById('pickerOverlay').classList.remove('show');
  }

  // ===== 初始化 =====
  (function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && schoolData[saved]) {
      renderSchool(saved);
    } else {
      renderSchool('');
    }
  })();
</script>
</body>
</html>
