<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>学校导览 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-x: hidden; min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 14px 16px 12px;
    display: flex; align-items: center; gap: 10px;
    background: #0f0c29;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
    flex-shrink: 0;
  }
  #topBar .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }

  /* 顶部搜索框（跟换学校按钮并排） */
  #topBar .top-search {
    flex: 1;
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 999px;
    padding: 8px 14px;
    min-width: 0;
  }
  #topBar .top-search .s-icon {
    font-size: 14px; color: rgba(255,255,255,0.4); flex-shrink: 0;
  }
  #topBar .top-search input {
    flex: 1; background: transparent; border: none; outline: none;
    color: #fff; font-size: 14px; font-family: inherit; min-width: 0;
  }
  #topBar .top-search input::placeholder { color: rgba(255,255,255,0.35); }
  #topBar .top-search .s-clear {
    background: rgba(255,255,255,0.1);
    border: none; color: #ccc;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 11px; cursor: pointer;
    display: none;
    align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #topBar .top-search .s-clear.show { display: flex; }

  #topBar .switch-btn {
    background: rgba(160,216,179,0.15);
    border: 1px solid rgba(160,216,179,0.3);
    color: #a0d8b3;
    font-size: 12px; font-weight: 700;
    padding: 8px 12px; border-radius: 999px;
    cursor: pointer; transition: 0.15s;
    flex-shrink: 0;
    white-space: nowrap;
  }
  #topBar .switch-btn:active { transform: scale(0.95); }
  #topBar .switch-btn[style*="display:none"] { display: none !important; }

  #content { padding: 14px 16px 40px; }

  /* 搜索结果列表 */
  .search-results {
    display: none;
    margin-bottom: 14px;
  }
  .search-results.show { display: block; }
  .search-result-item {
    display: flex; align-items: center; gap: 12px;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: 0.15s;
  }
  .search-result-item:active {
    transform: scale(0.98);
    background: rgba(160,216,179,0.12);
    border-color: rgba(160,216,179,0.3);
  }
  .search-result-item .sr-emoji { font-size: 22px; flex-shrink: 0; }
  .search-result-item .sr-info { flex: 1; min-width: 0; }
  .search-result-item .sr-name {
    font-size: 14px; font-weight: 700; color: #fff;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .search-result-item .sr-name .sr-abbr {
    color: #a0d8b3; font-weight: 800;
    background: rgba(160,216,179,0.12);
    padding: 1px 6px; border-radius: 6px;
    font-size: 11px;
    margin-right: 6px;
    letter-spacing: 0.5px;
  }
  .search-result-item .sr-city {
    font-size: 11px; color: rgba(255,255,255,0.45); margin-top: 2px;
  }

  /* 学校头部卡片 */
  .school-header {
    background: linear-gradient(135deg, rgba(160,216,179,0.12), rgba(74,124,89,0.08));
    border: 1px solid rgba(160,216,179,0.25);
    border-radius: 20px;
    padding: 20px;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .school-header .logo {
    width: 56px; height: 56px;
    border-radius: 16px;
    background: rgba(160,216,179,0.15);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
    flex-shrink: 0;
  }
  .school-header .info { flex: 1; min-width: 0; }
  .school-header .info .name {
    font-size: 17px; font-weight: 800;
    color: #fff; line-height: 1.3;
    letter-spacing: -0.3px;
  }
  .school-header .info .sub {
    font-size: 12px; color: #888;
    margin-top: 4px;
  }

  /* 分类标题 */
  .section-title {
    font-size: 16px; color: #a0d8b3; font-weight: bold;
    margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
  }

  /* 链接按钮网格 */
  .link-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }
  .link-btn {
    display: flex; flex-direction: column;
    justify-content: center; align-items: center;
    padding: 18px 12px;
    border-radius: 16px;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff; text-decoration: none;
    font-size: 14px; text-align: center;
    transition: 0.15s;
    min-height: 80px;
  }
  .link-btn:active {
    transform: scale(0.96);
    background: rgba(160, 216, 179, 0.15);
    border-color: #a0d8b3;
  }
  .link-btn .emoji { font-size: 22px; margin-bottom: 6px; }

  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-top: 24px;
  }

  .empty-state {
    text-align: center; padding: 60px 20px;
    color: #666; font-size: 14px;
  }

  /* 切换学校的底部弹窗 */
  .picker-overlay {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.6);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    z-index: 9999;
    display: none;
    justify-content: flex-end;
    align-items: flex-end;
    animation: fadeIn 0.25s ease;
  }
  .picker-overlay.show { display: flex; }
  .picker-sheet {
    width: 100%;
    max-width: 500px;
    margin: 0 auto;
    background: #1c1c1e;
    border-radius: 28px 28px 0 0;
    padding: 24px 20px 34px;
    box-sizing: border-box;
    animation: slideUp 0.35s cubic-bezier(0.22, 1, 0.36, 1);
    max-height: 75vh;
    overflow-y: auto;
  }
  .picker-sheet .picker-title {
    font-size: 18px; font-weight: 800;
    color: #fff; margin-bottom: 4px;
    text-align: center;
  }
  .picker-sheet .picker-sub {
    font-size: 12px; color: #888;
    text-align: center;
    margin-bottom: 16px;
  }
  .picker-group-title {
    font-size: 12px;
    font-weight: 700;
    color: #a0d8b3;
    margin: 12px 4px 8px;
    letter-spacing: 0.5px;
  }
  .picker-option {
    width: 100%;
    padding: 14px 16px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 14px;
    color: #fff; font-size: 14px;
    text-align: left; cursor: pointer;
    margin-bottom: 8px;
    transition: 0.15s;
    font-family: inherit;
    display: flex; align-items: center; gap: 10px;
  }
  .picker-option:active {
    transform: scale(0.98);
    background: rgba(160,216,179,0.12);
    border-color: rgba(160,216,179,0.3);
  }
  .picker-option.active {
    background: rgba(160,216,179,0.15);
    border-color: #a0d8b3;
  }
  .picker-option .po-abbr {
    font-size: 11px;
    font-weight: 800;
    color: #a0d8b3;
    background: rgba(160,216,179,0.12);
    padding: 2px 7px;
    border-radius: 6px;
    flex-shrink: 0;
    letter-spacing: 0.5px;
  }
  .picker-option .po-name {
    flex: 1; min-width: 0;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .picker-option .check {
    margin-left: auto; color: #a0d8b3; font-size: 16px;
    flex-shrink: 0;
  }
  .picker-cancel {
    width: 100%; padding: 14px;
    background: rgba(255,255,255,0.08); border: none;
    color: #ccc; font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    border-radius: 14px;
    margin-top: 10px;
  }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
</style>

  // ===== 搜索用的扁平列表 =====
  const schoolList = Object.keys(schoolData).map(key => ({
    key: key,
    name: schoolData[key].name,
    abbr: schoolData[key].abbr || '',
    city: schoolData[key].city || '',
    emoji: schoolData[key].emoji
  }));

  const STORAGE_KEY = 'selected_school';

  // ===== 搜索 =====
  function onSchoolSearch(input) {
    const q = (input.value || '').trim().toLowerCase();
    const clearBtn = document.getElementById('schoolSearchClear');
    const resultsBox = document.getElementById('searchResults');
    const contentBox = document.getElementById('schoolContent');

    if (q) clearBtn.classList.add('show');
    else clearBtn.classList.remove('show');

    if (!q) {
      resultsBox.classList.remove('show');
      resultsBox.innerHTML = '';
      contentBox.style.display = 'block';
      return;
    }

    // 搜索：学校名 + 缩写 + 城市
    const matched = schoolList.filter(s =>
      s.name.toLowerCase().includes(q) ||
      (s.abbr && s.abbr.toLowerCase().includes(q)) ||
      s.city.toLowerCase().includes(q)
    );

    contentBox.style.display = 'none';
    resultsBox.classList.add('show');
    resultsBox.innerHTML = '';

    if (matched.length === 0) {
      resultsBox.innerHTML = '<div class="empty-state">没有找到相关学校</div>';
      return;
    }

    matched.forEach(s => {
      const div = document.createElement('div');
      div.className = 'search-result-item';
      div.innerHTML = `
        <span class="sr-emoji">${s.emoji}</span>
        <div class="sr-info">
          <div class="sr-name">
            ${s.abbr ? `<span class="sr-abbr">${s.abbr}</span>` : ''}${s.name}
          </div>
          ${s.city ? `<div class="sr-city">📍 ${s.city}</div>` : ''}
        </div>
      `;
      div.onclick = () => {
        if (navigator.vibrate) navigator.vibrate(10);
        localStorage.setItem(STORAGE_KEY, s.key);
        renderSchool(s.key);
        clearSchoolSearch();
      };
      resultsBox.appendChild(div);
    });
  }

  function clearSchoolSearch() {
    const input = document.getElementById('schoolSearchInput');
    input.value = '';
    document.getElementById('schoolSearchClear').classList.remove('show');
    document.getElementById('searchResults').classList.remove('show');
    document.getElementById('searchResults').innerHTML = '';
    document.getElementById('schoolContent').style.display = 'block';
  }

  // ===== 渲染 =====
  function renderSchool(key) {
    const container = document.getElementById('schoolContent');
    const switchBtn = document.getElementById('switchBtn');

    if (!key || !schoolData[key]) {
      container.innerHTML = '<div class="empty-state">🔍 搜索你的学校，或点右上角「换学校」选择</div>';
      switchBtn.style.display = 'none';
      return;
    }

    const data = schoolData[key];

    switchBtn.style.display = 'block';

    // 更新弹窗里的勾
    document.querySelectorAll('.picker-option').forEach(btn => {
      const check = btn.querySelector('.check');
      if (btn.dataset.key === key) {
        btn.classList.add('active');
        if (check) check.style.display = 'inline';
      } else {
        btn.classList.remove('active');
        if (check) check.style.display = 'none';
      }
    });

    let html = `
      <div class="school-header">
        <div class="logo">${data.emoji}</div>
        <div class="info">
          <div class="name">${data.name}</div>
          <div class="sub">${data.city ? '📍 ' + data.city + ' · ' : ''}快速入口 · 一键直达</div>
        </div>
      </div>
    `;

    if (data.sections.length === 0) {
      html += `<div class="empty-state">${data.tip || '信息整理中'}</div>`;
    } else {
      data.sections.forEach(sec => {
        html += `<div class="section-title">${sec.title}</div>`;
        html += `<div class="link-grid">`;
        sec.links.forEach(link => {
          html += `
            <a class="link-btn" href="${link.url}" target="_blank" rel="noopener">
              <span class="emoji">${link.emoji}</span>
              <span>${link.name}</span>
            </a>
          `;
        });
        html += `</div>`;
      });
      if (data.tip) html += `<div class="tip-box">${data.tip}</div>`;
    }

    container.innerHTML = html;
  }

  // ===== 弹窗选择 =====
  function openSchoolPicker() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('pickerOverlay').classList.add('show');
  }
  function closeSchoolPicker(e) {
    if (e && e.target !== e.currentTarget && !e.target.classList.contains('picker-cancel')) return;
    document.getElementById('pickerOverlay').classList.remove('show');
  }
  function pickSchool(key) {
    if (navigator.vibrate) navigator.vibrate(12);
    localStorage.setItem(STORAGE_KEY, key);
    renderSchool(key);
    document.getElementById('pickerOverlay').classList.remove('show');
  }

  // ===== 初始化 =====
  (function init() {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved && schoolData[saved]) {
      renderSchool(saved);
    } else {
      renderSchool('');
    }
  })();
