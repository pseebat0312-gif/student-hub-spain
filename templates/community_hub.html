<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>交流社区 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; flex: 1; }

  #content { padding: 0 16px 40px; }

  .hub-tabs {
    display: flex; gap: 6px; margin-bottom: 16px;
    background: rgba(255,255,255,0.04);
    padding: 5px; border-radius: 999px;
    position: sticky; top: 68px; z-index: 9;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
  }
  .hub-tab {
    flex: 1; padding: 11px;
    border-radius: 999px; border: none;
    background: transparent; color: #888;
    font-size: 14px; font-weight: 600;
    cursor: pointer; font-family: inherit;
    transition: 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .hub-tab.active {
    background: linear-gradient(135deg, #a0d8b3, #7ab890);
    color: #0f0c29;
    font-weight: 700;
  }
  .hub-tab:active { transform: scale(0.96); }

  .hub-panel { display: none; }
  .hub-panel.active { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .add-btn-top {
    width: 100%; padding: 14px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 15px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    margin-bottom: 16px;
  }
  .add-btn-top:active { transform: scale(0.97); }

  .type-switch {
    display: flex; gap: 8px; margin-bottom: 10px;
  }
  .type-switch label {
    flex: 1; padding: 10px; text-align: center;
    background: rgba(255,255,255,0.06);
    border-radius: 12px;
    font-size: 13px; cursor: pointer;
    border: 2px solid transparent;
  }
  .type-switch input { display: none; }
  .type-switch label:has(input:checked) {
    border-color: #a0d8b3;
    background: rgba(160,216,179,0.15);
    color: #a0d8b3;
    font-weight: 700;
  }

  .upload-box {
    padding: 14px; border-radius: 12px;
    border: 2px dashed rgba(160, 216, 179, 0.3);
    background: rgba(160, 216, 179, 0.05);
    text-align: center;
    font-size: 13px; color: #a0d8b3;
    cursor: pointer;
    margin-bottom: 10px;
  }
  .upload-box:active { transform: scale(0.98); }
  .upload-preview {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 10px;
  }
  .upload-preview::-webkit-scrollbar { display: none; }
  .upload-thumb {
    position: relative; flex-shrink: 0;
  }
  .upload-thumb img {
    width: 70px; height: 70px;
    border-radius: 10px;
    object-fit: cover;
    display: block;
  }
  .upload-thumb .rm {
    position: absolute; top: -6px; right: -6px;
    width: 20px; height: 20px; border-radius: 50%;
    background: #ff4444; color: #fff;
    font-size: 13px; line-height: 20px;
    text-align: center; cursor: pointer;
  }

  .item-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    position: relative;
  }
  .item-card .item-title {
    font-size: 15px; font-weight: 700; color: #fff;
    margin-bottom: 6px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .item-card .item-meta {
    font-size: 11px; color: #666;
    margin-bottom: 8px;
    display: flex; gap: 8px; align-items: center;
  }
  .item-card .item-body {
    font-size: 13px; color: #bbb; line-height: 1.6;
  }
  .item-card .item-actions {
    display: flex; gap: 8px; margin-top: 12px;
  }
  .item-card .item-actions button {
    padding: 8px 14px; border-radius: 10px; border: none;
    font-size: 12px; font-weight: 600;
    cursor: pointer; font-family: inherit;
  }
  .item-card .btn-reply {
    background: rgba(160,216,179,0.15); color: #a0d8b3;
  }
  .item-card .btn-del {
    background: rgba(255,107,107,0.12); color: #ff6b6b;
  }

  .market-badge {
    display: inline-block;
    font-size: 11px; font-weight: 700;
    padding: 3px 8px; border-radius: 8px;
    margin-right: 6px;
  }
  .market-badge.sell {
    background: rgba(160,216,179,0.15);
    color: #a0d8b3;
  }
  .market-badge.want {
    background: rgba(244,184,208,0.15);
    color: #f4b8d0;
  }
  .market-images {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 8px;
  }
  .market-images::-webkit-scrollbar { display: none; }
  .market-images img {
    flex-shrink: 0;
    width: 100px; height: 100px;
    border-radius: 10px;
    object-fit: cover;
    cursor: pointer;
  }
  .market-price {
    color: #a0d8b3; font-weight: 700;
    font-size: 14px;
  }
  .market-contact {
    color: #a0d8b3;
    margin-top: 6px;
    font-size: 12px;
  }

  .empty-tip {
    text-align: center; color: #666; font-size: 13px;
    padding: 60px 20px; line-height: 1.8;
  }

  .reply-thread {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .reply-node {
    padding: 10px 12px;
    background: rgba(255,255,255,0.03);
    border-radius: 10px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.55;
    position: relative;
  }
  .reply-node.depth-1 { margin-left: 0; background: rgba(160,216,179,0.06); }
  .reply-node.depth-2 { margin-left: 16px; background: rgba(160,216,179,0.04); }
  .reply-node.depth-3 { margin-left: 32px; background: rgba(160,216,179,0.03); }
  .reply-node.depth-4 { margin-left: 48px; background: rgba(160,216,179,0.02); }
  .reply-node.depth-5 { margin-left: 56px; background: rgba(160,216,179,0.02); }
  .reply-node.depth-6 { margin-left: 64px; background: rgba(160,216,179,0.02); }
  .reply-node .r-head {
    display: flex; align-items: center; gap: 6px;
    font-size: 11px; margin-bottom: 4px;
  }
  .reply-node .r-name {
    color: #a0d8b3; font-weight: 700;
  }
  .reply-node .r-reply-to {
    color: #888;
    font-size: 10px;
  }
  .reply-node .r-reply-to b {
    color: #f4b8d0;
    font-weight: 600;
  }
  .reply-node .r-content {
    color: #ddd;
    word-break: break-word;
  }
  .reply-node .r-foot {
    display: flex; align-items: center; gap: 10px;
    margin-top: 6px;
    font-size: 10px; color: #666;
  }
  .reply-node .r-btn {
    background: none; border: none;
    color: #a0d8b3; font-size: 11px;
    cursor: pointer; padding: 2px 6px;
    border-radius: 6px;
    font-family: inherit;
  }
  .reply-node .r-btn:active { background: rgba(160,216,179,0.12); }
  .reply-node .r-btn.danger { color: #ff6b6b; }
  .reply-node .r-btn.danger:active { background: rgba(255,107,107,0.12); }

  #replyComposer {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    background: #1a1a2e;
    border-top: 1px solid rgba(255,255,255,0.1);
    padding: 12px 14px calc(20px + env(safe-area-inset-bottom, 0px));
    display: none;
    z-index: 300;
    box-shadow: 0 -10px 30px rgba(0,0,0,0.4);
  }
  #replyComposer.show { display: block; }
  #replyComposer .composer-to {
    font-size: 11px;
    color: #a0d8b3;
    margin-bottom: 6px;
    display: flex; align-items: center; gap: 6px;
  }
  #replyComposer .composer-to b {
    color: #f4b8d0;
  }
  #replyComposer .composer-row {
    display: flex; gap: 8px;
    align-items: center;
  }
  #replyComposer input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px;
    outline: none;
    font-family: inherit;
    min-width: 0;
  }
  #replyComposer input:focus { border-color: #a0d8b3; }
  #replyComposer .send-btn {
    padding: 11px 18px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 13px; font-weight: 700;
    cursor: pointer; font-family: inherit;
    flex-shrink: 0;
  }
  #replyComposer .cancel-btn {
    padding: 11px 14px; border-radius: 999px; border: none;
    background: rgba(255,255,255,0.08); color: #ccc;
    font-size: 13px; cursor: pointer; font-family: inherit;
    flex-shrink: 0;
  }

  .modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: flex-end;
    z-index: 200; padding-top: 60px;
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1a1a2e; width: 100%; max-width: 500px;
    border-radius: 25px 25px 0 0; padding: 20px 18px 30px;
    max-height: 80vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .modal-content h3 {
    font-size: 17px; margin-bottom: 14px;
    color: #a0d8b3; text-align: center;
  }
  .modal-content input, .modal-content textarea, .modal-content select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 10px; font-family: inherit;
  }
  .modal-content textarea { height: 90px; resize: none; }
  .modal-content input:focus, .modal-content textarea:focus { border-color: #a0d8b3; }
  .form-actions { display: flex; gap: 10px; margin-top: 8px; }
  .form-actions button {
    flex: 1; padding: 14px; border-radius: 12px; border: none;
    font-size: 14px; font-weight: bold; cursor: pointer;
    font-family: inherit;
  }
  .form-actions .cancel { background: rgba(255,255,255,0.1); color: #ccc; }
  .form-actions .submit { background: linear-gradient(135deg, #4a7c59, #2d5a3d); color: #fff; }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">💬 交流社区</div>
</div>

<div id="content">

  <div class="hub-tabs">
    <button class="hub-tab active" data-tab="market" onclick="switchHub('market', this)">🛒 二手</button>
    <button class="hub-tab" data-tab="treehole" onclick="switchHub('treehole', this)">🌳 树洞</button>
    <button class="hub-tab" data-tab="community" onclick="switchHub('community', this)">🤝 互助</button>
  </div>

  <div class="hub-panel active" id="panel-market">
    <button class="add-btn-top" onclick="openAddMarket()">➕ 发布</button>
    <div id="marketList"><div class="empty-tip">加载中...</div></div>
  </div>

  <div class="hub-panel" id="panel-treehole">
    <button class="add-btn-top" onclick="openAddTreehole()">➕ 发树洞</button>
    <div id="treeholeList"><div class="empty-tip">加载中...</div></div>
  </div>

  <div class="hub-panel" id="panel-community">
    <button class="add-btn-top" onclick="openAddPost()">➕ 发帖</button>
    <div id="communityList"><div class="empty-tip">加载中...</div></div>
  </div>

</div>

<div class="modal" id="marketModal">
  <div class="modal-content">
    <h3>🛒 发布二手</h3>
    <div class="type-switch">
      <label><input type="radio" name="mType" value="sell" checked><span>💰 出售</span></label>
      <label><input type="radio" name="mType" value="want"><span>🔍 求购</span></label>
    </div>
    <input type="text" id="mTitle" placeholder="物品名称 *">
    <textarea id="mDesc" placeholder="物品描述"></textarea>
    <div style="display:flex;gap:8px;margin-bottom:10px;">
      <input type="number" id="mPrice" placeholder="价格" step="0.01" min="0" style="flex:1;margin-bottom:0;">
      <select id="mCurrency" style="width:110px;margin-bottom:0;">
        <option value="EUR">💶 €</option>
        <option value="CNY">💰 ¥</option>
      </select>
    </div>
    <input type="text" id="mContact" placeholder="联系方式（微信/WhatsApp）*">
    <div class="upload-box" onclick="document.getElementById('mImages').click()">
      📷 点击上传图片（可多选，每张最大 10MB）
    </div>
    <input type="file" id="mImages" accept="image/*" multiple style="display:none" onchange="onMarketImagesSelected(event)">
    <div class="upload-preview" id="uploadPreview"></div>
    <select id="mCategory">
      <option value="">📂 选择分类</option>
      <option value="家具">🛋️ 家具</option>
      <option value="教材">📚 教材</option>
      <option value="电子产品">💻 电子产品</option>
      <option value="生活用品">🧴 生活用品</option>
      <option value="出行工具">🚲 出行工具</option>
      <option value="其他">📦 其他</option>
    </select>
    <div class="form-actions">
      <button class="cancel" onclick="closeMarketModal()">取消</button>
      <button class="submit" onclick="submitMarket()">发布</button>
    </div>
  </div>
</div>

<div class="modal" id="treeholeModal">
  <div class="modal-content">
    <h3>🌳 发树洞</h3>
    <textarea id="tContent" placeholder="想说什么都可以（匿名）..." style="height:140px;"></textarea>
    <div class="form-actions">
      <button class="cancel" onclick="closeTreeholeModal()">取消</button>
      <button class="submit" onclick="submitTreehole()">发布</button>
    </div>
  </div>
</div>

<div class="modal" id="postModal">
  <div class="modal-content">
    <h3>🤝 发帖</h3>
    <input type="text" id="pTitle" placeholder="标题 *">
    <select id="pCategory">
      <option value="其他">其他</option>
      <option>租房</option>
      <option>拼单</option>
      <option>拼车</option>
      <option>求助</option>
      <option>经验分享</option>
    </select>
    <textarea id="pContent" placeholder="内容 *" style="height:120px;"></textarea>
    <div class="form-actions">
      <button class="cancel" onclick="closePostModal()">取消</button>
      <button class="submit" onclick="submitPost()">发布</button>
    </div>
  </div>
</div>

<div class="modal" id="threadModal">
  <div class="modal-content">
    <h3 id="threadTitle">💬 评论</h3>
    <div id="threadBody"><div class="empty-tip">加载中...</div></div>
    <div class="form-actions" style="margin-top:16px;">
      <button class="cancel" onclick="closeThreadModal()">关闭</button>
    </div>
  </div>
</div>

<div id="replyComposer">
  <div class="composer-to" id="composerTo"></div>
  <div class="composer-row">
    <button class="cancel-btn" onclick="closeComposer()">取消</button>
    <input type="text" id="composerInput" placeholder="写点什么...">
    <button class="send-btn" onclick="submitComposer()">发送</button>
  </div>
</div>

<script>
  var el = function(id) { return document.getElementById(id); };
  var MY_EMAIL = (localStorage.getItem('user_email') || '').toLowerCase();

  var currentContext = null;
  var currentParentReplyId = null;
  var currentReplyToName = '';

  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) window.history.back();
    else location.href = '/';
  }

  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function timeAgo(dateStr) {
    if (!dateStr) return '';
    var d = new Date(dateStr);
    var diff = Date.now() - d.getTime();
    var m = Math.floor(diff / 60000);
    if (m < 1) return '刚刚';
    if (m < 60) return m + ' 分钟前';
    var h = Math.floor(m / 60);
    if (h < 24) return h + ' 小时前';
    var days = Math.floor(h / 24);
    if (days < 30) return days + ' 天前';
    return d.toLocaleDateString('zh-CN');
  }

  // ============ 昵称：树洞里全部匿名 ============
  function nickName(email) {
    if (currentContext && currentContext.type === 'treehole') {
      return '匿名';
    }
    return escapeHtml((email || '').split('@')[0] || '匿名');
  }

  function parsePrice(raw) {
    if (!raw) return { currency: 'EUR', amount: '' };
    var s = String(raw);
    if (s.includes(':')) {
      var parts = s.split(':');
      return { currency: parts[0] === 'CNY' ? 'CNY' : 'EUR', amount: parts[1] };
    }
    return { currency: 'EUR', amount: s };
  }
  function formatPrice(raw) {
    var p = parsePrice(raw);
    if (!p.amount) return '';
    var sym = p.currency === 'CNY' ? '¥' : '€';
    return sym + p.amount;
  }

  var uploadedImages = [];

  async function onMarketImagesSelected(event) {
    var files = Array.from(event.target.files || []);
    for (var i = 0; i < files.length; i++) {
      var f = files[i];
      if (!f.type.startsWith('image/')) continue;
      if (f.size > 10 * 1024 * 1024) { alert(f.name + ' 超过 10MB，已跳过'); continue; }
      var fd = new FormData();
      fd.append('file', f);
      fd.append('bucket', 'market');
      try {
        var resp = await fetch('/api/upload', { method: 'POST', body: fd });
        var data = await resp.json();
        if (data.url) {
          uploadedImages.push(data.url);
          renderUploadPreview();
        } else if (data.error) {
          alert('上传失败：' + data.error);
        }
      } catch (e) { alert('网络错误'); }
    }
    event.target.value = '';
  }

  function renderUploadPreview() {
    var box = el('uploadPreview');
    box.innerHTML = '';
    uploadedImages.forEach(function(u, i) {
      var div = document.createElement('div');
      div.className = 'upload-thumb';
      div.innerHTML = '<img src="' + u + '" alt=""><span class="rm" onclick="removeUpload(' + i + ')">×</span>';
      box.appendChild(div);
    });
  }

  function removeUpload(i) {
    if (navigator.vibrate) navigator.vibrate(8);
    uploadedImages.splice(i, 1);
    renderUploadPreview();
  }

  function switchHub(tab, btn) {
    if (navigator.vibrate) navigator.vibrate(8);
    document.querySelectorAll('.hub-panel').forEach(p => p.classList.remove('active'));
    el('panel-' + tab).classList.add('active');
    document.querySelectorAll('.hub-tab').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    if (tab === 'market') loadMarket();
    else if (tab === 'treehole') loadTreehole();
    else if (tab === 'community') loadCommunity();
  }

  (function autoSwitchFromHash() {
    var hash = (location.hash || '').replace('#', '');
    if (hash === 'market' || hash === 'treehole' || hash === 'community') {
      var btn = document.querySelector('.hub-tab[data-tab="' + hash + '"]');
      if (btn) switchHub(hash, btn);
    }
  })();

  // ==================== 二手市场 ====================
  async function loadMarket() {
    var list = el('marketList');
    list.innerHTML = '<div class="empty-tip">加载中...</div>';
    try {
      var r = await fetch('/api/market');
      var data = await r.json();
      if (!Array.isArray(data) || data.length === 0) {
        list.innerHTML = '<div class="empty-tip">还没有人发布</div>';
        return;
      }
      list.innerHTML = '';
      data.forEach(function(item) {
        var card = document.createElement('div');
        card.className = 'item-card';
        var isMine = (item.user_email || '').toLowerCase() === MY_EMAIL;
        var isSell = (item.type || 'sell') === 'sell';
        var badge = isSell
          ? '<span class="market-badge sell">💰 出售</span>'
          : '<span class="market-badge want">🔍 求购</span>';
        var priceText = formatPrice(item.price);

        var urls = (item.image_url || '').split(',').filter(Boolean);
        var imgsHtml = '';
        if (urls.length) {
          imgsHtml = '<div class="market-images">' + urls.map(function(u) {
            return '<img src="' + escapeHtml(u) + '" onclick="window.open(\'' + escapeHtml(u) + '\',\'_blank\')" alt="">';
          }).join('') + '</div>';
        }

        card.innerHTML =
          '<div class="item-title">' + badge + escapeHtml(item.title) + '</div>' +
          '<div class="item-meta">' +
            (priceText ? '<span class="market-price">' + escapeHtml(priceText) + '</span>' : '') +
            (item.category ? '<span>' + escapeHtml(item.category) + '</span>' : '') +
            '<span style="margin-left:auto;">' + timeAgo(item.created_at) + '</span>' +
          '</div>' +
          imgsHtml +
          (item.description ? '<div class="item-body">' + escapeHtml(item.description) + '</div>' : '') +
          (item.contact ? '<div class="market-contact">📞 ' + escapeHtml(item.contact) + '</div>' : '') +

            '<button class="btn-reply" onclick="openMarketThread(' + item.id + ')">💬 询问 / 回复</button>' +

    }

  // ==================== 树洞 ====================

  function openAddTreehole() {

  async function submitTreehole() {

      var r = await fetch('/api/treeholes/add', {

  function openTreeholeThread(id) {

  // ==================== 互助社区 ====================
  async function loadCommunity() {
    var list = el('communityList');
    list.innerHTML = '<div class="empty-tip">加载中...</div>';
    try {
      var r = await fetch('/api/community/posts');
      var data = await r.json();

      }
      list.innerHTML = '';
      data.forEach(function(p) {

          '<div class="item-body">' + escapeHtml(p.content) + '</div>' +
          '<div class="item-actions">' +
            '<button class="btn-reply" onclick="openPostThread(' + p.id + ')">💬 查看评论</button>' +
            (isMine ? '<button class="btn-del" onclick="deletePost(' + p.id + ')">删除</button>' : '') +
          '</div>';

      list.innerHTML = '<div class="empty-tip">加载失败</div>';

  function openAddPost() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (!MY_EMAIL) { alert('请先登录'); location.href = '/login'; return; }
    el('pTitle').value = '';
    el('pContent').value = '';
    el('postModal').classList.add('show');
  }
  function closePostModal() { el('postModal').classList.remove('show'); }

  async function submitPost() {
    var title = el('pTitle').value.trim();
    var content = el('pContent').value.trim();
    if (!title || !content) { alert('标题和内容都要填'); return; }
    try {
      var r = await fetch('/api/community/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: MY_EMAIL,
          title: title,
          content: content,
          category: el('pCategory').value
        })
      });
      var d = await r.json();
      if (d.error) { alert(d.error); return; }
      closePostModal();
      loadCommunity();
    } catch (e) { alert('网络错误'); }

  async function deletePost(id) {
    if (!confirm('确定删除这个帖子吗？')) return;
    try {
      await fetch('/api/community/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id, email: MY_EMAIL })
      });
      loadCommunity();
    } catch (e) {}
  }

  function openPostThread(id) {
    if (!MY_EMAIL) { alert('请先登录'); location.href = '/login'; return; }
    openThread('post', id, '🤝 帖子评论');
  }

  // ==================== 楼中楼核心 ====================

  function openThread(type, id, title) {
    currentContext = { type: type, id: id };
    currentParentReplyId = null;
    currentReplyToName = '';
    el('threadTitle').textContent = title;
    el('threadModal').classList.add('show');
    el('threadBody').innerHTML = '<div class="empty-tip">加载中...</div>';
    loadThreadReplies();
  }

  function closeThreadModal() {
    el('threadModal').classList.remove('show');
    closeComposer();
    currentContext = null;
    currentParentReplyId = null;
  }

  async function loadThreadReplies() {
    if (!currentContext) return;
    var type = currentContext.type;
    var id = currentContext.id;
    var url = '';

    if (type === 'market') {
      url = '/api/market/comments?item_id=' + id;
    } else if (type === 'treehole') {
      url = '/api/treeholes/replies?id=' + id;
    } else if (type === 'post') {
      url = '/api/community/replies?post_id=' + id;
    }

    try {
      var r = await fetch(url);
      var data = await r.json();
      if (!Array.isArray(data) || data.length === 0) {
        el('threadBody').innerHTML =
          '<div class="empty-tip">还没有评论，说点什么吧</div>' +
          renderComposerButton();
        return;
      }
      var tree = buildReplyTree(data);
      el('threadBody').innerHTML =
        '<div class="reply-thread">' + renderReplyTree(tree, 0) + '</div>' +
        renderComposerButton();
    } catch (e) {
      el('threadBody').innerHTML = '<div class="empty-tip">加载失败</div>';
    }
  }

  function buildReplyTree(list) {
    var map = {};
    var roots = [];
    list.forEach(function(item) {
      map[item.id] = Object.assign({}, item, { children: [] });
    });
    list.forEach(function(item) {
      var node = map[item.id];
      if (item.parent_id && map[item.parent_id]) {
        map[item.parent_id].children.push(node);
      } else {
        roots.push(node);
      }
    });
    return roots;
  }

  function renderReplyTree(nodes, depth) {
    if (!nodes || nodes.length === 0) return '';
    var html = '';
    nodes.forEach(function(node) {
      var d = depth > 6 ? 6 : depth;
      var targetEmail = node.user_email || '';
      var nick = nickName(targetEmail);   // 树洞里自动返回「匿名」
      var parentNick = '';
      if (node.parent_id && node.parent_user_email) {
        parentNick = nickName(node.parent_user_email);  // 树洞里也自动「匿名」
      }
      var isMine = (node.user_email || '').toLowerCase() === MY_EMAIL;

      html += '<div class="reply-node depth-' + d + '" data-id="' + node.id + '">' +
        '<div class="r-head">' +
          '<span class="r-name">' + nick + '</span>' +
          (parentNick ? '<span class="r-reply-to">回复 <b>' + parentNick + '</b></span>' : '') +
        '</div>' +
        '<div class="r-content">' + escapeHtml(node.content) + '</div>' +
        '<div class="r-foot">' +
          '<span>' + timeAgo(node.created_at) + '</span>' +
          '<button class="r-btn" onclick="startReply(' + node.id + ', \'' + escapeHtml(nick).replace(/'/g, "\\'") + '\')">回复</button>' +
          (isMine ? '<button class="r-btn danger" onclick="deleteReply(' + node.id + ')">删除</button>' : '') +
        '</div>';

      if (node.children && node.children.length > 0) {
        html += renderReplyTree(node.children, depth + 1);
      }

      html += '</div>';
    });
    return html;
  }

  function renderComposerButton() {
    return '<div style="text-align:center;margin-top:14px;">' +
      '<button class="btn-reply" style="padding:10px 20px;border-radius:12px;border:none;background:rgba(160,216,179,0.15);color:#a0d8b3;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit;" onclick="startReply(null, \'\')">💬 写评论</button>' +
      '</div>';
  }

  function startReply(parentId, parentNick) {
    if (!MY_EMAIL) { alert('请先登录'); location.href = '/login'; return; }
    currentParentReplyId = parentId || null;
    currentReplyToName = parentNick || '';
    if (parentId) {
      // 树洞里，就算 parentNick 传的是真名，也显示匿名
      var displayNick = (currentContext && currentContext.type === 'treehole') ? '匿名' : parentNick;
      el('composerTo').innerHTML = '回复 <b>' + escapeHtml(displayNick) + '</b>';
    } else {
      el('composerTo').innerHTML = '发表评论';
    }
    el('composerInput').value = '';
    el('replyComposer').classList.add('show');
    setTimeout(function() { el('composerInput').focus(); }, 100);
  }

  function closeComposer() {
    el('replyComposer').classList.remove('show');
    el('composerInput').value = '';
    currentParentReplyId = null;
    currentReplyToName = '';
  }

  async function submitComposer() {
    var content = el('composerInput').value.trim();
    if (!content) { alert('写点什么吧'); return; }
    if (!currentContext) { closeComposer(); return; }

    if (navigator.vibrate) navigator.vibrate(12);

    var payload = {
      email: MY_EMAIL,
      content: content,
      parent_id: currentParentReplyId || null
    };

    var url = '';
    if (currentContext.type === 'market') {
      url = '/api/market/comments/add';
      payload.item_id = currentContext.id;
    } else if (currentContext.type === 'treehole') {
      url = '/api/treeholes/reply';
      payload.treehole_id = currentContext.id;
    } else if (currentContext.type === 'post') {
      url = '/api/community/reply';
      payload.post_id = currentContext.id;
    }

    try {
      var r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var d = await r.json();
      if (d.error) { alert(d.error); return; }
      el('composerInput').value = '';
      closeComposer();
      loadThreadReplies();
    } catch (e) { alert('网络错误'); }
  }

  async function deleteReply(replyId) {
    if (!MY_EMAIL) return;
    if (!confirm('确定删除这条评论吗？')) return;
    if (!currentContext) return;

    var url = '';
    var payload = { id: replyId, email: MY_EMAIL };
    if (currentContext.type === 'market') {
      url = '/api/market/comments/delete';
    } else if (currentContext.type === 'treehole') {
      url = '/api/treeholes/reply/delete';
    } else if (currentContext.type === 'post') {
      url = '/api/community/reply/delete';
    }

    try {
      var r = await fetch(url, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      var d = await r.json();
      if (d.error) { alert(d.error); return; }
      loadThreadReplies();
    } catch (e) { alert('网络错误'); }
  }

  loadMarket();
</script>
