<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/static/style.css">
<title>汇率 + 记账 · 西班牙留学生工具站</title>
<style>
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
    z-index: 10;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  .top-bar .back-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff; font-size: 18px;
    width: 40px; height: 40px;
    border-radius: 999px; cursor: pointer;
  }
  .top-bar .back-btn:active { transform: scale(0.9); }
  .top-bar .title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }

  #content { padding: 80px 20px 120px; }

  .rate-bar {
    display: flex; justify-content: space-around;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 14px 10px; margin-bottom: 20px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }
  .rate-bar .rate-item { flex: 1; text-align: center; }
  .rate-bar .rate-label { font-size: 11px; color: #888; margin-bottom: 4px; }
  .rate-bar .rate-value { font-size: 14px; font-weight: 700; color: #e8a8b8; }
  .rate-bar .rate-time { font-size: 10px; color: #666; margin-top: 4px; }

  .tab-bar { display: flex; gap: 6px; margin-bottom: 16px; }
  .tab-btn {
    flex: 1; padding: 12px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #aaa; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .tab-btn.active {
    background: rgba(232,168,184,0.14); color: #e8a8b8;
    border-color: rgba(232,168,184,0.28); font-weight: 700;
  }
  .tab-btn:active { transform: scale(0.96); }

  .tab-panel { display: none; }
  .tab-panel.active { display: block; animation: fadeIn 0.35s cubic-bezier(0.22, 1, 0.36, 1); }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

  .card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 20px; margin-bottom: 14px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
    box-shadow: 0 8px 32px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.1);
  }

  .input-row { display: flex; gap: 10px; align-items: center; margin-bottom: 12px; }
  .input-row input {
    flex: 1; padding: 14px 16px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 18px; outline: none; font-family: inherit;
  }
  .input-row input:focus { border-color: rgba(232,168,184,0.28); }
  .input-row select {
    padding: 14px 12px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  .input-row select option { background: #1a1a1e; }

  .result-row {
    display: flex; justify-content: space-between; align-items: center;
    padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.05);
  }
  .result-row:last-child { border-bottom: none; }
  .result-row .label { font-size: 13px; color: #888; }
  .result-row .value { font-size: 18px; font-weight: 700; color: #e8a8b8; }

  .quick-amounts { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .quick-amounts button {
    padding: 8px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px; cursor: pointer;
  }
  .quick-amounts button:active { transform: scale(0.95); background: rgba(232,168,184,0.15); }

  .filter-row {
    display: flex; gap: 8px; overflow-x: auto;
    margin-bottom: 14px; padding-bottom: 4px;
  }
  .filter-row::-webkit-scrollbar { display: none; }
  .filter-chip {
    padding: 8px 16px; border-radius: 999px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px;
    white-space: nowrap; cursor: pointer; transition: 0.2s;
  }
  .filter-chip.active {
    background: rgba(232,168,184,0.14); color: #e8a8b8;
    border-color: rgba(232,168,184,0.28); font-weight: 700;
  }
  .filter-chip:active { transform: scale(0.95); }

  .custom-date-row {
    display: none; gap: 10px; margin-bottom: 14px; align-items: center;
  }
  .custom-date-row.show { display: flex; }
  .custom-date-row input {
    flex: 1; padding: 10px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 13px; outline: none;
    font-family: inherit; color-scheme: dark;
  }

  .summary-card {
    display: flex; justify-content: space-around;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 18px; margin-bottom: 16px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
  }
  .summary-item { text-align: center; flex: 1; }
  .summary-item .label { font-size: 11px; color: #888; margin-bottom: 6px; }
  .summary-item .value { font-size: 18px; font-weight: 700; }
  .summary-item .value.income { color: #6fbf8e; }
  .summary-item .value.expense { color: #e8a8b8; }
  .summary-item .value.balance { color: #ffffff; }

  .add-form {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px; padding: 18px; margin-bottom: 16px;
  }
  .add-form .type-row { display: flex; gap: 8px; margin-bottom: 12px; }
  .add-form .type-row button {
    flex: 1; padding: 12px; border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 14px; cursor: pointer; transition: 0.2s;
  }
  .add-form .type-row button.active {
    background: rgba(232,168,184,0.14); color: #e8a8b8;
    border-color: rgba(232,168,184,0.28); font-weight: 700;
  }
  .add-form .field-row { margin-bottom: 10px; }
  .add-form label { font-size: 11px; color: #888; display: block; margin-bottom: 6px; }
  .add-form input, .add-form select {
    width: 100%; padding: 12px 14px; border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.08);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none; font-family: inherit;
  }
  .add-form input:focus, .add-form select:focus { border-color: rgba(232,168,184,0.28); }
  .add-form select option { background: #1a1a1e; }
  .add-form input[type="date"] { color-scheme: dark; }

  .primary-btn {
    width: 100%; padding: 14px; border-radius: 999px; border: none;
    background: linear-gradient(135deg, #e8a8b8, #c98094);
    color: #1a0f14; font-size: 15px; font-weight: 700;
    cursor: pointer; margin-top: 10px;
    box-shadow: 0 8px 28px rgba(232,168,184,0.35);
  }
  .primary-btn:active { transform: scale(0.97); }

  .record-item {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 14px; padding: 12px 14px; margin-bottom: 8px;
  }
  .record-item .rec-left { flex: 1; min-width: 0; }
  .record-item .rec-title { font-size: 13.5px; color: #fff; font-weight: 600; margin-bottom: 3px; }
  .record-item .rec-meta { font-size: 11px; color: #888; }
  .record-item .rec-amount { font-size: 15px; font-weight: 700; margin-right: 10px; }
  .record-item .rec-amount.income { color: #6fbf8e; }
  .record-item .rec-amount.expense { color: #e8a8b8; }
  .record-item .rec-del {
    background: none; border: none; color: #666;
    font-size: 16px; cursor: pointer; padding: 4px 8px;
  }
  .record-item .rec-del:active { color: #ff6b6b; }

  .empty-state { text-align: center; padding: 40px 20px; color: #666; font-size: 13px; }

  .bill-btn {
    width: 100%; padding: 14px; border-radius: 999px;
    border: 1px solid rgba(232,168,184,0.28);
    background: rgba(232,168,184,0.14);
    color: #e8a8b8; font-size: 14px; font-weight: 700;
    cursor: pointer; margin-bottom: 16px;
  }
  .bill-btn:active { transform: scale(0.97); }

  .modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.85);
    display: none; justify-content: center; align-items: center;
    z-index: 200; padding: 20px;
    backdrop-filter: blur(8px);
  }
  .modal.show { display: flex; }
  .modal-content {
    background: #1a1a1e; width: 100%; max-width: 400px;
    border-radius: 22px; padding: 22px;
    border: 1px solid rgba(255,255,255,0.1);
    max-height: 85vh; overflow-y: auto;
  }
  .bill-card {
    background: linear-gradient(135deg, #e8a8b8, #c98094);
    color: #1a0f14; border-radius: 20px; padding: 24px; margin-bottom: 16px;
  }
  .bill-card .bill-period { font-size: 12px; opacity: 0.7; margin-bottom: 8px; }
  .bill-card .bill-title { font-size: 22px; font-weight: 900; margin-bottom: 18px; }
  .bill-card .bill-line {
    display: flex; justify-content: space-between; padding: 8px 0;
    border-bottom: 1px dashed rgba(26,15,20,0.15); font-size: 14px;
  }
  .bill-card .bill-line:last-child { border-bottom: none; }
  .bill-card .bill-line.total {
    font-weight: 700; font-size: 16px; margin-top: 6px;
    padding-top: 12px;
    border-top: 2px solid rgba(26,15,20,0.2);
    border-bottom: none;
  }
  .bill-card .bill-footer {
    font-size: 11px; opacity: 0.6;
    text-align: right; margin-top: 16px;
  }

  .modal-btns { display: flex; gap: 10px; }
  .modal-btns button {
    flex: 1; padding: 12px; border-radius: 999px;
    border: none; font-size: 14px; font-weight: 700; cursor: pointer;
  }
  .modal-btns .close-btn { background: rgba(255,255,255,0.1); color: #fff; }
</style>
</head>
<body>

<div class="top-bar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">💱 汇率 + 记账</div>
</div>

<div id="content">

  <div class="rate-bar">
    <div class="rate-item">
      <div class="rate-label">💶 欧元 → 💰 人民币</div>
      <div class="rate-value" id="eurToCny">--</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">💶 欧元 → 💵 美元</div>
      <div class="rate-value" id="eurToUsd">--</div>
    </div>
    <div class="rate-item">
      <div class="rate-label">汇率更新</div>
      <div class="rate-value" id="rateTime">加载中</div>
    </div>
  </div>

  <div class="tab-bar">
    <button class="tab-btn active" onclick="switchTab('calc', this)">💱 汇率换算</button>
    <button class="tab-btn" onclick="switchTab('book', this)">📒 记账本</button>
  </div>

  <div class="tab-panel active" id="panel-calc">
    <div class="card">
      <div style="font-size:13px; color:#888; margin-bottom:8px;">输入金额</div>
      <div class="input-row">
        <input type="number" id="amountInput" placeholder="0.00" oninput="convert()">
        <select id="fromCurrency" onchange="convert()">
          <option value="EUR">💶 欧元</option>
          <option value="CNY">💰 人民币</option>
          <option value="USD">💵 美元</option>
        </select>
      </div>

      <div style="font-size:13px; color:#888; margin:14px 0 8px;">快捷金额</div>
      <div class="quick-amounts">
        <button onclick="setAmount(10)">10</button>
        <button onclick="setAmount(50)">50</button>
        <button onclick="setAmount(100)">100</button>
        <button onclick="setAmount(500)">500</button>
        <button onclick="setAmount(1000)">1000</button>
      </div>

      <div style="margin-top: 16px;">
        <div class="result-row"><span class="label">💶 欧元</span><span class="value" id="resEur">€0.00</span></div>
        <div class="result-row"><span class="label">💰 人民币</span><span class="value" id="resCny">¥0.00</span></div>
        <div class="result-row"><span class="label">💵 美元</span><span class="value" id="resUsd">$0.00</span></div>
      </div>
    </div>
  </div>

  <div class="tab-panel" id="panel-book">

    <div class="summary-card">
      <div class="summary-item">
        <div class="label">收入</div>
        <div class="value income" id="sumIncome">€0</div>
      </div>
      <div class="summary-item">
        <div class="label">支出</div>
        <div class="value expense" id="sumExpense">€0</div>
      </div>
      <div class="summary-item">
        <div class="label">结余</div>
        <div class="value balance" id="sumBalance">€0</div>
      </div>
    </div>

    <div class="filter-row" id="filterRow"></div>

    <div class="custom-date-row" id="customDateRow">
      <input type="date" id="startDate">
      <input type="date" id="endDate">
      <button class="filter-chip" onclick="applyCustomRange()">应用</button>
    </div>

    <div class="add-form">
      <div class="type-row">
        <button class="active" id="btnExpense" onclick="setType('expense')">💸 支出</button>
        <button id="btnIncome" onclick="setType('income')">💰 收入</button>
      </div>

      <div class="field-row">
        <label>金额（€）</label>
        <input type="number" id="txAmount" placeholder="0.00" step="0.01">
      </div>

      <div class="field-row">
        <label>类别</label>
        <select id="txCategory">
          <option value="吃饭">🍚 吃饭</option>
          <option value="房租">🏠 房租</option>
          <option value="交通">🚌 交通</option>
          <option value="购物">🛍️ 购物</option>
          <option value="娱乐">🎉 娱乐</option>
          <option value="工资">💼 工资</option>
          <option value="其他">📦 其他</option>
        </select>
      </div>

      <div class="field-row">
        <label>备注（吃了什么 / 买了什么）</label>
        <input type="text" id="txNote" placeholder="比如：午饭吃了海鲜饭">
      </div>

      <div class="field-row">
        <label>日期</label>
        <input type="date" id="txDate">
      </div>

      <button class="primary-btn" onclick="addTransaction()">➕ 添加</button>
    </div>

    <button class="bill-btn" onclick="generateBill()">📊 生成这段时间的账单</button>

    <div id="recordList"></div>

  </div>

</div>

<div class="modal" id="billModal">
  <div class="modal-content">
    <div id="billContainer"></div>
    <div class="modal-btns">
      <button class="close-btn" onclick="closeBill()">关闭</button>
    </div>
  </div>
</div>

<script>
  const MY_EMAIL = localStorage.getItem('user_email') || 'anonymous';
  let rates = { EUR_TO_CNY: 7.85, EUR_TO_USD: 1.08, updatedAt: '默认汇率' };
  let transactions = [];
  let currentType = 'expense';
  let currentRange = { type: 'month', value: '' };

  async function fetchRates() {
    try {
      const resp = await fetch('https://api.exchangerate.host/latest?base=EUR');
      const data = await resp.json();
      if (data && data.rates) {
        rates.EUR_TO_CNY = data.rates.CNY;
        rates.EUR_TO_USD = data.rates.USD;
        rates.updatedAt = new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' });
      }
    } catch (e) { rates.updatedAt = '默认汇率'; }
    renderRateBar();
    convert();
  }

  function renderRateBar() {
    document.getElementById('eurToCny').textContent = '¥' + rates.EUR_TO_CNY.toFixed(2);
    document.getElementById('eurToUsd').textContent = '$' + rates.EUR_TO_USD.toFixed(2);
    document.getElementById('rateTime').textContent = rates.updatedAt;
  }

  function switchTab(tab, el) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.getElementById('panel-' + tab).classList.add('active');
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    if (tab === 'book') loadTransactions();
  }

  function setAmount(v) {
    document.getElementById('amountInput').value = v;
    convert();
  }

  function convert() {
    const amount = parseFloat(document.getElementById('amountInput').value) || 0;
    const from = document.getElementById('fromCurrency').value;
    let eur = 0;
    if (from === 'EUR') eur = amount;
    else if (from === 'CNY') eur = amount / rates.EUR_TO_CNY;
    else if (from === 'USD') eur = amount / rates.EUR_TO_USD;
    document.getElementById('resEur').textContent = '€' + eur.toFixed(2);
    document.getElementById('resCny').textContent = '¥' + (eur * rates.EUR_TO_CNY).toFixed(2);
    document.getElementById('resUsd').textContent = '$' + (eur * rates.EUR_TO_USD).toFixed(2);
  }

  function renderFilterRow() {
    const row = document.getElementById('filterRow');
    row.innerHTML = '';
    const now = new Date();
    for (let i = 0; i < 6; i++) {
      const d = new Date(now.getFullYear(), now.getMonth() - i, 1);
      const ym = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
      const label = (d.getMonth() + 1) + '月';
      const chip = document.createElement('div');
      chip.className = 'filter-chip' + (i === 0 && currentRange.type === 'month' ? ' active' : '');
      chip.textContent = label;
      chip.onclick = () => {
        currentRange = { type: 'month', value: ym };
        document.getElementById('customDateRow').classList.remove('show');
        renderFilterRow();
        loadTransactions();
      };
      if (i === 0 && !currentRange.value) {
        currentRange = { type: 'month', value: ym };
      }
      row.appendChild(chip);
    }
    const custom = document.createElement('div');
    custom.className = 'filter-chip' + (currentRange.type === 'custom' ? ' active' : '');
    custom.textContent = '📅 自定义';
    custom.onclick = () => {
      document.getElementById('customDateRow').classList.add('show');
    };
    row.appendChild(custom);
  }

  function applyCustomRange() {
    const start = document.getElementById('startDate').value;
    const end = document.getElementById('endDate').value;
    if (!start || !end) { alert('请选择起止日期'); return; }
    currentRange = { type: 'custom', value: start + '|' + end };
    document.getElementById('customDateRow').classList.remove('show');
    renderFilterRow();
    loadTransactions();
  }

  function getDateRange() {
    if (currentRange.type === 'month') {
      const [y, m] = currentRange.value.split('-');
      const start = y + '-' + m + '-01';
      const lastDay = new Date(parseInt(y), parseInt(m), 0).getDate();
      const end = y + '-' + m + '-' + String(lastDay).padStart(2, '0');
      return { start, end };
    } else if (currentRange.type === 'custom') {
      const [start, end] = currentRange.value.split('|');
      return { start, end };
    }
    return { start: '', end: '' };
  }

  async function loadTransactions() {
    const list = document.getElementById('recordList');
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:13px;">加载中...</div>';
    const range = getDateRange();

    try {
      const resp = await fetch('/api/transactions?owner=' + encodeURIComponent(MY_EMAIL) + '&start=' + range.start + '&end=' + range.end);
      const data = await resp.json();
      transactions = Array.isArray(data) ? data : [];
    } catch(e) { transactions = []; }

    renderSummary();
    renderRecords();
  }

  function renderSummary() {
    let income = 0, expense = 0;
    transactions.forEach(t => {
      if (t.type === 'income') income += parseFloat(t.amount || 0);
      else expense += parseFloat(t.amount || 0);
    });
    document.getElementById('sumIncome').textContent = '€' + income.toFixed(2);
    document.getElementById('sumExpense').textContent = '€' + expense.toFixed(2);
    document.getElementById('sumBalance').textContent = '€' + (income - expense).toFixed(2);
  }

  function renderRecords() {
    const list = document.getElementById('recordList');
    if (transactions.length === 0) {
      list.innerHTML = '<div class="empty-state">这段时间还没有记录</div>';
      return;
    }
    list.innerHTML = '';
    transactions.forEach(t => {
      const div = document.createElement('div');
      div.className = 'record-item';
      const cls = t.type === 'income' ? 'income' : 'expense';
      const sign = t.type === 'income' ? '+' : '-';
      div.innerHTML = `
        <div class="rec-left">
          <div class="rec-title">${t.category || '其他'} ${t.note ? '· ' + t.note : ''}</div>
          <div class="rec-meta">${t.tx_date || ''}</div>
        </div>
        <div class="rec-amount ${cls}">${sign}€${parseFloat(t.amount || 0).toFixed(2)}</div>
        <button class="rec-del" onclick="delTransaction(${t.id})">✕</button>
      `;
      list.appendChild(div);
    });
  }

  function setType(t) {
    currentType = t;
    document.getElementById('btnExpense').classList.toggle('active', t === 'expense');
    document.getElementById('btnIncome').classList.toggle('active', t === 'income');
  }

  async function addTransaction() {
    const amount = parseFloat(document.getElementById('txAmount').value);
    const category = document.getElementById('txCategory').value;
    const note = document.getElementById('txNote').value.trim();
    const txDate = document.getElementById('txDate').value || new Date().toISOString().slice(0, 10);

    if (!amount || amount <= 0) { alert('请输入金额'); return; }
    if (navigator.vibrate) navigator.vibrate(15);

    try {
      const resp = await fetch('/api/transactions/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: MY_EMAIL,
          type: currentType,
          category: category,
          amount: amount,
          note: note,
          tx_date: txDate
        })
      });
      const data = await resp.json();
      if (data.error) { alert('添加失败：' + data.error); return; }
    } catch(e) { alert('网络错误'); return; }

    document.getElementById('txAmount').value = '';
    document.getElementById('txNote').value = '';
    await loadTransactions();
  }

  async function delTransaction(id) {
    if (navigator.vibrate) navigator.vibrate(10);
    if (!confirm('确定删除这条记录吗？')) return;
    try {
      await fetch('/api/transactions/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id: id })
      });
    } catch(e) {}
    await loadTransactions();
  }

  function generateBill() {
    if (transactions.length === 0) {
      alert('这段时间没有记录，无法生成账单');
      return;
    }
    if (navigator.vibrate) navigator.vibrate(15);

    let income = 0, expense = 0;
    const byCategory = {};
    transactions.forEach(t => {
      const amt = parseFloat(t.amount || 0);
      if (t.type === 'income') income += amt;
      else {
        expense += amt;
        const cat = t.category || '其他';
        byCategory[cat] = (byCategory[cat] || 0) + amt;
      }
    });
    const balance = income - expense;

    const range = getDateRange();
    const periodText = range.start + ' 至 ' + range.end;
    const sortedCats = Object.keys(byCategory).sort((a, b) => byCategory[b] - byCategory[a]);

    let catHtml = '';
    sortedCats.forEach(cat => {
      catHtml += '<div class="bill-line"><span>' + cat + '</span><span>€' + byCategory[cat].toFixed(2) + '</span></div>';
    });

    const html = '<div class="bill-card">' +
      '<div class="bill-period">' + periodText + '</div>' +
      '<div class="bill-title">📊 账单</div>' +
      '<div class="bill-line"><span>收入</span><span>€' + income.toFixed(2) + '</span></div>' +
      '<div class="bill-line"><span>支出</span><span>€' + expense.toFixed(2) + '</span></div>' +
      '<div class="bill-line total"><span>结余</span><span>€' + balance.toFixed(2) + '</span></div>' +
      '<div style="margin-top:16px;font-size:13px;opacity:0.8;">支出明细</div>' +
      (catHtml || '<div class="bill-line"><span>暂无支出</span><span>—</span></div>') +
      '<div class="bill-footer">来自「独家记账」</div>' +
    '</div>';

    document.getElementById('billContainer').innerHTML = html;
    document.getElementById('billModal').classList.add('show');
  }

  function closeBill() {
    document.getElementById('billModal').classList.remove('show');
  }

  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) window.history.back();
    else location.href = '/?tab=tools';
  }

  fetchRates();
  renderFilterRow();
  loadTransactions();
</script>
</body>
</html>
