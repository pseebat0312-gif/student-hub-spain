<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="stylesheet" href="/static/style.css">
<title>VIP 会员 · 西班牙留学生工具站</title>
<style>
  .top-bar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.95), transparent);
    z-index: 10;
    backdrop-filter: blur(24px) saturate(180%);
    -webkit-backdrop-filter: blur(24px) saturate(180%);
  }
  .top-bar .back-btn {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    color: #fff; font-size: 18px;
    width: 40px; height: 40px;
    border-radius: 999px; cursor: pointer;
  }
  .top-bar .back-btn:active { transform: scale(0.9); }
  .top-bar .title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.4px; }

  #content { padding: 80px 20px 60px; }

  .hero { text-align: center; margin-bottom: 30px; }
  .hero .crown { font-size: 56px; margin-bottom: 10px; }
  .hero h1 {
    font-size: 28px; font-weight: 900; letter-spacing: -0.5px;
    background: linear-gradient(135deg, #e8a8b8, #c98094);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    margin-bottom: 8px;
  }
  .hero p { font-size: 14px; color: rgba(255,255,255,0.55); line-height: 1.6; }

  .benefits {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 22px;
    padding: 22px;
    margin-bottom: 20px;
    backdrop-filter: blur(30px) saturate(180%);
    -webkit-backdrop-filter: blur(30px) saturate(180%);
  }
  .benefits h3 { font-size: 15px; font-weight: 700; color: #e8a8b8; margin-bottom: 16px; }
  .benefit-item {
    display: flex; gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid rgba(255,255,255,0.05);
    font-size: 14px; color: rgba(255,255,255,0.85); line-height: 1.5;
  }
  .benefit-item:last-child { border-bottom: none; }
  .benefit-item .check { color: #6fbf8e; font-size: 18px; flex-shrink: 0; }

  .price-card {
    background: linear-gradient(135deg, #e8a8b8, #c98094);
    color: #1a0f14;
    border-radius: 22px;
    padding: 24px;
    text-align: center;
    margin-bottom: 20px;
    box-shadow: 0 12px 40px rgba(232,168,184,0.4);
  }
  .price-card .price-tag {
    display: inline-block;
    background: rgba(26,15,20,0.15);
    padding: 4px 12px;
    border-radius: 12px;
    font-size: 11px;
    font-weight: 700;
    margin-bottom: 12px;
  }
  .price-card .first-month { font-size: 13px; opacity: 0.75; margin-bottom: 8px; }
  .price-card .price-big {
    font-size: 56px;
    font-weight: 900;
    letter-spacing: -2px;
    line-height: 1;
  }
  .price-card .price-big .unit { font-size: 20px; font-weight: 600; opacity: 0.7; margin-left: 4px; }
  .price-card .price-after { font-size: 13px; opacity: 0.75; margin-top: 8px; }

  .subscribe-btn {
    width: 100%;
    padding: 18px;
    border-radius: 999px;
    border: none;
    background: #ffffff;
    color: #1a0f14;
    font-size: 16px;
    font-weight: 800;
    cursor: pointer;
    letter-spacing: -0.2px;
    box-shadow: 0 8px 28px rgba(255,255,255,0.2);
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  .subscribe-btn:active { transform: scale(0.96); }

  .footer-note {
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,0.4);
    line-height: 1.8;
    margin-top: 16px;
  }

  .vip-active {
    background: linear-gradient(135deg, #e8a8b8, #c98094);
    color: #1a0f14;
    border-radius: 22px;
    padding: 30px 24px;
    text-align: center;
    margin-bottom: 20px;
  }
  .vip-active .crown-big { font-size: 56px; margin-bottom: 10px; }
  .vip-active h2 { font-size: 22px; font-weight: 900; margin-bottom: 6px; }
  .vip-active p { font-size: 13px; opacity: 0.75; }
</style>
</head>
<body>

      <div class="benefit-item">

      <div class="first-month">第一个月只要</div>
      <div class="price-big">€1<span class="unit">.00</span></div>

    <button class="subscribe-btn" onclick="goSubscribe()">立即订阅 →</button>

  function goSubscribe() {

</html>
