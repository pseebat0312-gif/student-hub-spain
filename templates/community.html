<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>留学生社区 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  /* 发布按钮 */
  .publish-btn {
    width: 100%; padding: 16px; border-radius: 16px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.1s; margin-bottom: 16px;
  }
  .publish-btn:active { transform: scale(0.97); }

  /* 发布表单 */
  .form-card {
    display: none; background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 18px; margin-bottom: 20px;
  }
  .form-card.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .form-card input, .form-card textarea, .form-card select {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 10px; font-family: inherit;
  }
  .form-card textarea { height: 90px; resize: none; }
  .form-card select option { background: #1a1a2e; }
  .form-card input:focus, .form-card textarea:focus { border-color: #a0d8b3; }

  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions button {
    flex: 1; padding: 12px; border-radius: 12px;
    border: none; font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .form-actions .cancel { background: rgba(255,255,255,0.1); color: #ccc; }
  .form-actions .submit { background: linear-gradient(135deg, #4a7c59, #2d5a3d); color: #fff; }

  /* 排序栏 */
  .sort-bar { display: flex; gap: 8px; margin-bottom: 16px; }
  .sort-btn {
    flex: 1; padding: 10px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px; cursor: pointer; transition: 0.2s;
  }
  .sort-btn.active { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .sort-btn:active { transform: scale(0.96); }

  /* 帖子卡片 */
  .post-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px; padding: 16px; margin-bottom: 14px;
    transition: 0.15s;
  }
  .post-card:active { transform: scale(0.99); }
  .post-head { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; }
  .post-tag {
    font-size: 11px; padding: 3px 8px; border-radius: 8px;
    background: rgba(160, 216, 179, 0.15); color: #a0d8b3;
    white-space: nowrap;
  }
  .post-title { font-size: 15px; font-weight: bold; color: #fff; flex: 1; line-height: 1.4; }
  .post-meta { font-size: 12px; color: #888; margin-bottom: 8px; }
  .post-content-preview {
    font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 10px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  .post-footer {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #888;
  }
  .post-footer button {
    padding: 6px 14px; border-radius: 10px; border: none;
    background: rgba(160, 216, 179, 0.15); color: #a0d8b3;
    font-size: 12px; cursor: pointer; transition: 0.15s;
  }
  .post-footer button:active { transform: scale(0.95); }

  /* 详情弹窗 */
  .detail-modal {
    position: fixed; inset: 0; background: rgba(0,0,0,0.8);
    display: none; justify-content: center; align-items: flex-end; z-index: 100;
  }
  .detail-modal.show { display: flex; }
  .detail-content {
    background: #1a1a2e; width: 100%; max-width: 500px;
    border-radius: 25px 25px 0 0; padding: 24px 20px 35px;
    max-height: 85vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-content .post-detail-title { font-size: 18px; font-weight: bold; color: #a0d8b3; margin-bottom: 6px; }
  .detail-content .post-detail-meta { font-size: 12px; color: #888; margin-bottom: 14px; }
  .detail-content .post-detail-body { font-size: 14px; color: #ddd; line-height: 1.7; margin-bottom: 20px; white-space: pre-wrap; }

  /* 回复列表 */
  .reply-item {
    padding: 10px 12px; background: rgba(255,255,255,0.04);
    border-radius: 10px; margin-bottom: 8px; font-size: 13px; color: #ccc;
    line-height: 1.6;
  }
  .reply-item .reply-user { color: #a0d8b3; font-weight: bold; margin-right: 6px; }

  .reply-input-row { display: flex; gap: 8px; margin-top: 14px; }
  .reply-input-row input {
    flex: 1; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
  }
  .reply-input-row button {
    padding: 0 18px; border-radius: 12px; border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-weight: bold; font-size: 14px; cursor: pointer;
  }
  .close-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: rgba(255,255,255,0.08);
    color: #fff; font-size: 15px; cursor: pointer; margin-top: 16px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">💬 留学生互助社区</div>
</div>

<div id="content">

  <button class="publish-btn" onclick="togglePublish()">➕ 发布新帖子</button>

  <!-- 发帖表单 -->
  <div class="form-card" id="publishForm">
    <input type="text" id="postTitle" placeholder="标题 *">
    <textarea id="postContent" placeholder="内容 *"></textarea>
    <select id="postCategory">
      <option>经验分享</option>
      <option>踩坑求助</option>
      <option>学习交流</option>
      <option>生活日常</option>
      <option>其他</option>
    </select>
    <div class="form-actions">
      <button class="cancel" onclick="togglePublish()">取消</button>
      <button class="submit" onclick="submitPost()">发布</button>
    </div>
  </div>

  <!-- 排序 -->
  <div class="sort-bar">
    <button class="sort-btn active" data-sort="new" onclick="sortBy('new', this)">最新发布</button>
    <button class="sort-btn" data-sort="hot" onclick="sortBy('hot', this)">最多回复</button>
  </div>

  <!-- 帖子列表（演示数据） -->
  <div id="postList">

    <div class="post-card">
      <div class="post-head">
        <div class="post-title">刚到马德里，NIE 办理经验分享</div>
        <div class="post-tag">经验分享</div>
      </div>
      <div class="post-meta">发布者：molly@example.com · 2026-09-28</div>
      <div class="post-content-preview">今天刚办完 NIE，分享一下整个流程。最重要的是提前预约，然后带齐材料...</div>
      <div class="post-footer">
        <span>💬 3 条回复</span>
        <button onclick="openPost('刚到马德里，NIE 办理经验分享', '今天刚办完 NIE，分享一下整个流程。最重要的是提前预约，然后带齐材料。\n\n预约系统经常崩，建议凌晨去刷。材料一定要准备齐全，特别是住家证明和缴费单。', '经验分享', 'molly@example.com', ['感谢分享！很有用', '请问住家证明要提前多久办？', '我也刚办完，补充一句：记得带两张照片'])">查看详情</button>
      </div>
    </div>

    <div class="post-card">
      <div class="post-head">
        <div class="post-title">租房遇到黑心房东，求支招</div>
        <div class="post-tag">踩坑求助</div>
      </div>
      <div class="post-meta">发布者：lucas@example.com · 2026-09-27</div>
      <div class="post-content-preview">押金一直不退，房东各种理由拖着，有人有类似经验吗？...</div>
      <div class="post-footer">
        <span>💬 1 条回复</span>
        <button onclick="openPost('租房遇到黑心房东，求支招', '押金一直不退，房东各种理由拖着。合同上是说退房后 30 天内退押金，现在已经两个月了。\n\n有没有人有类似经验？应该去哪里投诉？', '踩坑求助', 'lucas@example.com', ['可以去消费者协会投诉，也可以找学校的法律援助'])">查看详情</button>
      </div>
    </div>

  </div>

</div>

<!-- 帖子详情弹窗 -->
<div class="detail-modal" id="detailModal">
  <div class="detail-content">
    <div class="post-detail-title" id="dTitle">标题</div>
    <div class="post-detail-meta" id="dMeta">发布者 · 时间</div>
    <div class="post-detail-body" id="dBody">内容</div>

    <div id="replyList"></div>

    <div class="reply-input-row">
      <input type="text" id="replyInput" placeholder="写下你的回复...">
      <button onclick="sendReply()">发送</button>
    </div>

    <button class="close-btn" onclick="closePost()">关闭</button>
  </div>
</div>

<script>
    // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    // 如果是从别的页面跳进来的（有历史记录），就返回上一页
    if (window.history.length > 1) {
      window.history.back();
    } else {
      // 如果用户是直接打开这个链接的，就回主页
      location.href = '/';
    }
  }
  // ===== 发布表单 =====
  function togglePublish() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('publishForm').classList.toggle('show');
  }

  function submitPost() {
    const title = document.getElementById('postTitle').value.trim();
    const content = document.getElementById('postContent').value.trim();
    if (!title || !content) {
      alert('标题和内容不能为空');
      return;
    }
    if (navigator.vibrate) navigator.vibrate(20);
    alert('✅ 已填写完毕。\n\n等我们接上 Supabase 后，点这里就会直接发帖到数据库。');
    togglePublish();
  }

  // ===== 排序 =====
  function sortBy(type, el) {
    if (navigator.vibrate) navigator.vibrate(10);
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
  }

  // ===== 打开详情 =====
  let currentPost = null;
  function openPost(title, body, category, author, replies) {
    if (navigator.vibrate) navigator.vibrate(10);
    currentPost = { title, replies: replies || [] };
    document.getElementById('dTitle').textContent = title;
    document.getElementById('dMeta').textContent = `[${category}] ${author}`;
    document.getElementById('dBody').textContent = body;
    renderReplies();
    document.getElementById('detailModal').classList.add('show');
  }

  function renderReplies() {
    const list = document.getElementById('replyList');
    list.innerHTML = '';
    if (!currentPost.replies || currentPost.replies.length === 0) {
      list.innerHTML = '<div style="color:#666; font-size:13px; margin-bottom:10px;">还没有回复，来抢沙发吧！</div>';
      return;
    }
    currentPost.replies.forEach(r => {
      const div = document.createElement('div');
      div.className = 'reply-item';
      div.innerHTML = `<span class="reply-user">匿名用户：</span>${r}`;
      list.appendChild(div);
    });
  }

  function sendReply() {
    const input = document.getElementById('replyInput');
    const text = input.value.trim();
    if (!text) return;
    if (navigator.vibrate) navigator.vibrate(15);
    currentPost.replies.push(text);
    renderReplies();
    input.value = '';
  }

  function closePost() {
    document.getElementById('detailModal').classList.remove('show');
  }

</script>
<script>
// 未登录自动跳登录
(function () {
  const token = localStorage.getItem('access_token');
  if (!token) {
    const back = encodeURIComponent(window.location.pathname + window.location.search);
    window.location.replace('/login?back=' + back);
  }
})();
</script>
</body>
</html>
