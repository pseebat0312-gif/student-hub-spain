<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>个人中心 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  .hero-card {
    text-align: center;
    padding: 30px 20px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 20px;
    margin-bottom: 20px;
  }
  .hero-card .avatar {
    font-size: 64px; line-height: 1;
    margin-bottom: 12px;
    display: flex; justify-content: center; align-items: center;
  }
  .hero-card .avatar img {
    width: 80px; height: 80px;
    border-radius: 50%;
    object-fit: cover;
    border: 3px solid #a0d8b3;
  }
  .hero-card .nickname { font-size: 20px; font-weight: bold; color: #fff; }
  .hero-card .email { font-size: 12px; color: #888; margin-top: 6px; }

  .upload-avatar-btn {
    margin-top: 14px; padding: 10px 20px;
    border-radius: 12px; border: 1px solid rgba(160, 216, 179, 0.3);
    background: rgba(160, 216, 179, 0.1);
    color: #a0d8b3; font-size: 13px;
    cursor: pointer; transition: 0.15s;
  }
  .upload-avatar-btn:active { transform: scale(0.95); }

  .section-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 16px;
  }
  .section-title {
    font-size: 15px; font-weight: bold; color: #a0d8b3;
    margin-bottom: 14px; display: flex; align-items: center; gap: 8px;
  }

  .field-label { font-size: 13px; color: #888; margin-bottom: 8px; }
  .text-input {
    width: 100%; padding: 12px 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 14px; font-family: inherit;
  }
  .text-input:focus { border-color: #a0d8b3; }

  .emoji-grid {
    display: grid;
    grid-template-columns: repeat(8, 1fr);
    gap: 8px;
    margin-bottom: 16px;
  }
  .emoji-option {
    aspect-ratio: 1;
    display: flex; align-items: center; justify-content: center;
    font-size: 22px;
    border-radius: 12px;
    background: rgba(255,255,255,0.05);
    border: 2px solid transparent;
    cursor: pointer;
    transition: 0.15s;
  }
  .emoji-option:active { transform: scale(0.9); }
  .emoji-option.selected {
    border-color: #a0d8b3;
    background: rgba(160, 216, 179, 0.15);
  }

  .upload-area {
    padding: 22px; border-radius: 14px;
    border: 2px dashed rgba(160, 216, 179, 0.3);
    background: rgba(160, 216, 179, 0.05);
    text-align: center; font-size: 14px; color: #a0d8b3;
    cursor: pointer; margin-bottom: 16px;
    transition: 0.15s;
  }
  .upload-area:active { transform: scale(0.98); background: rgba(160, 216, 179, 0.1); }

  .primary-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
  }
  .primary-btn:active { transform: scale(0.97); }

  .member-row { display: flex; gap: 12px; }
  .member-box {
    flex: 1;
    background: rgba(160, 216, 179, 0.08);
    border-radius: 12px;
    padding: 14px;
    text-align: center;
  }
  .member-box .label { font-size: 12px; color: #888; margin-bottom: 6px; }
  .member-box .value { font-size: 18px; font-weight: bold; color: #a0d8b3; }

  /* ===== VIP 小卡片（和 member-box 同风格，横向布局） ===== */
  .vip-mini-card {
    margin-top: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-radius: 12px;
    background: linear-gradient(135deg, rgba(232,168,184,0.18), rgba(201,128,148,0.12));
    border: 1px solid rgba(232,168,184,0.35);
    cursor: pointer;
    transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
  }
  .vip-mini-card:active {
    transform: scale(0.97);
    background: linear-gradient(135deg, rgba(232,168,184,0.28), rgba(201,128,148,0.18));
  }
  .vip-mini-card .vip-icon {
    font-size: 26px;
    line-height: 1;
    flex-shrink: 0;
  }
  .vip-mini-card .vip-text { flex: 1; text-align: left; }
  .vip-mini-card .vip-title {
    font-size: 14px;
    font-weight: 700;
    color: #e8a8b8;
    margin-bottom: 3px;
    letter-spacing: -0.2px;
  }
  .vip-mini-card .vip-sub {
    font-size: 12px;
    color: rgba(255,255,255,0.55);
    line-height: 1.4;
  }
  .vip-mini-card .vip-arrow {
    font-size: 16px;
    color: rgba(232,168,184,0.7);
    flex-shrink: 0;
  }

  .tip-box { font-size: 12px; color: #888; line-height: 1.6; margin-top: 10px; }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">👤 个人中心</div>
  <div id="loginState" style="margin-left:auto; font-size:13px; color:#a0d8b3; cursor:pointer;"></div>
</div>

<div id="content">

  <div class="hero-card">
    <div class="avatar" id="heroAvatar">🐱</div>
    <div class="nickname" id="heroNickname">还没有设置昵称</div>
    <div class="email">molly@example.com</div>
    <button class="upload-avatar-btn" onclick="document.getElementById('avatarFileInput').click()">📷 上传图片头像</button>
    <input type="file" id="avatarFileInput" accept="image/*" style="display:none" onchange="onAvatarUpload(event)">
  </div>

  <div class="section-card">
    <div class="section-title">👤 个人资料设置</div>
    <div class="field-label">昵称</div>
    <input class="text-input" type="text" id="nicknameInput" placeholder="输入你的昵称...">

    <div class="field-label">方式一：选一个 emoji 头像</div>
    <div class="emoji-grid" id="emojiGrid"></div>

    <div class="field-label">方式二：上传图片当头像</div>
    <div class="upload-area" onclick="document.getElementById('avatarFileInput2').click()">
      <span id="uploadText">📷 点击上传图片（最大 10MB）</span>
      <input type="file" id="avatarFileInput2" accept="image/*" style="display:none" onchange="onAvatarUpload(event)">
    </div>

    <button class="primary-btn" onclick="saveProfile()">💾 保存资料</button>
  </div>

<div class="section-card">
  <div class="section-title">💎 会员状态</div>
  <div class="member-row">
    <div class="member-box">
      <div class="label">当前等级</div>
      <div class="value" id="vipLevelText">加载中...</div>
    </div>
    <div class="member-box">
      <div class="label">AI 分析次数</div>
      <div class="value" id="vipUsageText">—</div>
    </div>
  </div>
    <div id="vipUpsellCard" onclick="location.href='/vip'"
    style="
      margin-top: 12px;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      background: rgba(232,168,184,0.12);
      border: 1px solid rgba(232,168,184,0.35);
      cursor: pointer;
      box-sizing: border-box;
      width: 100%;
      transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1), background 0.2s;
    "
    onmousedown="this.style.transform='scale(0.97)'"
    onmouseup="this.style.transform=''"
    onmouseleave="this.style.transform=''"
    ontouchstart="this.style.transform='scale(0.97)'"
    ontouchend="this.style.transform=''"
  >
    <div style="font-size: 26px; line-height: 1; flex-shrink: 0;">👑</div>
    <div style="flex: 1; text-align: left; min-width: 0;">
      <div style="font-size: 14px; font-weight: 700; color: #e8a8b8; margin-bottom: 3px; letter-spacing: -0.2px;">VIP 会员</div>
      <div style="font-size: 12px; color: rgba(255,255,255,0.55); line-height: 1.4;">解锁全部高级功能，首月 €1</div>
    </div>
    <div style="font-size: 16px; color: rgba(232,168,184,0.7); flex-shrink: 0;">→</div>
  </div>
  <div class="tip-box" id="vipTipBox">升级到会员，解锁所有功能和ai分析</div>
</div>

</div>

<script>
  // ===== 检查登录状态 =====
  (function checkLogin() {
    const token = localStorage.getItem('access_token');
    const email = localStorage.getItem('user_email');
    const stateEl = document.getElementById('loginState');

    if (!token || !email) {
      stateEl.textContent = '请先登录 →';
      stateEl.onclick = () => location.href = '/login';
      setTimeout(() => {
        if (confirm('请先登录再访问个人中心')) {
          location.href = '/login';
        } else {
          location.href = '/';
        }
      }, 300);
      return;
    }

    stateEl.textContent = '🚪 退出登录';
    stateEl.onclick = () => {
      if (!confirm('确定要退出登录吗？')) return;
      localStorage.removeItem('access_token');
      localStorage.removeItem('user_email');
      location.href = '/';
    };

    const emailEl = document.querySelector('.hero-card .email');
    if (emailEl) emailEl.textContent = email;
  })();

  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/';
    }
  }

  // ===== 状态 =====
  const emojiOptions = [
    "🐱", "🐶", "🦊", "🐼", "🐸", "🦁", "🐯", "🐨",
    "🌸", "🌈", "⭐", "🌙", "☀️", "🍀", "🎵", "🍕"
  ];
  let selectedEmoji = "🐱";
  let uploadedImageUrl = null;

  // ===== emoji 网格 =====
  function renderEmojiGrid() {
    const grid = document.getElementById('emojiGrid');
    grid.innerHTML = '';
    emojiOptions.forEach(e => {
      const div = document.createElement('div');
      div.className = 'emoji-option' + (e === selectedEmoji && !uploadedImageUrl ? ' selected' : '');
      div.textContent = e;
      div.onclick = () => {
        selectedEmoji = e;
        uploadedImageUrl = null;
        if (navigator.vibrate) navigator.vibrate(8);
        renderEmojiGrid();
        document.getElementById('heroAvatar').textContent = e;
        const uploadText = document.getElementById('uploadText');
        if (uploadText) uploadText.textContent = '📷 点击上传图片（最大 10MB）';
      };
      grid.appendChild(div);
    });
  }
  renderEmojiGrid();

  // ===== 上传图片（走 Supabase Storage） =====
  async function onAvatarUpload(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (!file.type.startsWith('image/')) {
      alert('请选择图片文件');
      return;
    }
    if (file.size > 10 * 1024 * 1024) {
      alert('图片太大了，请选择 10MB 以内的图片');
      return;
    }
    const uploadText = document.getElementById('uploadText');
    if (uploadText) uploadText.textContent = '⏳ 上传中...';

    const fd = new FormData();
    fd.append('file', file);
    fd.append('bucket', 'avatars');
    try {
      const resp = await fetch('/api/upload', { method: 'POST', body: fd });
      const data = await resp.json();
      if (data.error) {
        alert('上传失败：' + data.error);
        if (uploadText) uploadText.textContent = '📷 点击上传图片（最大 10MB）';
        return;
      }
      uploadedImageUrl = data.url;
      document.getElementById('heroAvatar').innerHTML = `<img src="${data.url}" alt="avatar">`;
      if (uploadText) uploadText.textContent = '✅ 已上传（点击可替换）';
      renderEmojiGrid();
      if (navigator.vibrate) navigator.vibrate(15);
    } catch (e) {
      alert('网络错误');
      if (uploadText) uploadText.textContent = '📷 点击上传图片（最大 10MB）';
    }
  }

  // ===== 加载已有资料 =====
  async function loadProfile() {
    const email = localStorage.getItem('user_email');
    if (!email) return;
    try {
      const resp = await fetch('/api/profile?email=' + encodeURIComponent(email));
      const data = await resp.json();
      if (data && data.nickname) {
        document.getElementById('nicknameInput').value = data.nickname;
        document.getElementById('heroNickname').textContent = data.nickname;
      }
      if (data && data.avatar_url) {
        uploadedImageUrl = data.avatar_url;
        document.getElementById('heroAvatar').innerHTML = `<img src="${data.avatar_url}" alt="avatar">`;
        const uploadText = document.getElementById('uploadText');
        if (uploadText) uploadText.textContent = '✅ 已有图片（点击可替换）';
        renderEmojiGrid();
      } else if (data && data.avatar_emoji) {
        selectedEmoji = data.avatar_emoji;
        renderEmojiGrid();
        document.getElementById('heroAvatar').textContent = data.avatar_emoji;
      }
    } catch (e) {}
  }


  async function loadVipStatus() {
  const email = localStorage.getItem('user_email') || '';
  if (!email) return;

  try {
    // 1. 查 VIP 状态
    const resp = await fetch('/api/vip/status?email=' + encodeURIComponent(email) + '&t=' + Date.now());
    const data = await resp.json();

    const levelEl = document.getElementById('vipLevelText');
    const upsellCard = document.getElementById('vipUpsellCard');
    const tipBox = document.getElementById('vipTipBox');
    const usageEl = document.getElementById('vipUsageText');

    if (data.is_vip) {
      // 是 VIP
      levelEl.textContent = '👑 VIP';
      levelEl.style.color = '#f4b8d0';
      usageEl.textContent = '无限';
      usageEl.style.color = '#f4b8d0';
      // 隐藏升级引导
      if (upsellCard) upsellCard.style.display = 'none';
      if (tipBox) {
        tipBox.textContent = '✅ 👑 永久 VIP，感谢你的支持';
        tipBox.style.color = '#a0d8b3';
      }
    } else {
      // 不是 VIP
      levelEl.textContent = '免费用户';
      levelEl.style.color = '';
      if (upsellCard) upsellCard.style.display = '';
      if (tipBox) {
        tipBox.textContent = '升级到会员，解锁无限次 AI 分析和历史记录保存功能。';
        tipBox.style.color = '';
      }
      // 查 AI 检测剩余次数
      try {
        const uResp = await fetch('/api/vip/check_usage?email=' + encodeURIComponent(email) + '&feature=ai_detect');
        const uData = await uResp.json();
        if (uData.is_vip) {
          usageEl.textContent = '无限';
        } else if (uData.remaining !== undefined) {
          usageEl.textContent = uData.remaining + ' / ' + uData.limit;
        } else {
          usageEl.textContent = '0 / 3';
        }
      } catch (e) {
        usageEl.textContent = '0 / 3';
      }
    }
  } catch (e) {
    console.error('查询 VIP 状态失败', e);
  }
}


  // ===== 保存资料 =====
  async function saveProfile() {
    const nickname = document.getElementById('nicknameInput').value.trim();
    const email = localStorage.getItem('user_email');
    if (!email) { alert('请先登录'); return; }
    if (!nickname) { alert('请先输入昵称'); return; }
    if (navigator.vibrate) navigator.vibrate(15);

    document.getElementById('heroNickname').textContent = nickname;

    let avatar_url = '';
    let avatar_emoji = '';
    if (uploadedImageUrl) {
      avatar_url = uploadedImageUrl;
      document.getElementById('heroAvatar').innerHTML = `<img src="${uploadedImageUrl}" alt="avatar">`;
    } else {
      avatar_emoji = selectedEmoji;
      document.getElementById('heroAvatar').textContent = selectedEmoji;
    }

    try {
      const resp = await fetch('/api/profile/save', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email, nickname, avatar_url, avatar_emoji })
      });
      const data = await resp.json();
      if (data.error) { alert('保存失败：' + data.error); return; }
      alert('✅ 资料已保存');
    } catch (e) { alert('网络错误'); }
  }

  loadProfile();
  loadVipStatus();
</script>
<script src="/static/js/user-info.js"></script>
</body>
</html>
