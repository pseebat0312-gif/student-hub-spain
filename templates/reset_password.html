<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>重置密码 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    color: #fff; font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px;
  }
  .card {
    width: 100%; max-width: 380px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px; padding: 32px 24px; text-align: center;
  }
  .card h1 {
    font-size: 22px; margin-bottom: 8px;
    background: linear-gradient(90deg, #fbc2eb, #a6c1ee);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .card .sub { font-size: 13px; color: #888; margin-bottom: 24px; line-height: 1.6; }
  .card input {
    width: 100%; padding: 14px 16px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none; margin-bottom: 12px;
    font-family: inherit;
  }
  .card input:focus { border-color: #a0d8b3; }
  .btn-primary {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 15px; font-weight: bold; cursor: pointer;
  }
  .btn-primary:active { transform: scale(0.97); }
  .btn-primary:disabled { opacity: 0.6; }
  .back-link { font-size: 13px; color: #a0d8b3; margin-top: 16px; cursor: pointer; text-decoration: underline; }
  .error-msg { font-size: 13px; min-height: 18px; margin-top: 8px; }
</style>
</head>
<body>

<div class="card">
  <h1 id="cardTitle">忘记密码？</h1>
  <div class="sub" id="cardSub">输入你的邮箱，我们会发一封重置密码的邮件给你</div>

  <!-- 第一步：输入邮箱 -->
  <div id="step1">
    <input type="email" id="email" placeholder="你的邮箱" autocomplete="email">
    <div class="error-msg" id="errorMsg"></div>
    <button class="btn-primary" id="sendBtn" onclick="sendReset()">发送重置邮件</button>
    <div class="back-link" onclick="location.href='/login'">← 返回登录</div>
  </div>

  <!-- 第二步：输入新密码 -->
  <div id="step2" style="display:none;">
    <input type="password" id="newPwd" placeholder="输入新密码（至少 6 位）">
    <input type="password" id="newPwd2" placeholder="再输一次新密码">
    <div class="error-msg" id="errorMsg2"></div>
    <button class="btn-primary" id="updateBtn" onclick="updatePassword()">确认修改密码</button>
  </div>
</div>

<script>
  // ===== 检查 URL 里有没有 access_token（Supabase 邮件跳回来会带） =====
  (function checkToken() {
    const hash = window.location.hash;
    if (hash && hash.includes('access_token=')) {
      const params = new URLSearchParams(hash.slice(1));
      const token = params.get('access_token');
      if (token) {
        localStorage.setItem('reset_token', token);
        document.getElementById('cardTitle').textContent = '设置新密码';
        document.getElementById('cardSub').textContent = '请输入你的新密码';
        document.getElementById('step1').style.display = 'none';
        document.getElementById('step2').style.display = 'block';
      }
    }
  })();

  // ===== 发送重置邮件 =====
  async function sendReset() {
    const email = document.getElementById('email').value.trim();
    const errorMsg = document.getElementById('errorMsg');
    const sendBtn = document.getElementById('sendBtn');

    if (!email) { errorMsg.textContent = '请输入邮箱'; return; }

    if (navigator.vibrate) navigator.vibrate(10);
    sendBtn.disabled = true;
    sendBtn.textContent = '发送中...';

    try {
      const resp = await fetch('/api/reset_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email })
      });
      const data = await resp.json();
      if (data.success) {
        errorMsg.style.color = '#a0d8b3';
        errorMsg.textContent = '✅ 重置邮件已发送，请查收邮箱（含垃圾箱）。';
        sendBtn.textContent = '已发送';
      } else {
        errorMsg.style.color = '#ff6b6b';
        errorMsg.textContent = data.error || '发送失败';
        sendBtn.disabled = false;
        sendBtn.textContent = '发送重置邮件';
      }
    } catch (e) {
      errorMsg.style.color = '#ff6b6b';
      errorMsg.textContent = '网络错误，请稍后重试';
      sendBtn.disabled = false;
      sendBtn.textContent = '发送重置邮件';
    }
  }

  // ===== 更新密码 =====
  async function updatePassword() {
    const pwd = document.getElementById('newPwd').value;
    const pwd2 = document.getElementById('newPwd2').value;
    const errorMsg = document.getElementById('errorMsg2');
    const token = localStorage.getItem('reset_token');

    if (!pwd || pwd.length < 6) { errorMsg.textContent = '密码至少 6 位'; return; }
    if (pwd !== pwd2) { errorMsg.textContent = '两次密码不一致'; return; }

    if (navigator.vibrate) navigator.vibrate(15);
    errorMsg.style.color = '#a0d8b3';
    errorMsg.textContent = '修改中...';

    try {
      const resp = await fetch('/api/update_password', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ token, password: pwd })
      });
      const data = await resp.json();
      if (data.success) {
        errorMsg.textContent = '✅ 密码已修改，请回到app或网页重新登录。';
        localStorage.removeItem('reset_token');
      
      } else {
        errorMsg.style.color = '#ff6b6b';
        errorMsg.textContent = data.error || '修改失败';
      }
    } catch (e) {
      errorMsg.style.color = '#ff6b6b';
      errorMsg.textContent = '网络错误';
    }
  }
</script>
</body>
</html>
