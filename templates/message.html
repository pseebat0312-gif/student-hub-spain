<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>留言板 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29; color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh; padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px; display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08); border: none; color: #fff;
    font-size: 18px; width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  .intro-text {
    font-size: 13px; color: #aaa; line-height: 1.7;
    margin-bottom: 20px;
  }

  .section-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .section-title {
    font-size: 15px; font-weight: bold; color: #a0d8b3;
    margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
  }

  .msg-input {
    width: 100%; min-height: 120px;
    padding: 14px; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    font-family: inherit; resize: vertical;
    margin-bottom: 12px;
  }
  .msg-input:focus { border-color: #a0d8b3; }

  .primary-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 15px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
  }
  .primary-btn:active { transform: scale(0.97); }

  .msg-card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.06);
    border-radius: 12px;
    padding: 14px 16px;
    margin-bottom: 10px;
  }
  .msg-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #888; margin-bottom: 8px;
  }
  .msg-status {
    font-size: 11px; padding: 2px 8px; border-radius: 8px;
    background: rgba(160, 216, 179, 0.12); color: #a0d8b3;
  }
  .msg-status.private {
    background: rgba(255, 255, 255, 0.08); color: #aaa;
  }
  .msg-content {
    font-size: 14px; color: #ddd; line-height: 1.6;
  }
  .msg-reply {
    margin-top: 10px;
    padding: 10px 12px;
    background: rgba(160, 216, 179, 0.08);
    border-left: 3px solid #a0d8b3;
    border-radius: 8px;
    font-size: 13px; color: #ccc; line-height: 1.6;
  }
  .msg-reply .reply-label { color: #a0d8b3; font-weight: bold; margin-right: 6px; }

  .empty-state {
    text-align: center; padding: 30px 20px;
    color: #666; font-size: 13px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">✍️ 留言板</div>
</div>

<div id="content">

  <div class="intro-text">
    欢迎给作者留言！你的留言默认是私密的，只有作者能看见。<br>
    作者如果觉得内容不错，可能会把它公开~
  </div>

  <div class="section-card">
    <div class="section-title">📝 写一条新留言</div>
    <textarea class="msg-input" id="msgContent" placeholder="你想对作者说什么？"></textarea>
    <button class="primary-btn" onclick="submitMsg()">发送留言</button>
  </div>

  <div class="section-card">
    <div class="section-title">📜 我的留言记录</div>
    <div id="myMsgList"></div>
  </div>

  <div class="section-card">
    <div class="section-title">🌟 精选公开留言</div>
    <div id="publicMsgList"></div>
  </div>

</div>

<script>
  let allMessages = [];

  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) window.history.back();
    else location.href = '/?tab=tools';
  }

  // ===== 加载留言（公开 + 我自己的） =====
  async function loadMessages() {
    const myEmail = localStorage.getItem('user_email') || 'anonymous';

    let pubData = [];
    let myData = [];

    try {
      const resp = await fetch('/api/messages');
      pubData = await resp.json();
      if (!Array.isArray(pubData)) pubData = [];
    } catch(e) { pubData = []; }

    try {
      const resp = await fetch('/api/messages/mine?email=' + encodeURIComponent(myEmail));
      myData = await resp.json();
      if (!Array.isArray(myData)) myData = [];
    } catch(e) { myData = []; }

    const allData = pubData.concat(myData);
    const seen = {};
    allMessages = [];
    allData.forEach(m => {
      if (!seen[m.id]) { seen[m.id] = true; allMessages.push(m); }
    });

    renderMyMessages();
    renderPublicMessages();
  }

  // ===== 渲染我的留言 =====
  function renderMyMessages() {
    const list = document.getElementById('myMsgList');
    const myEmail = localStorage.getItem('user_email') || 'anonymous';
    const myMsgs = allMessages.filter(m => m.user_email === myEmail);

    if (myMsgs.length === 0) {
      list.innerHTML = '<div class="empty-state">你还没有发过留言。</div>';
      return;
    }

    list.innerHTML = '';
    myMsgs.forEach(m => {
      const statusClass = m.is_public ? 'msg-status' : 'msg-status private';
      const statusText = m.is_public ? '🌍 已公开' : '🔒 私密';
      const card = document.createElement('div');
      card.className = 'msg-card';
      card.innerHTML = `
        <div class="msg-head">
          <span>${(m.created_at || '').slice(0, 19).replace('T', ' ')}</span>
          <span class="${statusClass}">${statusText}</span>
        </div>
        <div class="msg-content">${m.content}</div>
        ${m.reply ? `<div class="msg-reply"><span class="reply-label">💬 作者回复：</span>${m.reply}</div>` : ''}
      `;
      list.appendChild(card);
    });
  }

  // ===== 渲染公开留言 =====
  function renderPublicMessages() {
    const list = document.getElementById('publicMsgList');
    const pubMsgs = allMessages.filter(m => m.is_public);

    if (pubMsgs.length === 0) {
      list.innerHTML = '<div class="empty-state">还没有公开的留言，期待你的第一条！</div>';
      return;
    }

    list.innerHTML = '';
    pubMsgs.forEach(m => {
      const card = document.createElement('div');
      card.className = 'msg-card';
      card.innerHTML = `
        <div class="msg-head">
          <span>${(m.created_at || '').slice(0, 19).replace('T', ' ')}</span>
        </div>
        <div class="msg-content">${m.content}</div>
        ${m.reply ? `<div class="msg-reply"><span class="reply-label">💬 作者回复：</span>${m.reply}</div>` : ''}
      `;
      list.appendChild(card);
    });
  }

  // ===== 提交留言 =====
  async function submitMsg() {
    const content = document.getElementById('msgContent').value.trim();
    const myEmail = localStorage.getItem('user_email') || 'anonymous';
    if (!content) { alert('留言不能为空'); return; }

    if (navigator.vibrate) navigator.vibrate(15);

    try {
      const resp = await fetch('/api/messages/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: myEmail, content: content })
      });
      const data = await resp.json();
      if (data.success) {
        document.getElementById('msgContent').value = '';
        await loadMessages();
        alert('✅ 留言已发送');
      } else {
        alert('发送失败：' + data.error);
      }
    } catch(e) {
      alert('网络错误');
    }
  }

  // ===== 初始化 =====
  loadMessages();
</script>
<script src="/static/js/auth-gate.js"></script>
<script src="/static/js/user-info.js"></script>
</body>
</html>
