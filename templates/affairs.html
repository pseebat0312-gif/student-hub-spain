<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>办事导览 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); background: rgba(255,255,255,0.15); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; flex: 1; }

  #content { padding: 10px 20px 40px; }

  /* 办事卡片列表 */
  .affair-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 18px;
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.15s;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .affair-card:active {
    transform: scale(0.98);
    background: rgba(160,216,179,0.08);
    border-color: rgba(160,216,179,0.25);
  }
  .affair-card .icon {
    width: 48px; height: 48px;
    border-radius: 14px;
    background: rgba(160,216,179,0.12);
    border: 1px solid rgba(160,216,179,0.25);
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    flex-shrink: 0;
  }
  .affair-card .info { flex: 1; min-width: 0; }
  .affair-card .info .name {
    font-size: 15px; font-weight: 700;
    color: #fff; line-height: 1.3;
    letter-spacing: -0.2px;
  }
  .affair-card .info .desc {
    font-size: 12px; color: #888;
    margin-top: 4px; line-height: 1.4;
  }
  .affair-card .arrow {
    font-size: 16px; color: rgba(160,216,179,0.7);
    flex-shrink: 0;
  }

  /* 详情页（覆盖） */
  .detail-overlay {
    position: fixed; inset: 0;
    background: #0f0c29;
    z-index: 9999;
    display: none;
    flex-direction: column;
    animation: slideIn 0.3s ease;
    overflow-y: auto;
  }
  .detail-overlay.show { display: flex; }
  @keyframes slideIn { from { transform: translateX(100%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }

  .detail-topbar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: #0f0c29;
    position: sticky; top: 0; z-index: 10;
    border-bottom: 1px solid rgba(255,255,255,0.06);
  }
  .detail-topbar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer;
  }
  .detail-topbar .back-btn:active { transform: scale(0.9); }
  .detail-topbar .detail-title {
    font-size: 16px; font-weight: bold; color: #a0d8b3;
    flex: 1;
  }
  .detail-body { padding: 10px 20px 60px; }

  .section-title {
    font-size: 16px; color: #a0d8b3; font-weight: bold;
    margin: 24px 0 12px; display: flex; align-items: center; gap: 8px;
  }

  /* 折叠卡片 */
  .expand-card {
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px 20px;
    margin-bottom: 12px;
    cursor: pointer;
    transition: 0.15s;
  }
  .expand-card:active { transform: scale(0.98); background: rgba(160, 216, 179, 0.08); }
  .expand-card .expand-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 15px; font-weight: bold; color: #fff;
  }
  .expand-card .expand-head .arrow { font-size: 12px; color: #a0d8b3; transition: 0.3s; }
  .expand-card.open .expand-head .arrow { transform: rotate(180deg); }
  .expand-card .expand-body {
    font-size: 13px; color: #bbb; line-height: 1.8;
    margin-top: 0; max-height: 0; overflow: hidden;
    transition: all 0.3s ease;
  }
  .expand-card.open .expand-body {
    max-height: 2000px; margin-top: 12px;
  }

  /* 链接按钮 */
  .link-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .link-btn {
    display: flex; justify-content: center; align-items: center;
    padding: 16px 12px;
    border-radius: 14px;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; text-decoration: none;
    font-size: 14px; font-weight: bold; text-align: center;
    transition: 0.15s;
    box-shadow: 0 4px 15px rgba(74,124,89,0.25);
  }
  .link-btn:active { transform: scale(0.96); }

  .tip-box {
    background: rgba(160, 216, 179, 0.08);
    border-left: 4px solid #a0d8b3;
    padding: 14px 16px;
    border-radius: 10px;
    font-size: 13px; color: #ccc;
    line-height: 1.6;
    margin-top: 20px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">📋 办事导览</div>
</div>

<div id="content">
  <div id="affairList"></div>
</div>

<!-- 详情覆盖层 -->
<div class="detail-overlay" id="detailOverlay">
  <div class="detail-topbar">
    <button class="back-btn" onclick="closeDetail()">←</button>
    <div class="detail-title" id="detailTitle">办事详情</div>
  </div>
  <div class="detail-body" id="detailBody"></div>
</div>

<script>
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/';
    }
  }

  // ============ 办事数据 ============
  const affairsData = {
    renew: {
      name: "续居留",
      icon: "🆔",
      desc: "NIE 到期前 60 天开始办理",
      sections: [
        {
          title: "📚 前期申请",
          cards: [
            {
              head: "⏰ 办理时间与流程",
              body: `- **最佳时间**：NIE 过期前的 **60 天** 内开始办理。<br>- **最晚时间**：过期后 **90 天** 内仍可提交，但可能面临行政处罚。<br>- **办理方式**：马德里地区可以通过 **Mercurio 平台** 在线提交（需电子证书），也可以线下前往 **Oficina de Extranjería**。`
            },
            {
              head: "📋 必备材料清单",
              body: `**1. 官方申请表**：EX-00 表格（两联），完整填写并签名。<br>**2. 护照**：有效期内的护照全本复印件。<br>**3. 资金证明**：西班牙本地银行流水，建议余额覆盖整个续签期（约 IPREM 100%，每月 600 欧）。<br>**4. 医疗保险**：覆盖整个学习期间的私立医疗保险证明。<br>**5. 学业证明**：上一学年的成绩单 + 下一学年的注册单。<br>**6. 缴费单**：Tasa 790-052，约 16.48 欧元。`
            }
          ],
          links: [
            { name: "UCM 续居留指导页", url: "https://www.ucm.es/tramitacion-renovacion-nie" },
            { name: "EX-00 表格下载", url: "https://extranjeros.inclusion.gob.es/" }
          ]
        },
        {
          title: "✅ 申请通过后",
          cards: [
            {
              head: "📌 后续流程与注意事项",
              body: `**1. 领取新 NIE 卡**：收到批准信后，需在指定时间内前往警察局按指纹(Toma de huellas)并领取新卡。<br>**2. 更新住家证明**：如果搬家了，需要重新办理住家证明。<br>**3. 银行与保险更新**：确保银行账户和医疗保险持续有效，不要断。<br>**4. 保存批准信**：批准信要留好，以后办返乡证或续签都会用到。`
            }
          ],
          links: [
            { name: "警察局预约系统", url: "https://sede.administracionespublicas.gob.es/" }
          ]
        }
      ],
      tip: "⚠️ 以下信息为整理汇总，具体要求请以西班牙移民局（Extranjería）官方发布为准。"
    },

    regreso: {
      name: "办理返乡证",
      icon: "✈️",
      desc: "回国前必备，有效期 90 天",
      sections: [
        {
          title: "✈️ 办理返乡证（Autorización de Regreso）",
          cards: [
            {
              head: "📌 办理前提与适用情况",
              body: `* **TIE 续签期间**：已提交续签申请，但还没拿到新卡。<br>* **等待制卡期间**：已按指纹，卡还在制作中。<br>* **证件丢失或被盗**：TIE 卡丢失或被盗，并已报警。<br>* **首次办理居留**：初次居留申请获批，但还没拿到卡。`
            },
            {
              head: "📋 必备材料清单",
              body: `**1. 官方申请表**：EX-13 表格，完整填写并签名。<br>**2. 护照**：有效期内的护照原件及全本复印件。<br>**3. 居留相关材料**：续签回执单或正在办理中的证明。<br>**4. 缴费单**：Tasa 790-012，费用约 16.32 欧元。<br>**5. 行程证明**：机票或火车票等旅行凭证。<br>**6. 紧急情况证明**（如适用）：如工作、家庭、健康等证明。`
            },
            {
              head: "⏰ 办理步骤与注意事项",
              body: `**1. 预约**：在 ICPP 系统选择 POLICIA - AUTORIZACIÓN DE REGRESO 预约。<br>**2. 准备材料**：带齐上述所有材料，**原件和复印件都要带**。<br>**3. 现场办理**：按预约时间前往警察局，提交材料并缴费。<br>**4. 领取**：**办理周期约 7 天**，批准后需本人亲自前往领取。<br>**5. 注意有效期**：返乡证有效期 90 天，只能用于一次入境。`
            }
          ],
          links: [
            { name: "预约返乡证（ICPP）", url: "https://sede.administracionespublicas.gob.es/icpplus/" },
            { name: "EX-13 表格下载", url: "https://extranjeros.inclusion.gob.es/" }
          ],
          tip: "⚠️ 提示：返乡证批准后需本人领取，请提前规划好时间，不要赶在出发前才去办理。"
        }
      ]
    },

    empadron: {
      name: "办理住家证明",
      icon: "🏠",
      desc: "租房后必办，有效期 3 个月",
      sections: [
        {
          title: "🏠 办理住家证明（Certificado de Empadronamiento）",
          cards: [
            {
              head: "📌 办理前提与适用情况",
              body: `* **刚到西班牙**：第一次租房后，需要去市政府登记。<br>* **搬家之后**：换了地址，需要更新住家证明。<br>* **办理其他手续**：续居留、办医疗卡、办银行卡时，可能需要提供。`
            },
            {
              head: "📋 必备材料清单",
              body: `**1. 护照或 NIE**：原件及复印件。<br>**2. 租房合同**：你和房东签的正式合同。<br>**3. 房东的身份证复印件**：房东的 DNI 或 NIE。<br>**4. 最近的水电费单**：证明你确实住在这里。<br>**5. 申请表**：部分城市需要提前在网上填表。`
            },
            {
              head: "⏰ 办理步骤与注意事项",
              body: `**1. 预约**：去你所在城市的市政府官网（Ayuntamiento）预约 cita。<br>**2. 带齐材料**：带齐上述所有材料，**原件和复印件都要带**。<br>**3. 现场办理**：按预约时间前往，提交材料。<br>**4. 领取**：通常当场就能拿到，或者几天后去取。<br>**5. 注意有效期**：住家证明通常有效期 **3 个月**，过期需要重新办理。`
            }
          ],
          links: [
            { name: "马德里市政府预约", url: "https://www.madrid.es/" },
            { name: "巴塞罗那市政府预约", url: "https://www.barcelona.cat/" }
          ],
          tip: `⚠️ 提示：不同城市的办理流程略有不同，建议直接搜索 Empadronamiento + 你的城市名 获取最新信息。`
        }
      ]
    },

    rent: {
      name: "租房",
      icon: "🏘️",
      desc: "正在整理中，敬请期待",
      sections: [],
      tip: "🏘️ 租房入口正在整理中，敬请期待！"
    },

    job: {
      name: "找工作",
      icon: "💼",
      desc: "正在整理中，敬请期待",
      sections: [],
      tip: "💼 找工作入口正在整理中，敬请期待！"
    }
  };

  // ============ 渲染列表 ============
  function renderList() {
    const list = document.getElementById('affairList');
    let html = '';
    Object.keys(affairsData).forEach(key => {
      const item = affairsData[key];
      html += `
        <div class="affair-card" onclick="openDetail('${key}')">
          <div class="icon">${item.icon}</div>
          <div class="info">
            <div class="name">${item.name}</div>
            <div class="desc">${item.desc}</div>
          </div>
          <div class="arrow">→</div>
        </div>
      `;
    });
    list.innerHTML = html;
  }

  // ============ 打开详情 ============
  function openDetail(key) {
    if (navigator.vibrate) navigator.vibrate(10);
    const data = affairsData[key];
    if (!data) return;

    document.getElementById('detailTitle').textContent = data.name + ' · 详细流程';
    const body = document.getElementById('detailBody');

    let html = '';
    if (data.sections.length === 0) {
      html = `<div class="tip-box">${data.tip}</div>`;
    } else {
      data.sections.forEach(sec => {
        html += `<div class="section-title">${sec.title}</div>`;
        sec.cards.forEach(card => {
          html += `
            <div class="expand-card" onclick="toggleExpand(this)">
              <div class="expand-head">
                <span>${card.head}</span>
                <span class="arrow">▼</span>
              </div>
              <div class="expand-body">${card.body}</div>
            </div>
          `;
        });
        if (sec.links && sec.links.length) {
          html += `<div class="section-title">🔗 官方链接</div>`;
          html += `<div class="link-grid">`;
          sec.links.forEach(link => {
            html += `<a class="link-btn" href="${link.url}" target="_blank">${link.name}</a>`;
          });
          html += `</div>`;
        }
      });
      if (data.tip) html += `<div class="tip-box">${data.tip}</div>`;
    }

    body.innerHTML = html;
    document.getElementById('detailOverlay').classList.add('show');
    document.getElementById('detailOverlay').scrollTop = 0;
  }

  function closeDetail() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('detailOverlay').classList.remove('show');
  }

  function toggleExpand(el) {
    if (navigator.vibrate) navigator.vibrate(5);
    el.classList.toggle('open');
  }

  // ============ 初始化 ============
  renderList();
</script>
</body>
</html>
