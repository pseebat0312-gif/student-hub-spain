<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>西班牙留学生工具站</title>
<style>
/* 以下为 style.css 里没有、home 页专用的样式，保留 */
body {
  padding-bottom: 160px;
}

#topBar {
  position: fixed; top: 0; left: 0; right: 0;
  padding: 20px 22px;
  display: flex; justify-content: space-between; align-items: center;
  background: linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0));
  z-index: 10;
  backdrop-filter: blur(24px) saturate(180%);
  -webkit-backdrop-filter: blur(24px) saturate(180%);
}
#topBar .title {
  font-size: 17px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.4px;
}
#topBar .user {
  font-size: 13px;
  font-weight: 600;
  color: var(--accent);
  cursor: pointer;
  padding: 8px 16px;
  border-radius: var(--radius-pill);
  background: var(--accent-soft);
  border: 1px solid var(--accent-border);
  transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
  letter-spacing: -0.2px;
}
#topBar .user:active { transform: scale(0.92); }

#mainContent { padding: 88px 22px 40px; min-height: 100vh; }

.big-btn {
  position: relative;
  width: 100%;
  padding: 18px 24px;
  border-radius: var(--radius-pill);
  border: none;
  background: linear-gradient(135deg, #e8a8b8 0%, #c98094 100%);
  color: #1a0f14;
  font-family: inherit;
  font-size: 16px;
  font-weight: 700;
  letter-spacing: -0.2px;
  cursor: pointer;
  box-shadow:
    0 8px 28px rgba(232, 168, 184, 0.35),
    inset 0 1px 0 rgba(255, 255, 255, 0.4);
  transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
  overflow: hidden;
}
.big-btn::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
  pointer-events: none;
}
.big-btn:active { transform: scale(0.96); }

#navBar {
  position: fixed;
  bottom: 30px;
  left: 20px;
  right: 20px;
  display: flex;
  justify-content: space-around;
  align-items: center;
  background: rgba(28, 28, 32, 0.7);
  border: 1px solid var(--glass-border-strong);
  border-radius: var(--radius-pill);
  padding: 8px 10px;
  z-index: 100;
  backdrop-filter: blur(40px) saturate(200%);
  -webkit-backdrop-filter: blur(40px) saturate(200%);
  box-shadow:
    0 12px 48px rgba(0, 0, 0, 0.6),
    0 0 0 1px rgba(255, 255, 255, 0.05) inset,
    inset 0 1px 0 rgba(255, 255, 255, 0.12);
  max-width: 480px;
  margin: 0 auto;
  min-height: 76px;
}
</style>
</head>
<body>

<div id="topBar">
<div class="title">西班牙留学生工具站</div>
<div class="user" id="userDisplay">登录 →</div>
</div>

<div id="mainContent">

<div class="tab-page active" id="tab-home">
<div class="card" onclick="switchTab('tools')">
<h3>👋 欢迎回来</h3>
<p>这里是你的西班牙留学生一站式工具箱。点击底部标签，或者点这里进入工具箱。</p>
</div>

<div style="display: flex; gap: 12px; margin-bottom: 20px;">
<div class="clock-card" style="flex: 1;">
<div class="label">🇪🇸 西班牙</div>
<div class="time" id="spainClock">--:--:--</div>
</div>
<div class="clock-card" style="flex: 1;">
<div class="label">🇨🇳 中国</div>
<div class="time" id="chinaClock">--:--:--</div>
</div>
</div>

<button class="big-btn" onclick="switchTab('tools')">进入工具箱</button>
</div>

<div class="tab-page" id="tab-tools">
<div class="app-grid" id="appGrid"></div>
</div>

<div class="tab-page" id="tab-messages">
<h3 style="font-size: 18px; font-weight: 700; margin-bottom: 16px; letter-spacing: -0.3px;">💬 消息</h3>
<div id="notifList"></div>
</div>

<div class="tab-page" id="tab-user">
<div class="card" id="userStatusCard">
<h3 id="userCardTitle">🔑 点击登录</h3>
<p id="userCardDesc">登录后可使用个人中心、留言、社区等功能</p>
</div>

<div id="userOnlyCards" style="display:none;">
<div class="card" id="adminCard" onclick="location.href='/admin'" style="display:none;">
<h3>🛠️ 管理后台</h3>
<p>仅管理员可见。</p>
</div>
<div class="card" onclick="logout()" style="border-color: rgba(232,168,184,0.3); background: rgba(232,168,184,0.06);">
<h3 style="color:#e8a8b8;">🚪 退出登录</h3>
<p>点了就会退出当前账号</p>
</div>
</div>
</div>

</div>

<div id="navBar">
<div class="nav-item active" onclick="switchTab('home')" data-tab="home">
<span class="icon">🏠</span><span>主页</span>
</div>
<div class="nav-item" onclick="switchTab('tools')" data-tab="tools">
<span class="icon">🧰</span><span>工具</span>
</div>
<div class="nav-item" onclick="switchTab('messages')" data-tab="messages">
<span class="icon">💬</span><span>消息</span>
<span class="nav-badge" id="navBadge">0</span>
</div>
<div class="nav-item" onclick="switchTab('user')" data-tab="user">
<span class="icon">👤</span><span>我的</span>
</div>
</div>

<script>
const ADMIN_EMAIL = "pseebat0312@gmail.com";

const apps = [
{ name: '倒数日', icon: '⏳', url: '/countdown', color: 'color-gold' },
{ name: '独家菜单', icon: '🍽️', url: '/menu', color: 'color-pink' },
{ name: '学校导览', icon: '🏫', url: '/school', color: 'color-blue' },
{ name: '办事导览', icon: '📋', url: '/affairs', color: 'color-green' },
{ name: 'AI 检测', icon: '🔍', url: '/ai_detect', color: 'color-purple' },
{ name: '二手市场', icon: '🛒', url: '/market', color: 'color-orange' },
{ name: '互助社区', icon: '💬', url: '/community', color: 'color-green' },
{ name: '探店地图', icon: '🗺️', url: '/map', color: 'color-red' },
{ name: '留言板', icon: '✍️', url: '/message', color: 'color-blue' },
{ name: '汇率计算', icon: '💱', url: '/currency', color: 'color-purple' },
{ name: '想家急救包', icon: '🏠', url: '/homesick', color: 'color-pink' },
{ name: '急救卡', icon: '🆘', url: '/emergency', color: 'color-red' },
{ name: '匿名树洞', icon: '🌳', url: '/treehole', color: 'color-green' }
];

function renderApps() {
const grid = document.getElementById('appGrid');
grid.innerHTML = '';
apps.forEach(app => {
const div = document.createElement('div');
div.className = 'app-icon';
div.onclick = () => {
if (navigator.vibrate) navigator.vibrate(10);
if (['/fortune'].includes(app.url)) {
alert('【' + app.name + '】正在开发中，敬请期待！');
} else {
location.href = app.url;
}
};
div.innerHTML = `
<div class="icon-box ${app.color}">${app.icon}</div>
<div class="app-name">${app.name}</div>
`;
grid.appendChild(div);
});
}

function switchTab(tabName) {
document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
document.getElementById('tab-' + tabName).classList.add('active');
document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
document.querySelector(`.nav-item[data-tab="${tabName}"]`).classList.add('active');
if (navigator.vibrate) navigator.vibrate(8);
refreshLoginUI();
if (tabName === 'messages') {
loadNotifications();
}
}

function logout() {
if (navigator.vibrate) navigator.vibrate(15);
if (!confirm('确定要退出登录吗？')) return;
localStorage.removeItem('access_token');
localStorage.removeItem('user_email');
location.reload();
}

function refreshLoginUI() {
const token = localStorage.getItem('access_token');
const email = localStorage.getItem('user_email');
const userOnly = document.getElementById('userOnlyCards');
const adminCard = document.getElementById('adminCard');
const topDisplay = document.getElementById('userDisplay');
const statusCard = document.getElementById('userStatusCard');

if (token && email) {
document.getElementById('userCardTitle').textContent = '✅ ' + email;
document.getElementById('userCardDesc').textContent = '点击进入个人中心';
userOnly.style.display = 'block';
adminCard.style.display = (email === ADMIN_EMAIL) ? 'block' : 'none';
topDisplay.textContent = email.split('@')[0];
topDisplay.onclick = logout;
} else {
document.getElementById('userCardTitle').textContent = '🔑 点击登录';
document.getElementById('userCardDesc').textContent = '登录后可使用个人中心、留言、社区等功能';
userOnly.style.display = 'none';
adminCard.style.display = 'none';
topDisplay.textContent = '登录 →';
topDisplay.onclick = () => location.href = '/login';
}

statusCard.addEventListener('click', function() {
if (navigator.vibrate) navigator.vibrate(10);
if (localStorage.getItem('access_token')) location.href = '/profile';
else location.href = '/login';
});
}

// ==================== 消息中心 ====================
const notifTypeIcon = {
'treehole_reply': '🌳 树洞回复',
'message_reply': '✍️ 留言回复',
'message_public': '🌟 留言公开',
'menu_order': '🍽️ 菜单点单',
'community_reply': '💬 社区回复',
'market_interest': '🛒 二手询问'
};

function timeAgo(dateStr) {
if (!dateStr) return '';
const d = new Date(dateStr);
const diff = Date.now() - d.getTime();
const m = Math.floor(diff / 60000);
if (m < 1) return '刚刚';
if (m < 60) return m + ' 分钟前';
const h = Math.floor(m / 60);
if (h < 24) return h + ' 小时前';
const days = Math.floor(h / 24);
if (days < 30) return days + ' 天前';
return d.toLocaleDateString('zh-CN');
}

async function loadNotifCount() {
const token = localStorage.getItem('access_token');
const email = localStorage.getItem('user_email');
const badge = document.getElementById('navBadge');

if (!token || !email) {
badge.classList.remove('show');
return;
}
try {
const resp = await fetch('/api/notifications/unread?owner=' + encodeURIComponent(email));
const data = await resp.json();
const unread = data.unread || 0;
if (unread > 0) {
badge.textContent = unread > 99 ? '99+' : unread;
badge.classList.add('show');
} else {
badge.classList.remove('show');
}
} catch(e) {}
}

async function loadNotifications() {
const list = document.getElementById('notifList');
const email = localStorage.getItem('user_email');
const token = localStorage.getItem('access_token');

if (!token || !email) {
list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px 20px;font-size:14px;">登录后查看消息</div>';
return;
}

list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;font-size:13px;">加载中...</div>';

try {
const resp = await fetch('/api/notifications?owner=' + encodeURIComponent(email));
const data = await resp.json();
if (!Array.isArray(data) || data.length === 0) {
list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:40px 20px;font-size:14px;">还没有消息</div>';
return;
}

list.innerHTML = '';
const unreadIds = [];
data.forEach(n => {
if (!n.is_read) unreadIds.push(n.id);
const div = document.createElement('div');
div.className = 'notif-item' + (n.is_read ? '' : ' unread');
const typeLabel = notifTypeIcon[n.type] || '🔔 通知';
div.innerHTML = `
${n.is_read ? '' : '<span class="unread-dot"></span>'}
<div class="notif-type">${typeLabel}</div>
<div class="notif-content">${n.content || ''}</div>
<div class="notif-time">${timeAgo(n.created_at)}</div>
`;
div.addEventListener('click', () => {
if (n.link) location.href = n.link;
});
list.appendChild(div);
});

// 标记为已读
if (unreadIds.length > 0) {
fetch('/api/notifications/read', {
method: 'POST',
headers: { 'Content-Type': 'application/json' },
body: JSON.stringify({ ids: unreadIds })
});
document.getElementById('navBadge').classList.remove('show');
}
} catch(e) {
list.innerHTML = '<div style="text-align:center;color:var(--text-dim);padding:20px;font-size:13px;">加载失败</div>';
}
}

function updateClock() {
const now = new Date();
const spainTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Madrid"}));
const chinaTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Shanghai"}));
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
document.getElementById('spainClock').textContent = fmt(spainTime);
document.getElementById('chinaClock').textContent = fmt(chinaTime);
}
updateClock();
setInterval(updateClock, 1000);

renderApps();
refreshLoginUI();

// 每隔 30 秒检查一次未读数
setTimeout(loadNotifCount, 1000);
setInterval(loadNotifCount, 30000);

window.addEventListener('load', () => {
const params = new URLSearchParams(window.location.search);
if (params.get('tab') === 'tools') {
switchTab('tools');
window.history.replaceState({}, '', '/');
}
if (params.get('tab') === 'messages') {
switchTab('messages');
window.history.replaceState({}, '', '/');
}
});
</script>
</body>
</html>
