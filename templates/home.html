<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>西班牙留学生工具站</title>
<style>
:root {
--bg: #000000;
--glass-bg: rgba(255, 255, 255, 0.06);
--glass-bg-strong: rgba(255, 255, 255, 0.10);
--glass-border: rgba(255, 255, 255, 0.08);
--glass-border-strong: rgba(255, 255, 255, 0.14);
--glass-highlight: rgba(255, 255, 255, 0.10);
--text: #ffffff;
--text-dim: rgba(255, 255, 255, 0.55);
--accent: #e8a8b8;
--accent-soft: rgba(232, 168, 184, 0.14);
--accent-border: rgba(232, 168, 184, 0.28);
--radius-card: 22px;
--radius-pill: 999px;
--radius-icon: 24px;
}

* {
margin: 0; padding: 0; box-sizing: border-box;
user-select: none;
-webkit-tap-highlight-color: transparent;
}
html, body { height: 100%; }
body {
background: var(--bg);
color: var(--text);
font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text",
"PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
font-weight: 400;
letter-spacing: -0.01em;
-webkit-font-smoothing: antialiased;
overflow-y: auto;
padding-bottom: 160px;
min-height: 100vh;
}

/* ============ 顶部栏 ============ */
#topBar {
position: fixed; top: 0; left: 0; right: 0;
padding: 20px 22px;
display: flex; justify-content: space-between; align-items: center;
background: linear-gradient(to bottom, rgba(0,0,0,0.95), rgba(0,0,0,0));
z-index: 10;
backdrop-filter: blur(24px) saturate(180%);
-webkit-backdrop-filter: blur(24px) saturate(180%);
}
#topBar .title {
font-size: 17px;
font-weight: 700;
color: var(--text);
letter-spacing: -0.4px;
}
#topBar .user {
font-size: 13px;
font-weight: 600;
color: var(--accent);
cursor: pointer;
padding: 8px 16px;
border-radius: var(--radius-pill);
background: var(--accent-soft);
border: 1px solid var(--accent-border);
transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
letter-spacing: -0.2px;
}
#topBar .user:active { transform: scale(0.92); }

#mainContent { padding: 88px 22px 40px; min-height: 100vh; }

.tab-page { display: none; }
.tab-page.active { display: block; animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1); }
@keyframes fadeIn {
from { opacity: 0; transform: translateY(10px); }
to { opacity: 1; transform: translateY(0); }
}

/* ============ 卡片 ============ */
.card {
position: relative;
background: var(--glass-bg);
border: 1px solid var(--glass-border);
border-radius: var(--radius-card);
padding: 22px 20px;
margin-bottom: 14px;
cursor: pointer;
backdrop-filter: blur(30px) saturate(180%);
-webkit-backdrop-filter: blur(30px) saturate(180%);
box-shadow:
0 8px 32px rgba(0, 0, 0, 0.5),
inset 0 1px 0 var(--glass-highlight);
transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
background 0.2s;
overflow: hidden;
}
.card::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 50%;
background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
pointer-events: none;
}
.card:active {
transform: scale(0.97);
background: var(--glass-bg-strong);
}
.card h3 {
position: relative;
font-size: 16px;
font-weight: 700;
letter-spacing: -0.3px;
margin-bottom: 6px;
color: var(--text);
}
.card p {
position: relative;
font-size: 13.5px;
color: var(--text-dim);
line-height: 1.55;
letter-spacing: -0.1px;
}

/* ============ 胶囊按钮 ============ */
.big-btn {
position: relative;
width: 100%;
padding: 18px 24px;
border-radius: var(--radius-pill);
border: none;
background: linear-gradient(135deg, #e8a8b8 0%, #c98094 100%);
color: #1a0f14;
font-family: inherit;
font-size: 16px;
font-weight: 700;
letter-spacing: -0.2px;
cursor: pointer;
box-shadow:
0 8px 28px rgba(232, 168, 184, 0.35),
inset 0 1px 0 rgba(255, 255, 255, 0.4);
transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
box-shadow 0.2s;
overflow: hidden;
}
.big-btn::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 50%;
background: linear-gradient(180deg, rgba(255,255,255,0.25), transparent);
pointer-events: none;
}
.big-btn:active {
transform: scale(0.96);
}

/* ============ 时钟卡片 ============ */
.clock-card {
position: relative;
background: var(--glass-bg);
border: 1px solid var(--glass-border);
border-radius: var(--radius-card);
padding: 18px;
text-align: center;
backdrop-filter: blur(30px) saturate(180%);
-webkit-backdrop-filter: blur(30px) saturate(180%);
box-shadow:
0 8px 32px rgba(0, 0, 0, 0.4),
inset 0 1px 0 var(--glass-highlight);
overflow: hidden;
}
.clock-card::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 50%;
background: linear-gradient(180deg, rgba(255,255,255,0.05), transparent);
pointer-events: none;
}
.clock-card .label {
position: relative;
font-size: 11px;
color: var(--accent);
margin-bottom: 8px;
letter-spacing: 1.5px;
font-weight: 600;
}
.clock-card .time {
position: relative;
font-size: 19px;
font-weight: 700;
color: var(--text);
font-variant-numeric: tabular-nums;
letter-spacing: -0.5px;
}

/* ============ 底部液态玻璃胶囊导航栏 ============ */
#navBar {
position: fixed;
bottom: 30px;
left: 20px;
right: 20px;
display: flex;
justify-content: space-around;
align-items: center;
background: rgba(28, 28, 32, 0.7);
border: 1px solid var(--glass-border-strong);
border-radius: var(--radius-pill);
padding: 8px 10px;
z-index: 100;
backdrop-filter: blur(40px) saturate(200%);
-webkit-backdrop-filter: blur(40px) saturate(200%);
box-shadow:
0 12px 48px rgba(0, 0, 0, 0.6),
0 0 0 1px rgba(255, 255, 255, 0.05) inset,
inset 0 1px 0 rgba(255, 255, 255, 0.12);
max-width: 480px;
margin: 0 auto;
min-height: 76px;
}
.nav-item {
color: var(--text-dim);
font-size: 12px;
font-weight: 600;
display: flex;
flex-direction: column;
align-items: center;
gap: 5px;
cursor: pointer;
padding: 10px 18px;
border-radius: var(--radius-pill);
transition:
transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1),
background 0.25s,
color 0.25s;
flex: 1;
max-width: 110px;
letter-spacing: -0.2px;
}
.nav-item .icon {
font-size: 26px;
line-height: 1;
transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.nav-item.active {
color: var(--accent);
background: var(--accent-soft);
box-shadow: inset 0 1px 0 rgba(255,255,255,0.08);
}
.nav-item.active .icon {
transform: scale(1.12);
}
.nav-item:active { transform: scale(0.9); }

/* ============ 手机桌面网格 ============ */
.app-grid {
display: grid;
grid-template-columns: repeat(4, 1fr);
gap: 24px 12px;
margin-bottom: 24px;
padding-top: 4px;
}
.app-icon {
display: flex;
flex-direction: column;
align-items: center;
cursor: pointer;
transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
}
.app-icon:active { transform: scale(0.88); }
.app-icon .icon-box {
position: relative;
width: 68px; height: 68px;
border-radius: var(--radius-icon);
display: flex;
align-items: center;
justify-content: center;
font-size: 30px;
/* 统一深灰玻璃底 */
background: linear-gradient(160deg, #2c2c30 0%, #1a1a1e 100%);
border: 1px solid rgba(255, 255, 255, 0.07);
box-shadow:
0 8px 22px rgba(0, 0, 0, 0.5),
inset 0 1px 0 rgba(255, 255, 255, 0.14),
inset 0 -1px 0 rgba(0, 0, 0, 0.3);
margin-bottom: 10px;
overflow: hidden;
}
/* 顶部玻璃反光 */
.app-icon .icon-box::before {
content: '';
position: absolute;
top: 0; left: 0; right: 0;
height: 50%;
background: linear-gradient(180deg, rgba(255,255,255,0.16), transparent);
pointer-events: none;
border-radius: var(--radius-icon) var(--radius-icon) 0 0;
}
.app-icon .app-name {
font-size: 11.5px;
font-weight: 600;
color: rgba(255, 255, 255, 0.85);
text-align: center;
line-height: 1.3;
word-break: keep-all;
letter-spacing: -0.2px;
}

/* App 图标：统一暗灰底，不再五颜六色
但保留一点点色调，靠内部渐变区分 */
.color-green { background: linear-gradient(160deg, #2e3a33 0%, #1a1e1c 100%) !important; }
.color-blue { background: linear-gradient(160deg, #2e3540 0%, #1a1e24 100%) !important; }
.color-pink { background: linear-gradient(160deg, #3a2e33 0%, #1e1a1c 100%) !important; }
.color-orange { background: linear-gradient(160deg, #3a352e 0%, #1e1c1a 100%) !important; }
.color-purple { background: linear-gradient(160deg, #332e3a 0%, #1c1a1e 100%) !important; }
.color-red { background: linear-gradient(160deg, #3a2e30 0%, #1e1a1c 100%) !important; }
.color-gold { background: linear-gradient(160deg, #3a372e 0%, #1e1c1a 100%) !important; }
.color-dark { background: linear-gradient(160deg, #2c2c30 0%, #1a1a1e 100%) !important; }
</style>
</head>
<body>

<div id="topBar">
<div class="title">西班牙留学生工具站</div>
<div style="display:flex; align-items:center; gap:10px;">
    <div id="bellBtn" style="display:none; position:relative; cursor:pointer; padding:8px; font-size:20px;" onclick="toggleBell()">🔔<span id="bellDot" style="display:none; position:absolute; top:2px; right:2px; min-width:16px; height:16px; border-radius:8px; background:#e8a8b8; color:#1a0f14; font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; padding:0 4px;"></span></div>
    <div class="user" id="userDisplay">登录 →</div>
  </div>
</div>

<div id="mainContent">

  <!-- 消息面板 -->
<div id="bellPanel" style="display:none; position:fixed; top:70px; right:16px; left:16px; max-width:420px; margin:0 auto; background:rgba(28,28,32,0.95); border:1px solid rgba(255,255,255,0.12); border-radius:20px; padding:16px; z-index:200; backdrop-filter:blur(40px) saturate(200%); -webkit-backdrop-filter:blur(40px) saturate(200%); box-shadow:0 20px 60px rgba(0,0,0,0.6); max-height:70vh; overflow-y:auto;">
  <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
    <div style="font-size:15px; font-weight:700; color:#fff;">💬 我的消息</div>
    <button onclick="toggleBell()" style="background:none; border:none; color:#e8a8b8; font-size:14px; cursor:pointer;">关闭</button>
  </div>
  <div id="bellList"></div>
</div>

<div class="tab-page active" id="tab-home">
<div class="card" onclick="switchTab('tools')">
<h3>👋 欢迎回来</h3>
<p>这里是你的西班牙留学生一站式工具箱。点击底部标签，或者点这里进入工具箱。</p>
</div>

<div style="display: flex; gap: 12px; margin-bottom: 20px;">
<div class="clock-card" style="flex: 1;">
<div class="label">🇪🇸 西班牙</div>
<div class="time" id="spainClock">--:--:--</div>
</div>
<div class="clock-card" style="flex: 1;">
<div class="label">🇨🇳 中国</div>
<div class="time" id="chinaClock">--:--:--</div>
</div>
</div>

<button class="big-btn" onclick="switchTab('tools')">进入工具箱</button>
</div>

<div class="tab-page" id="tab-tools">
<div class="app-grid" id="appGrid"></div>
</div>

<div class="tab-page" id="tab-user">
<div class="card" id="userStatusCard">
<h3 id="userCardTitle">🔑 点击登录</h3>
<p id="userCardDesc">登录后可使用个人中心、留言、社区等功能</p>
</div>

<div id="userOnlyCards" style="display:none;">
<div class="card" onclick="location.href='/profile'">
<h3>👤 个人中心</h3>
<p>设置昵称、头像，查看会员状态。</p>
</div>
<div class="card" id="adminCard" onclick="location.href='/admin'" style="display:none;">
<h3>🛠️ 管理后台</h3>
<p>仅管理员可见。</p>
</div>
<div class="card" onclick="logout()" style="border-color: rgba(232,168,184,0.3); background: rgba(232,168,184,0.06);">
<h3 style="color:#e8a8b8;">🚪 退出登录</h3>
<p>点了就会退出当前账号</p>
</div>
</div>
</div>

</div>

<div id="navBar">
<div class="nav-item active" onclick="switchTab('home')" data-tab="home">
<span class="icon">🏠</span><span>主页</span>
</div>
<div class="nav-item" onclick="switchTab('tools')" data-tab="tools">
<span class="icon">🧰</span><span>工具</span>
</div>
<div class="nav-item" onclick="switchTab('user')" data-tab="user">
<span class="icon">👤</span><span>我的</span>
</div>
</div>

<script>
const ADMIN_EMAIL = "pseebat0312@gmail.com";

const apps = [
{ name: '倒数日', icon: '⏳', url: '/countdown', color: 'color-gold' },
{ name: '独家菜单', icon: '🍽️', url: '/menu', color: 'color-pink' },
{ name: '学校导览', icon: '🏫', url: '/school', color: 'color-blue' },
{ name: '办事导览', icon: '📋', url: '/affairs', color: 'color-green' },
{ name: 'AI 检测', icon: '🔍', url: '/ai_detect', color: 'color-purple' },
{ name: '二手市场', icon: '🛒', url: '/market', color: 'color-orange' },
{ name: '互助社区', icon: '💬', url: '/community', color: 'color-green' },
{ name: '探店地图', icon: '🗺️', url: '/map', color: 'color-red' },
{ name: '留言板', icon: '✍️', url: '/message', color: 'color-blue' },
{ name: '汇率计算', icon: '💱', url: '/currency', color: 'color-purple' },
{ name: '想家急救包', icon: '🏠', url: '/homesick', color: 'color-pink' },
{ name: '急救卡', icon: '🆘', url: '/emergency', color: 'color-red' },
{ name: '匿名树洞', icon: '🌳', url: '/treehole', color: 'color-green' }
];

function renderApps() {
const grid = document.getElementById('appGrid');
grid.innerHTML = '';
apps.forEach(app => {
const div = document.createElement('div');
div.className = 'app-icon';
div.onclick = () => {
if (navigator.vibrate) navigator.vibrate(10);
if (['/fortune'].includes(app.url)) {
alert('【' + app.name + '】正在开发中，敬请期待！');
} else {
location.href = app.url;
}
};
div.innerHTML = `
<div class="icon-box ${app.color}">${app.icon}</div>
<div class="app-name">${app.name}</div>
`;
grid.appendChild(div);
});
}

function switchTab(tabName) {
document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
document.getElementById('tab-' + tabName).classList.add('active');
document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
document.querySelector(`.nav-item[data-tab="${tabName}"]`).classList.add('active');
if (navigator.vibrate) navigator.vibrate(8);
refreshLoginUI();
}

function logout() {
if (navigator.vibrate) navigator.vibrate(15);
if (!confirm('确定要退出登录吗？')) return;
localStorage.removeItem('access_token');
localStorage.removeItem('user_email');
location.reload();
}

function refreshLoginUI() {
const token = localStorage.getItem('access_token');
const email = localStorage.getItem('user_email');
const userOnly = document.getElementById('userOnlyCards');
const adminCard = document.getElementById('adminCard');
const topDisplay = document.getElementById('userDisplay');
const statusCard = document.getElementById('userStatusCard');

if (token && email) {
document.getElementById('userCardTitle').textContent = '✅ ' + email;
document.getElementById('userCardDesc').textContent = '点击进入个人中心';
userOnly.style.display = 'block';
adminCard.style.display = (email === ADMIN_EMAIL) ? 'block' : 'none';
topDisplay.textContent = email.split('@')[0];
topDisplay.onclick = logout;
} else {
document.getElementById('userCardTitle').textContent = '🔑 点击登录';
document.getElementById('userCardDesc').textContent = '登录后可使用个人中心、留言、社区等功能';
userOnly.style.display = 'none';
adminCard.style.display = 'none';
topDisplay.textContent = '登录 →';
topDisplay.onclick = () => location.href = '/login';
}

statusCard.addEventListener('click', function() {
if (navigator.vibrate) navigator.vibrate(10);
if (localStorage.getItem('access_token')) location.href = '/profile';
else location.href = '/login';
});
}

function updateClock() {
const now = new Date();
const spainTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Madrid"}));
const chinaTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Shanghai"}));
const pad = (n) => String(n).padStart(2, '0');
const fmt = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
document.getElementById('spainClock').textContent = fmt(spainTime);
document.getElementById('chinaClock').textContent = fmt(chinaTime);
}
updateClock();
setInterval(updateClock, 1000);

renderApps();
refreshLoginUI();

window.addEventListener('load', () => {
const params = new URLSearchParams(window.location.search);
if (params.get('tab') === 'tools') {
switchTab('tools');
window.history.replaceState({}, '', '/');
}
});

// ============ 铃铛消息 ============
  let bellOpen = false;

  async function loadBellCount() {
    const token = localStorage.getItem('access_token');
    const email = localStorage.getItem('user_email');
    const bell = document.getElementById('bellBtn');
    const dot = document.getElementById('bellDot');

    if (!token || !email) {
      bell.style.display = 'none';
      return;
    }
    bell.style.display = 'block';

    try {
      const resp = await fetch('/api/my_replies?owner=' + encodeURIComponent(email));
      const data = await resp.json();
      if (!Array.isArray(data)) return;

      // 上次读消息时间
      const lastSeen = localStorage.getItem('bell_last_seen') || '1970-01-01';
      const unread = data.filter(r => r.created_at > lastSeen);

      if (unread.length > 0) {
        dot.style.display = 'flex';
        dot.textContent = unread.length > 99 ? '99+' : unread.length;
      } else {
        dot.style.display = 'none';
      }

      window._bellData = data;
    } catch(e) {}
  }

  async function toggleBell() {
    const panel = document.getElementById('bellPanel');
    bellOpen = !bellOpen;

    if (bellOpen) {
      panel.style.display = 'block';
      await renderBellList();
      // 标记已读
      localStorage.setItem('bell_last_seen', new Date().toISOString());
      document.getElementById('bellDot').style.display = 'none';
    } else {
      panel.style.display = 'none';
    }
  }

  async function renderBellList() {
    const list = document.getElementById('bellList');
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">加载中...</div>';

    const email = localStorage.getItem('user_email');
    try {
      const resp = await fetch('/api/my_replies?owner=' + encodeURIComponent(email));
      const data = await resp.json();
      if (!Array.isArray(data) || data.length === 0) {
        list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:13px;">还没有收到新回复</div>';
        return;
      }
      list.innerHTML = '';
      data.forEach(r => {
        const div = document.createElement('div');
        div.style.cssText = 'padding:12px 14px; background:rgba(255,255,255,0.04); border-radius:12px; margin-bottom:8px; cursor:pointer;';
        div.innerHTML = `
          <div style="font-size:12px; color:#e8a8b8; margin-bottom:6px;">💬 有人回复了你的树洞</div>
          <div style="font-size:13px; color:#fff; line-height:1.5; margin-bottom:6px;">"${r.content}"</div>
          <div style="font-size:11px; color:#888;">你的树洞：${(r.tree_content || '').slice(0, 30)}...</div>
        `;
        div.addEventListener('click', () => {
          location.href = '/treehole';
        });
        list.appendChild(div);
      });
    } catch(e) {
      list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;">加载失败</div>';
    }
  }

  // 页面加载时检查铃铛
  setTimeout(loadBellCount, 1000);

  // 每分钟刷新一次
  setInterval(loadBellCount, 60000);

</script>
</body>
</html>
