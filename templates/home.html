<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height: 100%; }
  body {
    background: #0f0c29;
    background-size: cover;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-y: auto;
    transition: background 0.3s;
  }

  /* 顶部状态栏 */
  #topBar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.4), transparent);
    z-index: 10;
  }
  #topBar .title { font-size: 16px; font-weight: bold; color: #fff; }
  #topBar .user { font-size: 13px; color: #fff; cursor: pointer; }

  /* 内容区 */
  #mainContent {
    padding: 80px 20px 120px;
    min-height: 100vh;
  }

  /* 时间卡片 */
  .clock-card {
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px;
    padding: 18px;
    margin-bottom: 24px;
    display: flex; justify-content: space-around;
    backdrop-filter: blur(10px);
  }
  .clock-card .time-item { text-align: center; }
  .clock-card .time-item .label { font-size: 12px; color: #a0d8b3; margin-bottom: 6px; }
  .clock-card .time-item .time { font-size: 18px; font-weight: bold; }

  /* App 网格 */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 12px;
    margin-bottom: 24px;
  }
  .app-icon {
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; transition: transform 0.1s;
  }
  .app-icon:active { transform: scale(0.92); }
  .app-icon .icon-box {
    width: 64px; height: 64px;
    border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    font-size: 32px;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    box-shadow: 0 6px 16px rgba(0,0,0,0.3);
    margin-bottom: 8px;
  }
  .app-icon .app-name {
    font-size: 11px; color: #fff; text-align: center;
    line-height: 1.3;
    word-break: keep-all;
  }

  /* 不同颜色的 App */
  .color-green { background: linear-gradient(135deg, #4a7c59, #2d5a3d) !important; }
  .color-blue  { background: linear-gradient(135deg, #4a6fa5, #2d4a7c) !important; }
  .color-pink  { background: linear-gradient(135deg, #a54a7c, #7c2d5a) !important; }
  .color-orange{ background: linear-gradient(135deg, #a57c4a, #7c5a2d) !important; }
  .color-purple{ background: linear-gradient(135deg, #7c4aa5, #5a2d7c) !important; }
  .color-red   { background: linear-gradient(135deg, #a54a4a, #7c2d2d) !important; }
  .color-dark  { background: linear-gradient(135deg, #2a2a3e, #1a1a2e) !important; }

  /* Dock 底栏 */
  #dock {
    position: fixed; bottom: 20px; left: 20px; right: 20px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 12px;
    display: flex; justify-content: space-around; align-items: center;
    backdrop-filter: blur(15px);
    z-index: 100;
  }
  .dock-item {
    display: flex; flex-direction: column; align-items: center;
    cursor: pointer; padding: 6px 12px; border-radius: 12px;
    transition: 0.15s;
  }
  .dock-item:active { transform: scale(0.9); }
  .dock-item .dock-icon { font-size: 24px; }
  .dock-item .dock-name { font-size: 10px; color: #ccc; margin-top: 4px; }

  /* 背景切换按钮（右上角小圆点） */
  #bgBtn {
    position: fixed; top: 16px; right: 20px;
    width: 32px; height: 32px; border-radius: 50%;
    background: rgba(255,255,255,0.15);
    border: none; color: #fff; font-size: 16px;
    cursor: pointer; z-index: 20;
  }
</style>
</head>
<body>

<div id="topBar">
  <div class="title">🇪🇸 西班牙留学生工具站</div>
  <div class="user" id="userDisplay">登录 →</div>
</div>

<button id="bgBtn" onclick="changeBg()">🎨</button>

<div id="mainContent">

  <div class="clock-card">
    <div class="time-item">
      <div class="label">🇪🇸 西班牙</div>
      <div class="time" id="spainClock">--:--:--</div>
    </div>
    <div class="time-item">
      <div class="label">🇨🇳 中国</div>
      <div class="time" id="chinaClock">--:--:--</div>
    </div>
  </div>

  <div class="app-grid" id="appGrid">
    <!-- 图标会由 JS 渲染 -->
  </div>

</div>

<div id="dock">
  <div class="dock-item" onclick="location.href='/'">
    <span class="dock-icon">🏠</span><span class="dock-name">主页</span>
  </div>
  <div class="dock-item" onclick="location.href='/message'">
    <span class="dock-icon">✍️</span><span class="dock-name">留言</span>
  </div>
  <div class="dock-item" onclick="location.href='/profile'">
    <span class="dock-icon">👤</span><span class="dock-name">我的</span>
  </div>
</div>

<script>
  const ADMIN_EMAIL = "pseebat0312@gmail.com";

  // ===== App 列表（图标、名字、链接、颜色）=====
  const apps = [
    { name: '倒数日',    icon: '⏳', url: '/countdown',   color: 'color-orange' },
    { name: '室友菜单',  icon: '🍽️', url: '/menu',        color: 'color-pink' },
    { name: '学校导览',  icon: '🏫', url: '/school',      color: 'color-blue' },
    { name: '办事导览',  icon: '📋', url: '/affairs',     color: 'color-green' },
    { name: 'AI 检测',   icon: '🔍', url: '/ai_detect',   color: 'color-purple' },
    { name: '二手市场',  icon: '🛒', url: '/market',      color: 'color-orange' },
    { name: '互助社区',  icon: '💬', url: '/community',   color: 'color-green' },
    { name: '探店地图',  icon: '🗺️', url: '/map',         color: 'color-red' },
    { name: '留言板',    icon: '✍️', url: '/message',     color: 'color-blue' },
    { name: '汇率计算',  icon: '💱', url: '/currency',    color: 'color-purple' },
    { name: '今日运势',  icon: '🔮', url: '/fortune',     color: 'color-pink' },
    { name: '急救卡',    icon: '🚨', url: '/emergency',   color: 'color-red' }
  ];

  // ===== 渲染 App 图标 =====
  function renderApps() {
    const grid = document.getElementById('appGrid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const div = document.createElement('div');
      div.className = 'app-icon';
      div.onclick = () => {
        if (navigator.vibrate) navigator.vibrate(10);
        // 未实现的功能弹提示
        if (['/countdown', '/menu', '/fortune', '/emergency'].includes(app.url)) {
          alert('【' + app.name + '】正在开发中，敬请期待！');
        } else {
          location.href = app.url;
        }
      };
      div.innerHTML = `
        <div class="icon-box ${app.color}">${app.icon}</div>
        <div class="app-name">${app.name}</div>
      `;
      grid.appendChild(div);
    });
  }

  // ===== 背景切换 =====
  const backgrounds = [
    '#0f0c29',
    'linear-gradient(135deg, #0f0c29, #302b63, #24243e)',
    'linear-gradient(135deg, #1a1a2e, #16213e)',
    'linear-gradient(135deg, #2d1b3d, #1a1a2e)',
    'linear-gradient(135deg, #1b3d2d, #0f1a1a)',
    'linear-gradient(135deg, #3d1b1b, #1a0f0f)'
  ];
  let bgIndex = 0;
  function changeBg() {
    bgIndex = (bgIndex + 1) % backgrounds.length;
    document.body.style.background = backgrounds[bgIndex];
    localStorage.setItem('bgIndex', bgIndex);
  }
  // 恢复上次背景
  const savedBg = localStorage.getItem('bgIndex');
  if (savedBg !== null) {
    bgIndex = parseInt(savedBg);
    document.body.style.background = backgrounds[bgIndex];
  }

  // ===== 时钟 =====
  function updateClock() {
    const now = new Date();
    const spain = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Madrid"}));
    const china = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Shanghai"}));
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('spainClock').textContent = fmt(spain);
    document.getElementById('chinaClock').textContent = fmt(china);
  }
  updateClock();
  setInterval(updateClock, 1000);

  // ===== 登录状态 =====
  function refreshLoginUI() {
    const token = localStorage.getItem('access_token');
    const email = localStorage.getItem('user_email');
    const topDisplay = document.getElementById('userDisplay');

    if (token && email) {
      topDisplay.textContent = email;
      topDisplay.onclick = () => {
        if (confirm('确定要退出登录吗？')) {
          localStorage.removeItem('access_token');
          localStorage.removeItem('user_email');
          location.reload();
        }
      };
    } else {
      topDisplay.textContent = '登录 →';
      topDisplay.onclick = () => location.href = '/login';
    }
  }

  renderApps();
  refreshLoginUI();
</script>
</body>
</html>
