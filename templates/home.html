<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#1a1416">
<title>西班牙留学生工具站</title>
<style>
  :root {
    --bg: #1a1416;
    --bg-2: #221a1c;
    --card-bg: rgba(255, 235, 238, 0.04);
    --card-border: rgba(255, 235, 238, 0.08);
    --text: #f5e6ea;
    --text-dim: #b8a5ad;
    --accent: #e8a0b0;
    --accent-soft: rgba(232, 160, 176, 0.12);
    --accent-border: rgba(232, 160, 176, 0.3);
    --spain-red: #8a2a3a;
    --spain-gold: #b8894a;
    --nav-bg: rgba(34, 26, 28, 0.85);
    --nav-border: rgba(255, 235, 238, 0.08);
  }

  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  html, body { height: 100%; }
  body {
    background:
      radial-gradient(ellipse at top, #2a1f22 0%, transparent 60%),
      var(--bg);
    color: var(--text);
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow-y: auto;
    padding-bottom: 120px;
  }

  /* 顶部栏 */
  #topBar {
    position: fixed; top: 0; left: 0; right: 0;
    padding: 16px 20px;
    display: flex; justify-content: space-between; align-items: center;
    background: linear-gradient(to bottom, rgba(26,20,22,0.95), transparent);
    z-index: 10;
    backdrop-filter: blur(12px);
  }
  #topBar .title {
    font-size: 15px; font-weight: bold;
    color: var(--text);
    letter-spacing: 0.5px;
  }
  #topBar .user {
    font-size: 12px;
    color: var(--accent);
    cursor: pointer;
    padding: 6px 12px;
    border-radius: 20px;
    background: var(--accent-soft);
    border: 1px solid var(--accent-border);
    transition: 0.2s;
  }
  #topBar .user:active { transform: scale(0.95); }

  #mainContent { padding: 80px 20px 40px; min-height: 100vh; }

  .tab-page { display: none; }
  .tab-page.active { display: block; animation: fadeIn 0.35s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* 卡片 */
  .card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 20px;
    margin-bottom: 14px;
    cursor: pointer;
    transition: 0.2s;
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
  }
  .card:active {
    transform: scale(0.98);
    background: rgba(255, 235, 238, 0.06);
  }
  .card h3 {
    font-size: 15px; margin-bottom: 8px;
    color: var(--text);
    font-weight: 600;
  }
  .card p {
    font-size: 12px;
    color: var(--text-dim);
    line-height: 1.6;
  }

  /* 大按钮 */
  .big-btn {
    width: 100%; padding: 16px;
    border-radius: var(--radius);
    border: none;
    background: linear-gradient(135deg, var(--accent), #c98094);
    color: #2a1a1e;
    font-size: 15px; font-weight: 700;
    cursor: pointer;
    box-shadow: 0 8px 28px rgba(232, 160, 176, 0.25);
    transition: 0.2s;
    letter-spacing: 0.5px;
  }
  .big-btn:active { transform: scale(0.97); }

  /* 时钟卡片 */
  .clock-card {
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: var(--radius);
    padding: 16px;
    text-align: center;
    backdrop-filter: blur(10px);
  }
  .clock-card .label {
    font-size: 11px;
    color: var(--accent);
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .clock-card .time {
    font-size: 18px;
    font-weight: 700;
    color: var(--text);
    font-variant-numeric: tabular-nums;
  }

  /* ============ 悬浮胶囊导航栏 ============ */
  #navBar {
    position: fixed;
    bottom: 24px;
    left: 20px;
    right: 20px;
    display: flex;
    justify-content: space-around;
    align-items: center;
    background: var(--nav-bg);
    border: 1px solid var(--nav-border);
    border-radius: 32px;
    padding: 10px 12px;
    z-index: 100;
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.5),
      0 0 0 1px rgba(255, 235, 238, 0.04) inset;
    max-width: 480px;
    margin: 0 auto;
  }
  .nav-item {
    color: var(--text-dim);
    font-size: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    cursor: pointer;
    padding: 8px 16px;
    border-radius: 20px;
    transition: 0.25s;
    flex: 1;
    max-width: 90px;
  }
  .nav-item .icon { font-size: 20px; }
  .nav-item.active {
    color: var(--accent);
    background: var(--accent-soft);
  }
  .nav-item:active { transform: scale(0.92); }

  /* 手机桌面网格 */
  .app-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 20px 12px;
    margin-bottom: 24px;
    padding-top: 4px;
  }
  .app-icon {
    display: flex;
    flex-direction: column;
    align-items: center;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .app-icon:active { transform: scale(0.9); }
  .app-icon .icon-box {
    width: 62px; height: 62px;
    border-radius: 18px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 30px;
    background: linear-gradient(145deg, #2e2326, #1f181a);
    border: 1px solid rgba(255, 235, 238, 0.06);
    box-shadow:
      0 6px 18px rgba(0, 0, 0, 0.4),
      inset 0 1px 0 rgba(255, 235, 238, 0.06);
    margin-bottom: 8px;
    position: relative;
    overflow: hidden;
  }
  .app-icon .icon-box::after {
    content: '';
    position: absolute;
    inset: 0;
    border-radius: 18px;
    background: linear-gradient(180deg, rgba(255,235,238,0.06), transparent 50%);
    pointer-events: none;
  }
  .app-icon .app-name {
    font-size: 10px;
    color: var(--text-dim);
    text-align: center;
    line-height: 1.3;
    word-break: keep-all;
    letter-spacing: 0.3px;
  }

  /* 每个 App 的专属渐变（暗调）*/
  .color-green  { background: linear-gradient(145deg, #3a5a45, #1f3a28) !important; }
  .color-blue   { background: linear-gradient(145deg, #3a4a6a, #1f2a4a) !important; }
  .color-pink   { background: linear-gradient(145deg, #6a3a4a, #3a1f28) !important; }
  .color-orange { background: linear-gradient(145deg, #6a4a2a, #3a2818) !important; }
  .color-purple { background: linear-gradient(145deg, #4a3a6a, #281f3a) !important; }
  .color-red    { background: linear-gradient(145deg, #6a2a3a, #3a1820) !important; }
  .color-gold   { background: linear-gradient(145deg, #6a5a2a, #3a2e18) !important; }
  .color-dark   { background: linear-gradient(145deg, #2a2a3e, #1a1a2e) !important; }
</style>
</head>
<body>

<div id="topBar">
  <div class="title">🇪🇸 西班牙留学生工具站</div>
  <div class="user" id="userDisplay">登录 →</div>
</div>

<div id="mainContent">

  <!-- Tab 1: 主页 -->
  <div class="tab-page active" id="tab-home">
    <div class="card" onclick="switchTab('tools')">
      <h3>👋 欢迎回来</h3>
      <p>这里是你的西班牙留学生一站式工具箱。点击底部标签，或者点这里进入工具箱。</p >
    </div>

    <div style="display: flex; gap: 12px; margin-bottom: 20px;">
      <div class="clock-card" style="flex: 1;">
        <div class="label">🇪🇸 西班牙</div>
        <div class="time" id="spainClock">--:--:--</div>
      </div>
      <div class="clock-card" style="flex: 1;">
        <div class="label">🇨🇳 中国</div>
        <div class="time" id="chinaClock">--:--:--</div>
      </div>
    </div>

    <button class="big-btn" onclick="switchTab('tools')">进入工具箱</button>
  </div>

  <!-- Tab 2: 工具箱 -->
  <div class="tab-page" id="tab-tools">
    <div class="app-grid" id="appGrid"></div>
  </div>

  <!-- Tab 3: 我的 -->
  <div class="tab-page" id="tab-user">
    <div class="card" id="userStatusCard">
      <h3 id="userCardTitle">🔑 点击登录</h3>
      <p id="userCardDesc">登录后可使用个人中心、留言、社区等功能</p >
    </div>

    <div id="userOnlyCards" style="display:none;">
      <div class="card" onclick="location.href='/profile'">
        <h3>👤 个人中心</h3>
        <p>设置昵称、头像，查看会员状态。</p >
      </div>
      <div class="card" id="adminCard" onclick="location.href='/admin'" style="display:none;">
        <h3>🛠️ 管理后台</h3>
        <p>仅管理员可见。</p >
      </div>
      <div class="card" onclick="logout()" style="border-color: rgba(232,160,176,0.3); background: rgba(232,160,176,0.06);">
        <h3 style="color:#e8a0b0;">🚪 退出登录</h3>
        <p>点了就会退出当前账号</p >
      </div>
    </div>
  </div>

</div>

<div id="navBar">
  <div class="nav-item active" onclick="switchTab('home')" data-tab="home">
    <span class="icon">🏠</span><span>主页</span>
  </div>
  <div class="nav-item" onclick="switchTab('tools')" data-tab="tools">
    <span class="icon">🧰</span><span>工具</span>
  </div>
  <div class="nav-item" onclick="switchTab('user')" data-tab="user">
    <span class="icon">👤</span><span>我的</span>
  </div>
</div>

<script>
  const ADMIN_EMAIL = "pseebat0312@gmail.com";

  const apps = [
    { name: '倒数日',    icon: '⏳', url: '/countdown',  color: 'color-gold' },
    { name: '独家菜单',  icon: '🍽️', url: '/menu',       color: 'color-pink' },
    { name: '学校导览',  icon: '🏫', url: '/school',     color: 'color-blue' },
    { name: '办事导览',  icon: '📋', url: '/affairs',    color: 'color-green' },
    { name: 'AI 检测',   icon: '🔍', url: '/ai_detect',  color: 'color-purple' },
    { name: '二手市场',  icon: '🛒', url: '/market',     color: 'color-orange' },
    { name: '互助社区',  icon: '💬', url: '/community',  color: 'color-green' },
    { name: '探店地图',  icon: '🗺️', url: '/map',        color: 'color-red' },
    { name: '留言板',    icon: '✍️', url: '/message',    color: 'color-blue' },
    { name: '汇率计算',  icon: '💱', url: '/currency',   color: 'color-purple' },
    { name: '想家急救包',  icon: '🏠', url: '/homesick',   color: 'color-pink' },
    { name: '急救卡',    icon: '🆘', url: '/emergency',  color: 'color-red' },
    { name: '匿名树洞',  icon: '🌳', url: '/treehole',   color: 'color-green' }
  ];

  function renderApps() {
    const grid = document.getElementById('appGrid');
    grid.innerHTML = '';
    apps.forEach(app => {
      const div = document.createElement('div');
      div.className = 'app-icon';
      div.onclick = () => {
        if (navigator.vibrate) navigator.vibrate(10);
        if (['/fortune'].includes(app.url)) {
          alert('【' + app.name + '】正在开发中，敬请期待！');
        } else {
          location.href = app.url;
        }
      };
      div.innerHTML = `
        <div class="icon-box ${app.color}">${app.icon}</div>
        <div class="app-name">${app.name}</div>
      `;
      grid.appendChild(div);
    });
  }

  function switchTab(tabName) {
    document.querySelectorAll('.tab-page').forEach(p => p.classList.remove('active'));
    document.getElementById('tab-' + tabName).classList.add('active');
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.querySelector(`.nav-item[data-tab="${tabName}"]`).classList.add('active');
    if (navigator.vibrate) navigator.vibrate(8);
    refreshLoginUI();
  }

  function logout() {
    if (navigator.vibrate) navigator.vibrate(15);
    if (!confirm('确定要退出登录吗？')) return;
    localStorage.removeItem('access_token');
    localStorage.removeItem('user_email');
    location.reload();
  }

  function refreshLoginUI() {
    const token = localStorage.getItem('access_token');
    const email = localStorage.getItem('user_email');
    const userOnly = document.getElementById('userOnlyCards');
    const adminCard = document.getElementById('adminCard');
    const topDisplay = document.getElementById('userDisplay');
    const statusCard = document.getElementById('userStatusCard');

    if (token && email) {
      document.getElementById('userCardTitle').textContent = '✅ ' + email;
      document.getElementById('userCardDesc').textContent = '点击进入个人中心';
      userOnly.style.display = 'block';
      adminCard.style.display = (email === ADMIN_EMAIL) ? 'block' : 'none';
      topDisplay.textContent = email.split('@')[0];
      topDisplay.onclick = logout;
    } else {
      document.getElementById('userCardTitle').textContent = '🔑 点击登录';
      document.getElementById('userCardDesc').textContent = '登录后可使用个人中心、留言、社区等功能';
      userOnly.style.display = 'none';
      adminCard.style.display = 'none';
      topDisplay.textContent = '登录 →';
      topDisplay.onclick = () => location.href = '/login';
    }

    statusCard.addEventListener('click', function() {
      if (navigator.vibrate) navigator.vibrate(10);
      if (localStorage.getItem('access_token')) location.href = '/profile';
      else location.href = '/login';
    });
  }

  function updateClock() {
    const now = new Date();
    const spainTime = new Date(now.toLocaleString("en-US", {timeZone: "Europe/Madrid"}));
    const chinaTime = new Date(now.toLocaleString("en-US", {timeZone: "Asia/Shanghai"}));
    const pad = (n) => String(n).padStart(2, '0');
    const fmt = (d) => pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    document.getElementById('spainClock').textContent = fmt(spainTime);
    document.getElementById('chinaClock').textContent = fmt(chinaTime);
  }
  updateClock();
  setInterval(updateClock, 1000);

  renderApps();
  refreshLoginUI();

  window.addEventListener('load', () => {
    const params = new URLSearchParams(window.location.search);
    if (params.get('tab') === 'tools') {
      switchTab('tools');
      window.history.replaceState({}, '', '/');
    }
  });
</script>
</body>
</html>
