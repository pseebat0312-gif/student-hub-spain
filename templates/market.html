<!DOCTYPE html>
<html lang="zh">
<head>
<link rel="stylesheet" href="/static/style.css">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0f0c29">
<title>留学生二手市场 · 西班牙留学生工具站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; user-select:none; -webkit-tap-highlight-color:transparent; }
  body {
    background: #0f0c29;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    min-height: 100vh;
    padding-bottom: 40px;
  }

  #topBar {
    padding: 16px 20px;
    display: flex; align-items: center; gap: 12px;
    background: linear-gradient(to bottom, #0f0c29, transparent);
    position: sticky; top: 0; z-index: 10;
  }
  #topBar .back-btn {
    background: rgba(255,255,255,0.08);
    border: none; color: #fff; font-size: 18px;
    width: 36px; height: 36px; border-radius: 50%;
    cursor: pointer; transition: 0.1s;
  }
  #topBar .back-btn:active { transform: scale(0.9); }
  #topBar .title { font-size: 16px; font-weight: bold; color: #a0d8b3; }

  #content { padding: 10px 20px 40px; }

  /* 顶部提示 */
  .notice {
    font-size: 12px; color: #888;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 16px;
    line-height: 1.6;
  }

  /* 发布按钮 */
  .publish-btn {
    width: 100%;
    padding: 16px;
    border-radius: 16px;
    border: none;
    background: linear-gradient(135deg, #4a7c59, #2d5a3d);
    color: #fff; font-size: 16px; font-weight: bold;
    cursor: pointer; transition: 0.1s;
    margin-bottom: 16px;
  }
  .publish-btn:active { transform: scale(0.97); }

  /* 发布表单 */
  .form-card {
    display: none;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 18px;
    margin-bottom: 20px;
  }
  .form-card.show { display: block; animation: fadeIn 0.3s ease; }
  @keyframes fadeIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

  .form-card input, .form-card textarea, .form-card select {
    width: 100%; padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.06);
    color: #fff; font-size: 14px; outline: none;
    margin-bottom: 10px; font-family: inherit;
  }
  .form-card textarea { height: 70px; resize: none; }
  .form-card select option { background: #1a1a2e; }
  .form-card input:focus, .form-card textarea:focus { border-color: #a0d8b3; }

  .form-actions { display: flex; gap: 10px; margin-top: 6px; }
  .form-actions button {
    flex: 1; padding: 12px;
    border-radius: 12px; border: none;
    font-size: 14px; font-weight: bold; cursor: pointer;
  }
  .form-actions .cancel { background: rgba(255,255,255,0.1); color: #ccc; }
  .form-actions .submit { background: linear-gradient(135deg, #4a7c59, #2d5a3d); color: #fff; }

  /* 排序栏 */
  .sort-bar {
    display: flex; gap: 8px;
    overflow-x: auto;
    padding-bottom: 8px;
    margin-bottom: 16px;
  }
  .sort-bar::-webkit-scrollbar { display: none; }
  .sort-btn {
    padding: 8px 16px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px;
    white-space: nowrap; cursor: pointer;
    transition: 0.2s;
  }
  .sort-btn.active { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .sort-btn:active { transform: scale(0.95); }

  /* 商品卡片 */
  .item-card {
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.08);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 14px;
    transition: 0.15s;
  }
  .item-card:active { transform: scale(0.98); }
  .item-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    margin-bottom: 8px;
  }
  .item-title { font-size: 16px; font-weight: bold; color: #fff; flex: 1; }
  .item-price { font-size: 15px; color: #a0d8b3; font-weight: bold; margin-left: 8px; }
  .item-desc { font-size: 13px; color: #bbb; line-height: 1.6; margin-bottom: 10px; }
  .item-image {
    width: 100%; border-radius: 10px; margin-bottom: 10px;
    max-height: 180px; object-fit: cover;
  }
  .item-meta {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12px; color: #888;
  }
  .item-actions { display: flex; gap: 8px; margin-top: 12px; }
  .item-actions button {
    padding: 8px 14px; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.05);
    color: #ccc; font-size: 13px; cursor: pointer;
    transition: 0.15s;
  }
  .item-actions button:active { transform: scale(0.95); background: rgba(160, 216, 179, 0.15); }
  .item-actions .primary { background: rgba(160, 216, 179, 0.15); color: #a0d8b3; border-color: #a0d8b3; }
  .item-actions .danger { color: #ff6b6b; }

  /* 空状态 */
  .empty-state {
    text-align: center; padding: 60px 20px;
    color: #666; font-size: 14px;
  }

  /* 详情弹窗 */
  .detail-modal {
    position: fixed; inset: 0;
    background: rgba(0,0,0,0.8);
    display: none; justify-content: center; align-items: flex-end;
    z-index: 100;
  }
  .detail-modal.show { display: flex; }
  .detail-content {
    background: #1a1a2e;
    width: 100%; max-width: 500px;
    border-radius: 25px 25px 0 0;
    padding: 24px 20px 35px;
    max-height: 80vh; overflow-y: auto;
    animation: slideUp 0.3s ease;
  }
  @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  .detail-content h3 { font-size: 18px; margin-bottom: 12px; color: #a0d8b3; }
  .detail-content p { font-size: 14px; color: #ccc; line-height: 1.7; margin-bottom: 12px; }
  .detail-content .close-btn {
    width: 100%; padding: 14px; border-radius: 14px;
    border: none; background: rgba(255,255,255,0.08);
    color: #fff; font-size: 15px; cursor: pointer; margin-top: 16px;
  }
</style>
</head>
<body>

<div id="topBar">
  <button class="back-btn" onclick="goBack()">←</button>
  <div class="title">🛒 留学生二手市场</div>
</div>

<div id="content">

  <div class="notice">
    💡 此平台仅作为沟通媒介，不涉及交易。请通过买家提供的联系方式进行后续交易。
  </div>

  <!-- 发布按钮 -->
  <button class="publish-btn" onclick="togglePublish()">➕ 发布我要卖的东西</button>

  <!-- 发布表单 -->
  <div class="form-card" id="publishForm">
    <input type="text" id="itemTitle" placeholder="物品名称 *">
    <textarea id="itemDesc" placeholder="物品描述"></textarea>
    <input type="text" id="itemPrice" placeholder="价格（欧元）">
    <input type="text" id="itemContact" placeholder="联系方式（微信 / WhatsApp）*">
    <input type="text" id="itemImage" placeholder="图片链接（可选，建议用图床链接）">
    <select id="itemCategory">
      <option value="">📂 选择分类</option>
      <option value="家具">🛋️ 家具</option>
      <option value="教材">📚 教材</option>
      <option value="电子产品">💻 电子产品</option>
      <option value="生活用品">🧴 生活用品</option>
      <option value="出行工具">🚲 出行工具</option>
      <option value="其他">📦 其他</option>
    </select>
    <div class="form-actions">
      <button class="cancel" onclick="togglePublish()">取消</button>
      <button class="submit" onclick="submitItem()">发布</button>
    </div>
  </div>

  <!-- 排序栏 -->
  <div class="sort-bar">
    <button class="sort-btn active" data-sort="new" onclick="sortBy('new', this)">最新发布</button>
    <button class="sort-btn" data-sort="price" onclick="sortBy('price', this)">价格最低</button>
    <button class="sort-btn" data-sort="views" onclick="sortBy('views', this)">最多浏览</button>
  </div>

  <!-- 商品列表（从数据库加载） -->
  <div id="itemList"></div>

</div>

<!-- 详情弹窗 -->
<div class="detail-modal" id="detailModal">
  <div class="detail-content">
    <h3 id="detailTitle">商品标题</h3>
    <p id="detailDesc">商品描述</p>
    <p id="detailPrice" style="color:#a0d8b3; font-weight:bold;"></p>
    <p id="detailContact" style="color:#fff;"></p>
    <button class="close-btn" onclick="closeDetail()">关闭</button>
  </div>
</div>

<script>
  // ===== 智能返回 =====
  function goBack() {
    if (navigator.vibrate) navigator.vibrate(10);
    if (window.history.length > 1) {
      window.history.back();
    } else {
      location.href = '/';
    }
  }

  // ===== 展开/折叠发布表单 =====
  function togglePublish() {
    if (navigator.vibrate) navigator.vibrate(10);
    document.getElementById('publishForm').classList.toggle('show');
  }

  // ===== HTML 转义 =====
  function escapeHtml(s) {
    return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // ===== 商品数据 =====
  let allItems = [];
  let currentSort = 'new';

  async function loadItems() {
    const list = document.getElementById('itemList');
    list.innerHTML = '<div style="text-align:center;color:#666;padding:20px;font-size:13px;">加载中...</div>';
    try {
      const resp = await fetch('/api/market');
      allItems = await resp.json();
    } catch (e) { allItems = []; }
    renderItems();
  }

  function renderItems() {
    const list = document.getElementById('itemList');
    if (!Array.isArray(allItems) || !allItems.length) {
      list.innerHTML = '<div class="empty-state">还没有人发布物品</div>';
      return;
    }
    let items = allItems.slice();
    if (currentSort === 'price') {
      items.sort((a, b) => (parseFloat(a.price) || 0) - (parseFloat(b.price) || 0));
    } else if (currentSort === 'views') {
      items.sort((a, b) => (b.views || 0) - (a.views || 0));
    }
    list.innerHTML = '';
    const myEmail = localStorage.getItem('user_email');
    items.forEach(it => {
      const div = document.createElement('div');
      div.className = 'item-card';
      const isMine = myEmail && it.user_email === myEmail;
      div.innerHTML = `
        <div class="item-head">
          <div class="item-title">${escapeHtml(it.title)}</div>
          <div class="item-price">${it.price ? '€' + escapeHtml(it.price) : ''}</div>
        </div>
        ${it.image_url ? `<img class="item-image" src="${escapeHtml(it.image_url)}" alt="">` : ''}
        <div class="item-desc">${escapeHtml(it.description || '')}</div>
        <div class="item-meta">
          <span>👀 ${it.views || 0} 次浏览</span>
          <span>${it.category ? '📂 ' + escapeHtml(it.category) : ''}</span>
        </div>
        <div class="item-actions">
          <button class="primary" onclick="showDetailById(${it.id})">查看详情</button>
          ${isMine ? `<button class="danger" onclick="deleteItem(${it.id})">删除</button>` : ''}
        </div>
      `;
      list.appendChild(div);
    });
  }

  async function submitItem() {
    const title = document.getElementById('itemTitle').value.trim();
    const contact = document.getElementById('itemContact').value.trim();
    if (!title || !contact) {
      alert('名称和联系方式不能为空');
      return;
    }
    const email = localStorage.getItem('user_email');
    if (!email) { alert('请先登录'); return; }
    if (navigator.vibrate) navigator.vibrate(20);
    try {
      const resp = await fetch('/api/market/add', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email,
          title,
          description: document.getElementById('itemDesc').value.trim(),
          price: document.getElementById('itemPrice').value.trim(),
          contact,
          image_url: document.getElementById('itemImage').value.trim(),
          category: document.getElementById('itemCategory').value
        })
      });
      const data = await resp.json();
      if (data.error) { alert('发布失败：' + data.error); return; }
    } catch (e) { alert('网络错误'); return; }
    document.getElementById('itemTitle').value = '';
    document.getElementById('itemDesc').value = '';
    document.getElementById('itemPrice').value = '';
    document.getElementById('itemContact').value = '';
    document.getElementById('itemImage').value = '';
    document.getElementById('itemCategory').value = '';
    togglePublish();
    await loadItems();
  }

  async function deleteItem(id) {
    if (!confirm('确定删除吗？')) return;
    const email = localStorage.getItem('user_email');
    if (!email) return;
    if (navigator.vibrate) navigator.vibrate(10);
    try {
      await fetch('/api/market/delete', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id, email })
      });
    } catch (e) {}
    await loadItems();
  }

  async function showDetailById(id) {
    if (navigator.vibrate) navigator.vibrate(10);
    const it = allItems.find(x => x.id === id);
    if (!it) return;
    document.getElementById('detailTitle').textContent = it.title;
    document.getElementById('detailDesc').textContent = it.description || '';
    document.getElementById('detailPrice').textContent = it.price ? '💶 €' + it.price : '';
    document.getElementById('detailContact').textContent = '📞 ' + (it.contact || '');
    document.getElementById('detailModal').classList.add('show');
    try {
      await fetch('/api/market/view', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ id })
      });
    } catch (e) {}
  }

  function closeDetail() {
    document.getElementById('detailModal').classList.remove('show');
  }

  function sortBy(type, el) {
    if (navigator.vibrate) navigator.vibrate(10);
    document.querySelectorAll('.sort-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    currentSort = type;
    renderItems();
  }

  // 页面加载时拉数据
  loadItems();
</script>
<script src="/static/js/auth-gate.js"></script>
</body>
</html>
